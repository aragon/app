<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
// Workspace prototype: a workspace of four accounts as one artboard. state = { scope, page, param, wallet, dialog }.
// scope: 'all' | 'meridian' | 'atlas' | 'northstar' | 'safe'. page: overview | todos | proposals | proposal (param = slug) | members | member (param = address)
//   | assets | transactions | permissions | settings | process (param = slug). wallet: '' | 'connected' (nadia.eth). dialog: '' | 'connect' | 'user'.
// nav(target), given to every page part as onNav:
//   'all:<section>'                 all-accounts page (overview, todos, proposals, members, assets, transactions)
//   'account:<id>:<target>'         page of one account; <target> = overview | todos | proposals | proposal:<slug> | members | member:<address> | assets |
//                                   transactions | permissions | settings | process:<slug>
//   '<target>' (no prefix)          the same scope: inside an account it stays in that account ('dashboard' = overview). Bare proposal:/member: targets
//                                   from the all-accounts scope open in the account the slug belongs to (MGP- Meridian, AGC- Atlas, NSP- Northstar; members: Meridian).
// Every page part also gets wallet, onConnect() and scope. Pages by account: DAOs use the Dao* / AtlasDao* / NorthstarDao* parts, the overview and to-dos
// use WsAccountOverview / WsAccountTodos, the Safe (id 'safe') shows WsAccountSafe (SafeFlowPage + review and sign dialogs) for all its pages but overview and to-dos.
class Component extends DCLogic {
  state = { scope: 'all', page: 'overview', param: '', wallet: '', dialog: '' };
  connect = () => this.setState({ dialog: 'connect' });
  openUser = () => this.setState({ dialog: 'user' });
  closeDialog = () => this.setState({ dialog: '' });
  pickWallet = () => this.setState({ wallet: 'connected', dialog: '' });
  disconnect = () => this.setState({ wallet: '', dialog: '' });
  nav = (target) => {
    const ACCOUNTS = ['meridian', 'atlas', 'northstar', 'safe'];
    let t = String(target || 'overview');
    let scope = this.state.scope;
    if (t.indexOf('all:') === 0) { scope = 'all'; t = t.slice(4); }
    else if (t.indexOf('account:') === 0) {
      const rest = t.slice(8);
      const i = rest.indexOf(':');
      scope = i < 0 ? rest : rest.slice(0, i);
      t = i < 0 ? 'overview' : rest.slice(i + 1);
    }
    const i = t.indexOf(':');
    let page = i < 0 ? t : t.slice(0, i);
    const param = i < 0 ? '' : t.slice(i + 1);
    if (page === 'dashboard' || page === '') page = 'overview';
    if (scope === 'all' && (page === 'proposal' || page === 'member' || page === 'process' || page === 'permissions' || page === 'settings')) {
      scope = page === 'proposal' && /^AGC-/.test(param) ? 'atlas' : page === 'proposal' && /^NSP-/.test(param) ? 'northstar' : 'meridian';
    }
    if (scope !== 'all' && ACCOUNTS.indexOf(scope) < 0) scope = 'meridian';
    this.setState({ scope, page, param }, () => {
      try { window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; } catch (e) {}
      try { document.querySelectorAll('.app-page, .app-column').forEach((el) => { el.scrollTop = 0; }); } catch (e) {}
    });
  };
  renderVals() {
    const { scope, page } = this.state;
    const show = {};
    ['overview', 'todos', 'proposals', 'members', 'assets', 'transactions'].forEach((p) => { show['all_' + p] = scope === 'all' && page === p; });
    show.acct_overview = scope !== 'all' && page === 'overview';
    show.acct_todos = scope !== 'all' && page === 'todos';
    ['meridian', 'atlas', 'northstar'].forEach((a) => {
      ['proposals', 'proposal', 'members', 'member', 'assets', 'transactions', 'permissions', 'settings', 'process'].forEach((p) => { show[a + '_' + p] = scope === a && page === p; });
    });
    show.safe_page = scope === 'safe' && page !== 'overview' && page !== 'todos';
    const active = page === 'proposal' ? 'proposals' : page === 'member' ? 'members' : page === 'process' ? 'settings' : page;
    return {
      yes: true, nav: this.nav, show, scope, active, param: this.state.param,
      wallet: this.state.wallet, connect: this.connect, openUser: this.openUser,
      dialog: { connect: this.state.dialog === 'connect', user: this.state.dialog === 'user' },
      closeDialog: this.closeDialog, pickWallet: this.pickWallet, disconnect: this.disconnect
    };
  }
}
</script>
