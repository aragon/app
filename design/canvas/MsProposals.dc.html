<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1531}}'>
// Proposals list of the multisig DAO (apps/app: modules/governance/pages/daoProposalsPage). Mock data:
// design/baseline-check/data.cjs (Atlas Grants Council). The list items are written out one by one at the start of the
// line, not looped or indented: the kit's pagination counts the list's direct children.
class Component extends DCLogic {
  renderVals() {
    // Kit components print proposal dates relative to the viewer's clock ("6 days left"), so dates are offsets from
    // now: the labels then read the same as in the reference screenshot on any day.
    const hour = 3600000;
    const day = 24 * hour;
    const now = Date.now();
    const person = (address, name) => ({ address, name, link: 'MsMember.dc.html' });
    return {
      yes: true,
      count: 6,
      pageSize: 10,
      dates: {
        agc6: now + 8 * day + hour,
        agc5: now + 6 * day + hour,
        agc4: now + 4 * day + hour,
        agc3: now - 13 * day - hour,
        agc2: now - 23 * day - hour,
        agc1: now - 34 * day - hour
      },
      people: {
        lena: person('0x826e7eb63d237333d9063dc74e7ce8e222b0fc05', 'lenaweber.eth'),
        nadia: person('0x9cb2a4c4d6169507a60086dbdb9616ecff27d98a', 'nadia.eth'),
        tomas: person('0xb8616ba616766bd8fbdc69ded1b02e41b482b98e', 'tomas.eth'),
        chenwei: person('0x8a25faabbd80f71248328cf3a5867d3168210a46', 'chenwei.eth'),
        sofia: person('0xd7ae7a08d86bdd5c6d4d95961f6af3264351ae7a', 'sofiaruiz.eth')
      },
      pluginLink: { href: 'https://etherscan.io/address/0x2c50cdfaebb0d839f5efdfd5cb0addc1ab8ca5ae', isOnchainEntity: true },
      launchLink: { href: 'https://etherscan.io/tx/0x145a7ae04cba403de6e76cd3eb13de56deb884cdfb97af3e9de4f224aa7952c3' }
    };
  }
}
</script>
