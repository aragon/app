// DAO member details (apps/app: modules/governance/pages/daoMemberDetailsPage: voteList, daoProposalList,
// explore/daoList). Mock data: design/baseline-check/data.cjs (Atlas Grants Council, lenaweber.eth).
// The list items are written out one by one at the start of the line, not looped or indented: the kit's pagination
// counts the list's direct children, and the canvas runtime counts a loop as one child and indentation as another.
class Component extends DCLogic {
  renderVals() {
    // Kit components print dates relative to the viewer's clock ("2 days ago"), so dates are offsets from now.
    const hour = 3600000;
    const day = 24 * hour;
    const now = Date.now();
    return {
      yes: true, one: 1, three: 3, five: 5,
      breadcrumbs: [{ href: 'MsMembers.dc.html', label: 'Members' }, { label: 'lenaweber.eth' }],
      lena: { address: '0x826e7eb63d237333d9063dc74e7ce8e222b0fc05', name: 'lenaweber.eth', link: 'MsMember.dc.html' },
      dates: {
        v4: now - 3 * day,
        v2: now - 30 * day,
        v1: now - 34 * day,
        agc6: now + 8 * day + hour
      },
      daos: { meridian: '0xc8c322384903ee8f11f511b71d0504237886bcde', solace: '0xe2f001c33fca00ad672f2a79abbcd567803178ee', harbor: '0x506b251c4cefd8a679955e7d17c8968b3d994693' },
      addressLink: { href: 'https://etherscan.io/address/0x826e7eb63d237333d9063dc74e7ce8e222b0fc05', isOnchainEntity: true }
    };
  }
}
