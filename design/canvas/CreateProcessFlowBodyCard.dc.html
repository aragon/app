<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create process: body card</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/tokens.css">
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="ds/aragon-gov-ui-kit/components/lib/react-hook-form.js"></script>
<script src="ds/aragon-gov-ui-kit/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="GovUiKit.GukModulesProvider">
<x-import component-from-global-scope="GovUiKit.Accordion.Container" is-multi="{{yes}}" default-value="{{openValue}}">
  <x-import component-from-global-scope="GovUiKit.Accordion.Item" value="{{id}}">
    <x-import component-from-global-scope="GovUiKit.Accordion.ItemHeader">
      <div class="body-info">
        <div class="body-info__row">
          <p class="body-info__name process-body__external">{{name}}<sc-if value="{{hasLogo}}" hint-placeholder-val="{{no}}"><x-import component-from-global-scope="GovUiKit.Avatar" size="sm" src="assets/safeWallet.png"></x-import></sc-if></p>
          <sc-if value="{{hasAddress}}" hint-placeholder-val="{{no}}"><p class="body-info__address">{{address}}</p></sc-if>
        </div>
        <p class="body-info__subtitle">{{subtitle}}</p>
      </div>
    </x-import>
    <x-import component-from-global-scope="GovUiKit.Accordion.ItemContent">
      <div class="process-body__content">
        <x-import component-from-global-scope="GovUiKit.DefinitionList.Container" class-name="w-full">
          <sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
            <div class="{{row.wrap}}">
              <sc-if value="{{row.isTag}}" hint-placeholder-val="{{no}}">
                <x-import component-from-global-scope="GovUiKit.DefinitionList.Item" term="{{row.term}}"><x-import component-from-global-scope="GovUiKit.Tag" label="{{row.text}}" variant="{{row.variant}}" class-name="max-w-fit"></x-import></x-import>
              </sc-if>
              <sc-if value="{{row.isNote}}" hint-placeholder-val="{{no}}">
                <x-import component-from-global-scope="GovUiKit.DefinitionList.Item" term="{{row.term}}">{{row.text}}<p class="process-body__note">{{row.note}}</p></x-import>
              </sc-if>
              <sc-if value="{{row.isLink}}" hint-placeholder-val="{{no}}">
                <x-import component-from-global-scope="GovUiKit.DefinitionList.Item" term="{{row.term}}" link="{{row.link}}" description="{{row.description}}" children="{{row.text}}"></x-import>
              </sc-if>
              <sc-if value="{{row.isText}}" hint-placeholder-val="{{yes}}">
                <x-import component-from-global-scope="GovUiKit.DefinitionList.Item" term="{{row.term}}" children="{{row.text}}"></x-import>
              </sc-if>
            </div>
          </sc-for>
        </x-import>
        <sc-if value="{{hasActions}}" hint-placeholder-val="{{yes}}">
          <div class="{{actionsClass}}">
            <sc-if value="{{canEdit}}" hint-placeholder-val="{{yes}}"><x-import component-from-global-scope="GovUiKit.Button" size="md" variant="secondary" on-click="{{onEdit}}">Edit</x-import></sc-if>
            <x-import component-from-global-scope="GovUiKit.Dropdown.Container" custom-trigger="{{moreTrigger}}" size="md" constrain-content-width="{{no}}">
              <x-import component-from-global-scope="GovUiKit.Dropdown.Item" on-click="{{onRemove}}">Remove body</x-import>
            </x-import>
          </div>
        </sc-if>
      </div>
    </x-import>
  </x-import>
</x-import>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"vm":{"editor":null}}'>
// One governance body of the Create process designer: the Accordion of GovernanceBodyField with its GovernanceBodyInfo header,
// the plugin's read-only fields (DefinitionList) and, unless read-only, the Edit button and the "More" menu with "Remove body"
// (apps/app: modules/createDao/components/createProcessForm/createProcessFormGovernance/fields/governanceBodyField/*,
// shared/components/governanceBodyInfo, plugins/{token,multisig}Plugin/components/*ProcessBodyField).
// Props: vm = { id, name, address (truncated; shown right of the name), logo (Safe logo), subtitle ("Multisig v1.3"),
//   rows: [{ term, kind: 'text'|'tag'|'note'|'link', text, note, variant, link, description }], open (accordion expanded),
//   actions (false = read-only), canEdit, onEdit, onRemove }.
class Component extends DCLogic {
  renderVals() {
    const vm = this.props.vm || {};
    const R = window.React, G = window.GovUiKit;
    const rows = (vm.rows || []).map((r, i, a) => ({ ...r, wrap: i < a.length - 1 ? 'dl-row' : '',
      isTag: r.kind === 'tag', isNote: r.kind === 'note', isLink: r.kind === 'link', isText: !r.kind || r.kind === 'text' }));
    const canEdit = vm.canEdit !== false;
    return { yes: true, no: false, id: vm.id || 'body', name: vm.name || '', hasLogo: !!vm.logo, address: vm.address, hasAddress: !!vm.address,
      subtitle: vm.subtitle, rows, openValue: vm.open ? [vm.id || 'body'] : undefined,
      hasActions: vm.actions !== false, canEdit, actionsClass: 'process-body__actions' + (canEdit ? '' : ' process-body__actions--end'),
      onEdit: vm.onEdit || (() => undefined), onRemove: vm.onRemove || (() => undefined),
      moreTrigger: R.createElement(G.Button, { className: 'w-fit', iconRight: 'DOTS_VERTICAL', size: 'md', variant: 'tertiary' }, 'More') };
  }
}
</script>
</body>
</html>
