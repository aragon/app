<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workspace form metadata</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/tokens.css">
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="ds/aragon-gov-ui-kit/components/lib/react-hook-form.js"></script>
<script src="ds/aragon-gov-ui-kit/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="GovUiKit.GukModulesProvider">
<div class="wizard-step__content">
  <div class="wizard-step__header">
    <x-import component-from-global-scope="GovUiKit.Heading" size="h1">{{title}}</x-import>
    <p class="wizard-step__description">{{intro}}</p>
  </div>
  <div class="wizard-fields">
    <x-import component-from-global-scope="GovUiKit.InputText" label="Workspace name" max-length="{{d128}}" value="{{name}}" on-change="{{onName}}" on-blur="{{onNameBlur}}" variant="{{nameVariant}}" alert="{{nameAlert}}"></x-import>
    <x-import component-from-global-scope="GovUiKit.InputFileAvatar" label="Logo" help-text="JPG, PNG, or GIF of no more than 1 MB and less than 1024x1024px." is-optional="{{yes}}" max-file-size="{{maxFile}}" max-dimension="{{maxDim}}" value="{{avatar}}" on-change="{{onAvatar}}" alert="{{avatarAlert}}"></x-import>
    <x-import component-from-global-scope="GovUiKit.TextArea" label="Description" help-text="This is shown on the workspace pages so visitors know what this workspace covers." is-optional="{{yes}}" max-length="{{d480}}" value="{{description}}" on-change="{{onDescription}}" variant="{{descriptionVariant}}" alert="{{descriptionAlert}}" wrapper-class-name="{{descriptionWrapper}}"></x-import>
    <div class="resources-input">
      <x-import component-from-global-scope="GovUiKit.InputContainer" id="resourcesInput" label="Resources" is-optional="{{yes}}" help-text="These are shown as links on the workspace pages. They are best suited for your website, social media, or other communication channels." use-custom-wrapper="{{yes}}"></x-import>
      <sc-if value="{{hasResources}}" hint-placeholder-val="{{no}}">
        <div class="resources-input__list">
          <sc-for list="{{resourceItems}}" as="r" hint-placeholder-count="1">
            <x-import component-from-global-scope="GovUiKit.Card" class-name="shadow-neutral-sm resources-input__item">
              <x-import component-from-global-scope="GovUiKit.InputText" label="URL" placeholder="https://" value="{{r.url}}" on-change="{{r.onUrl}}" on-blur="{{r.onUrlBlur}}" variant="{{r.urlVariant}}" alert="{{r.urlAlert}}"></x-import>
              <x-import component-from-global-scope="GovUiKit.InputText" label="Link text" is-optional="{{yes}}" max-length="{{d40}}" placeholder="{{r.placeholder}}" value="{{r.name}}" on-change="{{r.onName}}"></x-import>
              <div class="resources-input__menu">{{r.menu}}</div>
            </x-import>
          </sc-for>
        </div>
      </sc-if>
      <x-import component-from-global-scope="GovUiKit.Button" variant="tertiary" size="md" icon-left="PLUS" class-name="w-fit" on-click="{{onAddResource}}">Add</x-import>
    </div>
  </div>
</div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":null},"intro":{"editor":null},"model":{"editor":null},"$preview":{"width":1000,"height":1100}}'>
// Step "Describe your workspace" / "Edit details" of the workspace wizard: heading, description and the fields
// (apps/app: modules/workspace/components/createWorkspaceForm/createWorkspaceFormMetadata, shared/components/forms/
// avatarInput, resourcesInput). It is `.wizard-step__content`: put it first in `.wizard-step`, then the footer part.
// Props:
//   title, intro   step heading and description (copy differs between create and edit).
//   model          { name, nameError, description, descriptionError, descriptionFocused, avatar, avatarError,
//                    resources: [{ url, name, urlError, onUrl(text), onUrlBlur(), onName(text), onRemove() }],
//                    onName(text), onNameBlur(), onDescription(text), onAvatar(value), onAddResource() }
//                  Errors are the messages to print under the field (empty = none); callbacks are optional.
//   descriptionFocused draws the description focused (primary border and shadow), as the screenshot after typing.

// Row menu: the kit Dropdown whose trigger is the tertiary dots button, one item (app: Dropdown.Container customTrigger).
const rowMenu = (label, onRemove) => {
  const R = window.React, G = window.GovUiKit;
  return R.createElement(G.Dropdown.Container, { constrainContentWidth: false, size: 'md',
    customTrigger: R.createElement(G.Button, { iconLeft: 'DOTS_VERTICAL', size: 'lg', variant: 'tertiary', 'aria-label': 'Options' }) },
    R.createElement(G.Dropdown.Item, { onClick: onRemove }, label));
};
const noop = () => undefined;
const ev = (f) => (e) => (f || noop)(e && e.target ? e.target.value : e);
const alertOf = (msg) => (msg ? { message: msg, variant: 'critical' } : undefined);
const variantOf = (msg) => (msg ? 'critical' : undefined);

class Component extends DCLogic {
  renderVals() {
    const m = this.props.model || {};
    const resources = (m.resources || []).map((r) => ({
      url: r.url ?? '', name: r.name ?? '',
      placeholder: r.url ? r.url : undefined,
      urlVariant: variantOf(r.urlError), urlAlert: alertOf(r.urlError),
      onUrl: ev(r.onUrl), onUrlBlur: r.onUrlBlur || noop, onName: ev(r.onName),
      menu: rowMenu('Remove', r.onRemove || noop)
    }));
    return {
      yes: true, no: false, d128: 128, d480: 480, d40: 40, maxFile: 1048576, maxDim: 1024,
      title: this.props.title, intro: this.props.intro,
      name: m.name ?? '', onName: ev(m.onName), onNameBlur: m.onNameBlur || noop,
      nameVariant: variantOf(m.nameError), nameAlert: alertOf(m.nameError),
      avatar: m.avatar, onAvatar: m.onAvatar || noop, avatarAlert: alertOf(m.avatarError),
      description: m.description ?? '', onDescription: ev(m.onDescription),
      descriptionVariant: variantOf(m.descriptionError), descriptionAlert: alertOf(m.descriptionError),
      descriptionWrapper: m.descriptionFocused ? 'border-primary-400 shadow-primary' : undefined,
      resourceItems: resources, hasResources: resources.length > 0,
      onAddResource: m.onAddResource || noop
    };
  }
}
</script>
</body>
</html>
