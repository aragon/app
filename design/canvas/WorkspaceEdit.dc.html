<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit workspace</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/tokens.css">
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="ds/aragon-gov-ui-kit/components/lib/react-hook-form.js"></script>
<script src="ds/aragon-gov-ui-kit/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="GovUiKit.GukModulesProvider">
<div class="app-page">
  <dc-import name="WizardNav" wizard-name="Edit workspace" exit-href="WorkspaceOverview.dc.html" wallet-connected="{{no}}" hint-size="100%,91px"></dc-import>
  <main class="wizard-main">
    <form class="wizard-form" onsubmit="return false">
      <dc-import name="WizardProgress" step="{{step}}" total="{{total}}" next-step="Edit targets" hint-size="100%,36px"></dc-import>
      <div class="wizard-step">
        <dc-import name="WorkspaceFormMetadata" title="Edit details" intro="Update how your workspace is described to visitors." model="{{model}}" hint-size="100%,900px"></dc-import>
        <dc-import name="WorkspaceWizardFooter"  hint-size="100%,48px"></dc-import>
      </div>
    </form>
  </main>
  <dc-import name="Footer" hint-size="100%,65px"></dc-import>
</div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1488}}'>
// Edit workspace, step 1 of 3 (apps/app: app/workspace/[workspaceId]/edit, layoutWizardEditWorkspace.tsx, workspaceEditPage(Client).tsx ->
// workspaceWizard.tsx; step content createWorkspaceFormMetadata.tsx). Values: the "Meridian Ecosystem" seed of design/baseline-check/lib.cjs.
// Wallet disconnected. Parts: WorkspaceFormMetadata, WorkspaceWizardFooter; interactive version FlowWorkspaceEdit.
class Component extends DCLogic {
  renderVals() {
    return { yes: true, no: false, step: 1, total: 3, model: { name: 'Meridian Ecosystem', description: 'Treasury and governance of Meridian DAO and the Atlas Grants Council in one place.', resources: [{ name: 'Website', url: 'https://meridian.xyz' }] } };
  }
}
</script>
</body>
</html>
