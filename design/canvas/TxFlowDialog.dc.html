<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transaction flow dialog</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/tokens.css">
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="ds/aragon-gov-ui-kit/components/lib/react-hook-form.js"></script>
<script src="ds/aragon-gov-ui-kit/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="GovUiKit.GukModulesProvider">
<x-import component-from-global-scope="GovUiKit.Dialog.Root" open="{{isOpen}}" on-open-change="{{openChange}}" on-open-auto-focus="{{noFocus}}" container-class-name="dlg-container--static" hidden-title="Transaction" hidden-description="Transaction dialog">
  <x-import component-from-global-scope="GovUiKit.Dialog.Header" title="{{title}}" description="{{description}}"></x-import>
  <x-import component-from-global-scope="GovUiKit.Dialog.Content">
    <div class="tx-dialog__body">
      <sc-if value="{{showVote}}" hint-placeholder-val="{{no}}">
        <x-import component-from-global-scope="GovUiKit.VoteProposalDataListItem.Structure" proposal-id="{{summary.proposalId}}" proposal-title="{{summary.proposalTitle}}" vote-indicator="{{summary.voteIndicator}}" vote-indicator-description="{{summary.voteIndicatorDescription}}"></x-import>
      </sc-if>
      <sc-if value="{{showProposal}}" hint-placeholder-val="{{no}}">
        <x-import component-from-global-scope="GovUiKit.ProposalDataListItem.Structure" status="DRAFT" title="{{summary.title}}" summary="{{summary.summary}}" publisher="{{publisher}}"></x-import>
      </sc-if>
      <sc-if value="{{showDao}}" hint-placeholder-val="{{no}}">
        <x-import component-from-global-scope="GovUiKit.DaoDataListItem.Structure" name="{{summary.name}}" description="{{summary.description}}" network="{{summary.network}}"></x-import>
      </sc-if>
      <ul class="tx-steps">
        <sc-for list="{{rows}}" as="row" hint-placeholder-count="5">
          <li class="tx-step">
            <div class="tx-step__main">
              <sc-if value="{{row.spinner}}" hint-placeholder-val="{{no}}">
                <div class="tx-step__spinner"><x-import component-from-global-scope="GovUiKit.Spinner" size="md" variant="{{row.spinnerVariant}}" is-loading="{{row.loading}}"></x-import></div>
              </sc-if>
              <sc-if value="{{row.isSuccess}}" hint-placeholder-val="{{no}}">
                <x-import component-from-global-scope="GovUiKit.AvatarIcon" icon="CHECKMARK" size="sm" variant="success"></x-import>
              </sc-if>
              <sc-if value="{{row.isError}}" hint-placeholder-val="{{no}}">
                <x-import component-from-global-scope="GovUiKit.AvatarIcon" icon="CRITICAL" size="sm" variant="critical"></x-import>
              </sc-if>
              <p class="tx-step__label {{row.labelClass}}">{{row.label}}</p>
            </div>
            <sc-if value="{{row.wallet}}" hint-placeholder-val="{{no}}">
              <div class="tx-step__addon">
                <p class="tx-step__addon-label">Wallet</p>
                <x-import component-from-global-scope="GovUiKit.Icon" icon="BLOCKCHAIN_WALLET" size="md" class-name="text-neutral-300"></x-import>
              </div>
            </sc-if>
            <sc-if value="{{row.details}}" hint-placeholder-val="{{no}}">
              <x-import component-from-global-scope="GovUiKit.Link" href="{{explorerHref}}" is-external="{{yes}}">Details</x-import>
            </sc-if>
          </li>
        </sc-for>
      </ul>
    </div>
  </x-import>
  <x-import component-from-global-scope="GovUiKit.Dialog.Footer" primary-action="{{primary}}" secondary-action="{{secondary}}"></x-import>
</x-import>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"open":{"editor":"boolean","default":true},"simulateRejection":{"editor":"boolean","default":false},"title":{"editor":"text","default":"Submit vote"},"description":{"editor":"text","default":"To submit your vote, confirm the onchain transaction in your wallet."},"submitLabel":{"editor":"text","default":"Submit vote"},"successLabel":{"editor":"text","default":"View proposal"},"steps":{"editor":null},"summary":{"editor":null},"onClose":{"editor":null},"onSuccess":{"editor":null},"$preview":{"width":1440,"height":900}}'>
// TxFlowDialog: the app's TransactionDialog (apps/app: shared/components/transactionDialog/{transactionDialog,
// transactionDialogShell,transactionDialogFooter}.tsx + shared/components/transactionStatus/transactionStatusStep),
// as an interactive part with a SIMULATED wallet (no chain). Mount it inside a flow and drive `open` from the flow's state:
//   <dc-import name="TxFlowDialog" open="{{txOpen}}" title="Submit vote" description="To submit your vote, ..."
//     steps="{{txSteps}}" submit-label="Submit vote" on-close="{{closeTx}}" on-success="{{txDone}}"
//     hint-size="100%,900px"></dc-import>
// The dialog is a kit Dialog.Root (portal, blurred overlay); the part itself takes no space. Props:
//   open               bool, shows the dialog. Every open starts again at the idle state.
//   title, description header copy.
//   steps              array of step labels shown (as done) before "Prepare transaction", e.g. ['Pin data on IPFS']; may be empty.
//   submitLabel        label of the primary button while confirming/indexing (the app shows the dialog's own submit label
//                      loading there). Idle shows "Sign transaction", as the app does for the APPROVE step.
//   successLabel       optional label of the primary button on success (the app's flow link: "View proposal", "View DAO",
//                      "Done"). Default: "View DAO" if the title mentions a DAO, "View proposal" for proposal/vote, else "Done".
//   summary            optional object drawn above the steps like the dialog `children` in the app:
//                      { type: 'vote', proposalId, proposalTitle, voteIndicator: 'yes'|'no'|'abstain', voteIndicatorDescription }
//                      or { type: 'proposal', title, summary } or { type: 'dao', name, description, network }.
//   simulateRejection  bool (tweak): the wallet rejects the signature -> "Rejected by wallet" and primary "Resend to wallet".
//                      Retry repeats it while the tweak is on; switch it off and retry to reach success.
//   onClose            function, called by Close, Escape and a click on the overlay. (Without it the part resets itself.)
//   onSuccess          function, called by the success button (the app closes the dialog and runs the flow link then).
// Simulated sequence (state `phase`): idle -> click "Sign transaction" -> awaiting (button "Awaiting signature", step
// "Sign transaction" pending) ~1.5 s -> confirming (Sign done, "Confirm transaction" pending with the "Details" explorer
// link, Close disabled) ~1.2 s -> indexing ("Index onchain data" pending) ~0.8 s -> success (all done, primary = successLabel).
// Source-only: every state except idle (no screenshot exists); drawn from transactionDialogFooter / transactionStatusStep.
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 'idle' };
    this.timers = [];
  }
  componentDidUpdate(prev) {
    if (prev.open !== this.props.open) this.reset();
  }
  componentWillUnmount() { this.clear(); }
  clear() { this.timers.forEach((t) => clearTimeout(t)); this.timers = []; }
  reset() { this.clear(); this.setState({ phase: 'idle' }); }
  later(phase, ms) { this.timers.push(setTimeout(() => this.setState({ phase }), ms)); }
  sign() {
    this.clear();
    this.setState({ phase: 'awaiting' });
    if (this.props.simulateRejection) { this.later('rejected', 1500); return; }
    this.later('confirming', 1500);
    this.later('indexing', 2700);
    this.later('success', 3500);
  }
  close() {
    if (typeof this.props.onClose === 'function') this.props.onClose();
    else this.reset();
  }
  renderVals() {
    const p = this.props;
    const phase = this.state.phase;
    const title = p.title != null ? p.title : 'Submit vote';
    const submit = p.submitLabel != null ? p.submitLabel : 'Submit vote';
    const successLabel = p.successLabel || (/dao/i.test(title) ? 'View DAO' : /proposal|vote/i.test(title) ? 'View proposal' : 'Done');
    const sum = p.summary || null;

    const sign = { idle: 'idle', awaiting: 'pending', rejected: 'error' }[phase] || 'success';
    const confirm = { confirming: 'pending', indexing: 'success', success: 'success' }[phase] || 'idle';
    const index = { indexing: 'pending', success: 'success' }[phase] || 'idle';
    const row = (label, state, extra) => Object.assign({
      label,
      spinner: state === 'idle' || state === 'pending',
      loading: state === 'pending',
      spinnerVariant: state === 'pending' ? 'primary' : 'neutral',
      isSuccess: state === 'success',
      isError: state === 'error',
      labelClass: 'tx-step__label--' + state,
      wallet: false, details: false
    }, extra);
    const rows = (Array.isArray(p.steps) ? p.steps : []).map((l) => row(l, 'success'))
      .concat([
        row('Prepare transaction', 'success'),
        row(sign === 'error' ? 'Rejected by wallet' : 'Sign transaction', sign, { wallet: true }),
        row('Confirm transaction', confirm, { details: phase === 'confirming' }),
        row('Index onchain data', index)
      ]);

    let primary;
    if (phase === 'idle') primary = { label: 'Sign transaction', onClick: () => this.sign() };
    else if (phase === 'awaiting') primary = { label: 'Awaiting signature', isLoading: true };
    else if (phase === 'rejected') primary = { label: 'Resend to wallet', iconLeft: 'RELOAD', onClick: () => this.sign() };
    else if (phase === 'success') primary = { label: successLabel, onClick: () => { if (typeof p.onSuccess === 'function') p.onSuccess(); else this.reset(); } };
    else primary = { label: submit, isLoading: true };
    const secondary = { label: 'Close', onClick: () => this.close(), disabled: phase === 'confirming' || phase === 'indexing' || phase === 'success' };

    return {
      yes: true, no: false,
      isOpen: p.open === undefined ? true : !!p.open,
      title, description: p.description != null ? p.description : '',
      rows, primary, secondary, summary: sum || {},
      showVote: !!sum && sum.type === 'vote',
      showProposal: !!sum && sum.type === 'proposal',
      showDao: !!sum && sum.type === 'dao',
      publisher: { address: '0xa4e7a4d9a6a8dd1b7d7e0f6a6b6e0c3d6a7e8f90', name: 'You' },
      explorerHref: 'https://etherscan.io/tx/0xa0c1147dd6933d0a6f52039c00d3e23f96110a8b39350d57821f6d76450dee0c',
      noFocus: (e) => e.preventDefault(),
      openChange: (o) => { if (!o) this.close(); }
    };
  }
}
</script>
</body>
</html>
