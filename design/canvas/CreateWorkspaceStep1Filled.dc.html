<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create workspace: describe, filled</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/tokens.css">
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="ds/aragon-gov-ui-kit/components/lib/react-hook-form.js"></script>
<script src="ds/aragon-gov-ui-kit/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="GovUiKit.GukModulesProvider">
<div class="app-page">
  <dc-import name="WizardNav" wizard-name="Create workspace" hint-size="100%,91px"></dc-import>
  <main class="wizard-main">
    <form class="wizard-form">
      <dc-import name="WizardProgress" step="{{step}}" total="{{total}}" next-step="Add targets" hint-size="100%,36px"></dc-import>
      <div class="wizard-step">
        <dc-import name="WorkspaceFormMetadata" title="Describe your workspace" intro="Describe your workspace so visitors know what it covers. Don't worry if these aren't final—any of these fields can be changed later." model="{{model}}" hint-size="100%,900px"></dc-import>
        <dc-import name="WorkspaceWizardFooter" next-href="CreateWorkspaceStep2.dc.html" hint-size="100%,48px"></dc-import>
      </div>
    </form>
  </main>
  <dc-import name="Footer" hint-size="100%,65px"></dc-import>
</div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1339}}'>
// Create workspace, step 1 filled: "Meridian Ecosystem" and a description that still has focus (descriptionFocused). Same parts as
// CreateWorkspaceStep1 with other props; interactive version FlowCreateWorkspace.
class Component extends DCLogic {
  renderVals() {
    return { yes: true, no: false, step: 1, total: 3, model: { name: 'Meridian Ecosystem', description: 'Treasury and governance of Meridian DAO and the Atlas Grants Council in one place.', descriptionFocused: true } };
  }
}
</script>
</body>
</html>
