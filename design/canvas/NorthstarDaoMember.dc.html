<sc-if value="{{vshow.r5}}" hint-placeholder-val="{{no}}"><x-import component-from-global-scope="GovUiKit.VoteProposalDataListItem.Structure" proposal-id="{{v.r5.id}}" proposal-title="{{v.r5.title}}" vote-indicator="{{v.r5.ind}}" date="{{v.r5.date}}" href="{{v.r5.href}}"></x-import></sc-if>

<x-import component-from-global-scope="GovUiKit.DaoDataListItem.Structure" name="Atlas Grants Council" ens="atlas-grants.dao.eth" address="{{daos.atlas}}" logo-src="assets/mock/avatar/atlas.svg" description="The Atlas Grants Council reviews and funds open-source tooling, research and community initiatives. Grants are approved by a 3-of-5 elected council." network="Ethereum" href="AtlasDao.dc.html"></x-import>
<x-import component-from-global-scope="GovUiKit.DaoDataListItem.Structure" name="Solace Collective" ens="solace.dao.eth" address="{{daos.solace}}" logo-src="assets/mock/avatar/solace.svg" description="An artist-run collective funding generative art residencies." network="Base" href="#"></x-import>
</x-import>
                <x-import component-from-global-scope="GovUiKit.DataList.Pagination"></x-import>

          <aside class="page-aside">

        <dc-import name="TxFlowDialog" open="{{txOpen}}" title="Delegate" description="To delegate to this address, confirm the onchain transaction in your wallet." steps="{{noSteps}}" submit-label="Delegate" success-label="View members" on-close="{{closeTx}}" on-success="{{txDone}}" hint-size="100%,1px"></dc-import>
</div>

<script type="text/x-dc" data-dc-script data-props='{"onNav":{"editor":null},"wallet":{"editor":null},"onConnect":{"editor":null},"member":{"editor":"text","default":"0x9cb2a4c4d6169507a60086dbdb9616ecff27d98a"}}'>
// PART of the Northstar DAO prototype (mounted by NorthstarDao.dc.html). Props: member (address, lowercase), onNav(target), wallet ('connected' | ''), onConnect().
// DAO member details (apps/app: modules/governance/pages/daoMemberDetailsPage: delegationSection, voteList, daoProposalList, explore/daoList).
// Mock data: data-spp.cjs (the 12 people of Northstar). Header, stats and details follow the member prop. Voting activity has a toggle per body
// (as the app shows for a multi-body DAO): NSP Token Holders (veto votes), Core Team (approvals), and the two Safes (a Safe's confirmations are not
// indexed as votes, so those tabs are empty). The lists are built from the vote tables of the mock data, so each member shows their own votes
// and proposals. Delegate NSP: disconnected calls onConnect; connected opens TxFlowDialog (simulated signing); success marks the delegation.
// The list items are written out one per line at column 0, each in its own <sc-if> (the kit pagination counts direct children).
const NSM_PEOPLE = [["nadia", "0x9cb2a4c4d6169507a60086dbdb9616ecff27d98a", "0x9CB2A4c4d6169507A60086dBDB9616eCFf27D98A", "nadia.eth", 3200000, 41], ["kofi", "0xac6399087027f972e6d2ab830dc9b33cda035642", "0xAC6399087027F972e6D2AB830dC9b33CDa035642", "kofi-mensah.eth", 2450000, 28], ["lena", "0x826e7eb63d237333d9063dc74e7ce8e222b0fc05", "0x826e7eB63D237333d9063DC74E7Ce8e222B0FC05", "lenaweber.eth", 1980000, 17], ["ines", "0xcdc7d3f9b0174765aaf7be715f9c357c663a1c81", "0xCDC7d3F9b0174765aaf7be715f9C357C663A1C81", "ines-alvarez.eth", 1640000, 9], ["sofia", "0xd7ae7a08d86bdd5c6d4d95961f6af3264351ae7a", "0xd7AE7a08d86bDd5C6D4d95961F6AF3264351aE7a", "sofiaruiz.eth", 1210000, 6], ["ravi", "0x865f1f2c83b0ee4a9116da01bcc1e2661086e089", "0x865F1f2c83b0ee4a9116dA01BCc1e2661086E089", "", 980000, 0], ["dmitri", "0x7331c334835fd8c5d6a351f67a517e6b0f452f63", "0x7331c334835fD8C5D6a351F67a517E6b0F452F63", "dmitri.eth", 860000, 3], ["tomas", "0xb8616ba616766bd8fbdc69ded1b02e41b482b98e", "0xb8616bA616766BD8FbDC69deD1B02E41b482b98E", "tomas.eth", 720000, 0], ["yuki", "0x66b7d87059d8d1cf9da8842075250fd8a2e20805", "0x66B7d87059D8d1cF9DA8842075250Fd8a2E20805", "", 550000, 0], ["chen", "0x8a25faabbd80f71248328cf3a5867d3168210a46", "0x8a25fAaBBD80f71248328cf3A5867D3168210A46", "chenwei.eth", 430000, 0], ["oren", "0xde0da1b2c117fda1a3e2dc30bc213d3b6baf40ec", "0xdE0da1B2C117fDa1A3e2dc30bC213d3B6baF40EC", "oren.eth", 0, 0], ["priya", "0x78084649f806810005aca274afe28cd141a74124", "0x78084649f806810005acA274Afe28Cd141A74124", "priya-n.eth", 0, 0]];
const NSM_TITLES = { 1: 'Migrate NSP staking to liquid restaking', 2: 'Fund the Q4 2026 security audit program', 3: 'Onboard Wintermute as a designated solver', 4: 'Deploy Northstar v3 settlement on Base', 5: 'Raise the protocol fee switch to 25 bps', 6: 'Launch the Northstar Ecosystem Grants round 3', 7: 'Increase the bug bounty ceiling to 1M USDC', 8: 'Seed NSP/ETH liquidity on Uniswap v4' };
const NSM_SUMMARIES = { 1: 'Replace the native NSP staking module with a liquid restaking wrapper so stakers can use stNSP as collateral across integrated money markets.', 2: 'Allocate 240,000 USDC to the audit program covering the v3 settlement contracts, the solver registry and the cross-rollup bridge adapters.', 3: 'Add Wintermute to the designated solver set with a 500,000 NSP bond, enabling it to settle intents on all supported rollups.', 4: 'Send 40 ETH to the Base Operations Safe to deploy and seed the v3 settlement contracts on Base, following the successful Arbitrum launch.', 5: 'Increase the protocol fee on settled volume from 10 to 25 basis points and route the additional revenue to the treasury.', 6: 'Fund grants round 3 with 300,000 USDC and 1,500,000 NSP for solver tooling, intent explorers and research on MEV-aware settlement.', 7: 'Raise the maximum Immunefi payout for critical vulnerabilities from 250,000 to 1,000,000 USDC and pre-fund the bounty Safe with 250,000 USDC.', 8: 'Move 2,000,000 NSP and 220 ETH to the Liquidity Operations Safe to seed an NSP/ETH v4 pool with a dynamic-fee hook.' };
const NSM_CREATOR = { 1: 'dmitri', 2: 'kofi', 3: 'sofia', 4: 'nadia', 5: 'lena', 6: 'ines', 7: 'tomas', 8: 'kofi' };
// vote tables of data-spp.cjs: Core Team approvals and token veto votes (yes = veto), with the day each vote was cast (offset from now)
const NSM_MS = { 1: ['tomas'], 2: ['nadia', 'sofia'], 3: ['sofia', 'tomas'], 4: ['nadia', 'tomas'], 5: ['sofia', 'tomas'], 6: ['sofia', 'tomas'], 7: ['sofia', 'tomas'], 8: ['sofia'] };
const NSM_MS_DAY = { 1: -33, 2: -29, 3: -21, 4: -16, 5: -14, 6: -8, 7: -3, 8: -1 };
const NSM_TV = { 2: { yes: ['dmitri'], no: ['kofi'] }, 4: { yes: ['ravi', 'yuki'], no: ['lena', 'sofia'], abstain: ['chen'] }, 5: { yes: ['kofi', 'ines', 'ravi', 'dmitri', 'yuki', 'chen'], no: ['nadia'] }, 6: { yes: ['ines', 'ravi'], no: ['tomas'] } };
const NSM_TV_DAY = { 2: -24, 4: -10, 5: -8, 6: -2 };
const NSM_fmt = (n) => n >= 1e6 ? String(Math.round(n / 1e4) / 100) + 'M' : n >= 1e3 ? String(Math.round(n / 1e3)) + 'K' : String(n);
class Component extends DCLogic {
  // Links to other DAO pages carry href="#nav:<target>"; one delegated handler turns them into onNav(target).
  click = (e) => {
    const a = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (!a) return;
    const h = a.getAttribute('href');
    e.preventDefault();
    if (h && h.indexOf('#nav:') === 0 && this.props.onNav) this.props.onNav(h.slice(5));
  };
  constructor(props) {
    super(props);
    this.state = { vbody: 'tv', txOpen: false, delegated: false };
  }
  renderVals() {
    const hour = 3600000, day = 24 * hour, now = Date.now();
    const connected = this.props.wallet === 'connected';
    const nav = (t) => { if (this.props.onNav) this.props.onNav(t); };
    const row = NSM_PEOPLE.find((r) => r[1] === String(this.props.member || '').toLowerCase()) || NSM_PEOPLE[0];
    const key = row[0];
    const m = { address: row[1], checksum: row[2], ens: row[3], vpText: row[4] ? NSM_fmt(row[4]) : '0', deleg: row[5] };
    const title = row[3] || row[2].slice(0, 6) + '…' + row[2].slice(-4);
    const SELF = '0x9cb2a4c4d6169507a60086dbdb9616ecff27d98a';
    const self = connected && row[1] === SELF;
    const delegated = this.state.delegated || (connected && window.__nspDelegate === row[1]);
    const btn = {
      variant: self || delegated ? 'secondary' : 'primary',
      label: delegated ? 'Delegated' : self ? 'Manage delegation' : 'Delegate NSP',
      disabled: !!delegated,
      click: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (!connected) { if (typeof this.props.onConnect === 'function') this.props.onConnect(); return; }
        this.setState({ txOpen: true });
      }
    };
    // votes of this member in the chosen body
    const vb = this.state.vbody;
    const votes = [];
    if (vb === 'ms') Object.keys(NSM_MS).forEach((n) => { if (NSM_MS[n].indexOf(key) >= 0) votes.push({ n: Number(n), ind: 'approve', d: NSM_MS_DAY[n] }); });
    if (vb === 'tv') Object.keys(NSM_TV).forEach((n) => { const t = NSM_TV[n]; ['yes', 'no', 'abstain'].forEach((k) => { if ((t[k] || []).indexOf(key) >= 0) votes.push({ n: Number(n), ind: k, d: NSM_TV_DAY[n] }); }); });
    votes.sort((a, b) => b.n - a.n);
    const v = {}, vshow = {};
    for (let i = 0; i < 6; i++) {
      const x = votes[i];
      vshow['r' + i] = !!x;
      v['r' + i] = x ? { id: 'NSP-' + x.n, title: NSM_TITLES[x.n], ind: x.ind, date: now + x.d * day - hour, href: '#nav:proposal:NSP-' + x.n } : { id: '', title: '', ind: 'yes', date: now, href: '#' };
    }
    // proposals created by this member
    const ov = window.__nspState || {};
    const statusOf = (n) => ({
      1: ['REJECTED'], 2: ['EXECUTED'], 3: ['EXPIRED'], 4: [ov.exec4 ? 'EXECUTED' : 'EXECUTABLE'], 5: ['VETOED'],
      6: ov.veto6 ? ['VETOED'] : ['ACTIVE', 'Community veto'],
      7: ov.adv7 ? ['ACTIVE', 'Community veto'] : ['ADVANCEABLE', 'Council approval'],
      8: ov.adv8 ? ['ACTIVE', 'Community veto'] : (ov.core8 || ov.council8) ? ['ADVANCEABLE', 'Council approval'] : ['ACTIVE', 'Council approval']
    })[n];
    const DATES = { 8: 3 * day + hour, 7: day + hour, 6: 4 * day + hour, 5: -2 * day - hour, 4: -4 * day - hour, 3: -17 * day - hour, 2: -17 * day - hour, 1: -29 * day - hour };
    const mine = [8, 7, 6, 5, 4, 3, 2, 1].filter((n) => NSM_CREATOR[n] === key);
    const pr = {}, pshow = {};
    for (let i = 0; i < 2; i++) {
      const n = mine[i];
      pshow['r' + i] = n != null;
      const st = n != null ? statusOf(n) : ['PENDING'];
      pr['r' + i] = n != null ? { id: 'NSP-' + n, title: NSM_TITLES[n], summary: NSM_SUMMARIES[n], status: st[0], ctx: st[1], date: now + DATES[n], publisher: { address: row[1], name: row[3] || undefined, link: '#nav:member:' + row[1] }, href: '#nav:proposal:NSP-' + n } : { id: '', title: '', summary: '', status: 'PENDING', date: now, publisher: { address: row[1] }, href: '#' };
    }
    return {
      click: this.click, m, title, btn, yes: true, no: false, noSteps: [], two: 2, three: 3, five: 5, four: 4,
      breadcrumbs: [{ href: '#nav:members', label: 'Members' }, { label: title }],
      vbody: vb, setVbody: (x) => { if (typeof x === 'string' && x) this.setState({ vbody: x }); },
      v, vshow, vCount: votes.length, pr, pshow, pCount: mine.length,
      emptyVotes: { heading: 'No votes found', description: vb === 'c' || vb === 'g' ? 'Safe confirmations are not indexed as votes.' : 'This member has not voted in this body yet.' },
      emptyProposals: { heading: 'No proposals found', description: 'This member has not created a proposal yet.' },
      daos: { meridian: '0xc8c322384903ee8f11f511b71d0504237886bcde', atlas: '0x31154ff59ea91264c4fd75aba7d8a2fc5a69d368', solace: '0xe2f001c33fca00ad672f2a79abbcd567803178ee' },
      addressLink: { href: 'https://etherscan.io/address/' + row[1], isOnchainEntity: true },
      txOpen: this.state.txOpen, closeTx: () => this.setState({ txOpen: false }),
      txDone: () => { window.__nspDelegate = row[1]; this.setState({ txOpen: false, delegated: true }); }
    };
  }
}
</script>
