<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dialog publish DAO</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/tokens.css">
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="ds/aragon-gov-ui-kit/components/lib/react-hook-form.js"></script>
<script src="ds/aragon-gov-ui-kit/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="dlg-stage">
<dc-import name="CreateDaoStep2Filled" hint-size="1440px,900px"></dc-import>
<dc-import name="TxFlowDialog" open="{{yes}}" title="Publish DAO" description="To publish the DAO, confirm the onchain transaction in your wallet." steps="{{txSteps}}" submit-label="Publish DAO" summary="{{txSummary}}" hint-size="100%,0px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, txSteps: ['Pin data on IPFS'], txSummary: { type: 'dao', name: 'Meridian Labs', description: 'Meridian is a community-owned protocol for cross-chain liquidity routing. MRD holders steer the treasury and fund public goods.', network: 'Ethereum' } };
  }
}
</script>
</body>
</html>
