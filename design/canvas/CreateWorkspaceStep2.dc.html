<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create workspace: targets</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/tokens.css">
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="ds/aragon-gov-ui-kit/components/lib/react-hook-form.js"></script>
<script src="ds/aragon-gov-ui-kit/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="GovUiKit.GukModulesProvider">
<div class="app-page">
  <dc-import name="WizardNav" wizard-name="Create workspace" hint-size="100%,91px"></dc-import>
  <main class="wizard-main">
    <form class="wizard-form">
      <dc-import name="WizardProgress" step="{{step}}" total="{{total}}" next-step="Add accounts" hint-size="100%,36px"></dc-import>
      <div class="wizard-step">
        <dc-import name="WorkspaceFormTargets" title="Add targets" intro="Add the addresses this workspace relates to. This step is optional and can be left empty." model="{{model}}" hint-size="100%,900px"></dc-import>
        <dc-import name="WorkspaceWizardFooter" has-back="{{yes}}" hover="{{yes}}" back-href="CreateWorkspaceStep1Filled.dc.html" next-href="CreateWorkspaceStep3.dc.html" hint-size="100%,48px"></dc-import>
      </div>
    </form>
  </main>
  <dc-import name="Footer" hint-size="100%,65px"></dc-import>
</div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
// Create workspace, step 2 "Add targets", no target added (apps/app: modules/workspace/components/createWorkspaceForm/createWorkspaceFormTargets).
// The pointer still rests on "Next" from step 1, so it is drawn hovered. Parts: WorkspaceFormTargets, WorkspaceWizardFooter; interactive
// version FlowCreateWorkspace.
class Component extends DCLogic {
  renderVals() {
    return { yes: true, no: false, step: 2, total: 3, model: { targets: [] } };
  }
}
</script>
</body>
</html>
