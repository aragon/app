<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dialog vote transaction</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/tokens.css">
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="ds/aragon-gov-ui-kit/components/lib/react-hook-form.js"></script>
<script src="ds/aragon-gov-ui-kit/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
/* the page is scrolled so that its "Submit vote" button sits at y=448 (reference); the sidebar stays */
.dlg-stage .app-column{margin-top:-1064px}
</style>
</helmet>
<div class="dlg-stage">
<dc-import name="ConnectedProposalVoteYes" hint-size="1440px,900px"></dc-import>
<dc-import name="TxFlowDialog" open="{{yes}}" title="Submit vote" description="To submit your vote, confirm the onchain transaction in your wallet." steps="{{txSteps}}" submit-label="Submit vote" summary="{{txSummary}}" hint-size="100%,0px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, txSteps: [], txSummary: { type: 'vote', proposalId: 'MGP-8', proposalTitle: 'Fund the Q1 2027 Ecosystem Grants Program', voteIndicator: 'yes', voteIndicatorDescription: 'to approve' } };
  }
}
</script>
</body>
</html>
