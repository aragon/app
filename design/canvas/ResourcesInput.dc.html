<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Resources input</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/tokens.css">
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="ds/aragon-gov-ui-kit/components/lib/react-hook-form.js"></script>
<script src="ds/aragon-gov-ui-kit/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="GovUiKit.GukModulesProvider">
<div class="resources-input">
  <x-import component-from-global-scope="GovUiKit.InputContainer" id="resources" label="Resources" is-optional="{{yes}}" help-text="{{helpText}}" use-custom-wrapper="{{yes}}"></x-import>
  <sc-if value="{{hasResources}}" hint-placeholder-val="{{no}}">
    <div class="resources-input__list">
      <sc-for list="{{resources}}" as="res" hint-placeholder-count="1">
        <x-import component-from-global-scope="GovUiKit.Card" class-name="resources-input__item shadow-neutral-sm">
          <x-import component-from-global-scope="GovUiKit.InputText" label="URL" placeholder="https://" value="{{res.url}}" on-change="{{res.onUrl}}" on-blur="{{res.onUrlBlur}}" alert="{{res.urlAlert}}"></x-import>
          <x-import component-from-global-scope="GovUiKit.InputText" label="Link text" is-optional="{{yes}}" max-length="{{d40}}" placeholder="{{res.namePlaceholder}}" value="{{res.name}}" on-change="{{res.onName}}"></x-import>
          <div class="resources-input__menu">
            <x-import component-from-global-scope="GovUiKit.Dropdown.Container" custom-trigger="{{res.trigger}}" size="md" constrain-content-width="{{no}}">
              <x-import component-from-global-scope="GovUiKit.Dropdown.Item" on-click="{{res.onRemove}}">Remove</x-import>
            </x-import>
          </div>
        </x-import>
      </sc-for>
    </div>
  </sc-if>
  <x-import component-from-global-scope="GovUiKit.Button" variant="tertiary" size="md" icon-left="PLUS" class-name="w-fit" on-click="{{onAdd}}">Add</x-import>
</div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"vm":{"editor":null}}'>
// ResourcesInput of the wizards (apps/app: shared/components/forms/resourcesInput/resourcesInput.tsx, resourcesInputItem.tsx).
// Props: vm = { helpText, resources: [{ url, name, urlAlert, namePlaceholder, onUrl, onUrlBlur, onName, onRemove }], onAdd }.
class Component extends DCLogic {
  renderVals() {
    const vm = this.props.vm || {};
    const R = window.React, G = window.GovUiKit;
    const noop = () => undefined;
    const resources = (vm.resources || []).map((r) => ({ onUrl: noop, onName: noop, onUrlBlur: noop, onRemove: noop, ...r,
      trigger: R.createElement(G.Button, { iconLeft: 'DOTS_VERTICAL', size: 'lg', variant: 'tertiary' }) }));
    return { yes: true, no: false, d40: 40, helpText: vm.helpText, resources, hasResources: resources.length > 0, onAdd: vm.onAdd || noop };
  }
}
</script>
</body>
</html>
