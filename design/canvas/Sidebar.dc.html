<!doctype html>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 8px 16px 0;">
    <x-import component-from-global-scope="GovUiKit.DaoAvatar" name="{{daoName}}" size="xl"></x-import>
    <div style="display: flex; min-width: 0; flex-direction: column; gap: 6px; line-height: 1.25;">
      <p style="margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 20px; color: var(--color-neutral-800);">{{daoName}}</p>

    </div>
  </div>

  <div style="display: flex; flex-direction: column;">
    <sc-for list="{{links}}" as="l" hint-placeholder-count="7">
      <a href="{{l.href}}" aria-current="{{l.current}}" style="{{l.style}}">
        <sc-if value="{{l.kitIcon}}" hint-placeholder-val="{{true}}">
          <x-import component-from-global-scope="GovUiKit.Icon" icon="{{l.icon}}" style="{{l.iconStyle}}"></x-import>
        </sc-if>
        <sc-if value="{{l.permIcon}}" hint-placeholder-val="{{false}}">

        </sc-if>
        <span>{{l.label}}</span>
      </a>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 16px;">
    <x-import component-from-global-scope="GovUiKit.Button" variant="secondary" size="md" class-name="w-full">Connect</x-import>

      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; align-self: flex-start; color: var(--color-neutral-500); text-decoration: none;">

        <a href="https://aragon.org" style="color: var(--color-neutral-500); text-decoration: none;">Support</a>
        <a href="https://aragon.org" style="color: var(--color-neutral-500); text-decoration: none;">Privacy</a>
        <a href="https://aragon.org" style="color: var(--color-neutral-500); text-decoration: none;">Terms of Service</a>
      </div>
      <div style="display: flex; min-width: 0; align-items: center; gap: 8px;">
        <p style="margin: 0; font-size: 12px;">© 2026 Aragon</p>
        <x-import component-from-global-scope="GovUiKit.Tag" label="v1.44.0 (LOC)" variant="primary"></x-import>
      </div>
    </div>
  </div>
</nav>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","proposals","transactions","assets","members","permissions","settings"],"default":"dashboard"},"daoName":{"editor":null,"default":"Meridian DAO"},"$preview":{"width":256,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const base = 'display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-radius: 12px; font-size: 16px; line-height: 1.25; font-weight: 400; text-decoration: none; white-space: nowrap;';
    const mk = (id, label, icon, href) => {
      const on = id === active;
      return {
        label, icon, href,
        kitIcon: true,
        permIcon: false,
        current: on ? 'page' : undefined,
        style: base + (on ? ' background: #f5f7fa; color: #323f4b;' : ' color: #616e7c;'),
        iconStyle: on ? 'color: #323f4b;' : 'color: #9aa5b1;'
      };
    };
    return {
      yes: true, no: false,
      daoName: this.props.daoName ?? 'Meridian DAO',
      links: [
        mk('dashboard', 'Dashboard', 'APP_DASHBOARD', 'Dashboard.dc.html'),
        mk('proposals', 'Proposals', 'APP_PROPOSALS', 'Proposals.dc.html'),
        mk('transactions', 'Transactions', 'APP_TRANSACTIONS', 'Transactions.dc.html'),
        mk('assets', 'Assets', 'APP_ASSETS', 'Assets.dc.html'),
        mk('members', 'Members', 'APP_MEMBERS', 'Members.dc.html'),
        mk('permissions', 'Permissions', 'APP_PERMISSIONS', 'Permissions.dc.html'),
        mk('settings', 'Settings', 'SETTINGS', 'Settings.dc.html')
      ]
    };
  }
}
</script>
</body>
</html>
