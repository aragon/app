<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DAO navigation</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/tokens.css">
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="ds/aragon-gov-ui-kit/components/lib/react-hook-form.js"></script>
<script src="ds/aragon-gov-ui-kit/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="GovUiKit.GukModulesProvider">
<nav class="app-sidebar" aria-label="DAO navigation">
  <div class="app-sidebar__header">
    <x-import component-from-global-scope="GovUiKit.DaoAvatar" name="{{daoName}}" src="{{daoAvatar}}" size="xl"></x-import>
    <div class="app-sidebar__dao">
      <p class="app-sidebar__dao-name">{{daoName}}</p>
      <x-import component-from-global-scope="GovUiKit.AddressOutput" address="{{daoAddress}}" href="{{explorerUrl}}" is-external="{{yes}}" copy="{{no}}" class-name="w-full text-sm text-neutral-500 sm:text-base"></x-import>
    </div>
  </div>

  <div class="app-nav-links">
    <sc-for list="{{links}}" as="l" hint-placeholder-count="7">
      <a class="app-nav-link" href="{{l.href}}" aria-current="{{l.current}}">
        <x-import component-from-global-scope="GovUiKit.Icon" icon="{{l.icon}}" class-name="{{l.iconClass}}"></x-import>
        {{l.label}}
      </a>
    </sc-for>
  </div>

  <div class="app-sidebar__footer">
    <sc-if value="{{disconnected}}">
      <x-import component-from-global-scope="GovUiKit.Button" variant="secondary" size="md" class-name="w-full">Connect</x-import>
    </sc-if>
    <sc-if value="{{connected}}">
      <button class="app-account" type="button">
        <x-import component-from-global-scope="GovUiKit.MemberAvatar" address="{{user.address}}" ens-name="{{user.name}}" size="md"></x-import>
        <span class="app-account__text">
          <span class="app-account__name">{{user.name}}</span>
          <span class="app-account__address">{{user.short}}</span>
        </span>
        <x-import component-from-global-scope="GovUiKit.Icon" icon="CHEVRON_RIGHT" size="md" class-name="shrink-0 text-neutral-400"></x-import>
      </button>
    </sc-if>
    <div class="app-sidebar__meta">
      <a class="app-sidebar__governed" href="Main.dc.html">
        <span style="white-space: nowrap;">Governed on</span>
        <dc-import name="AragonLogo" size="sm" hint-size="97px,24px"></dc-import>
      </a>
      <div class="app-sidebar__links">
        <a href="https://aragonassociation.atlassian.net/servicedesk/customer/portal/3">Support</a>
        <a href="https://aragon.org/privacy-policy">Privacy</a>
        <a href="https://aragon.org/terms-and-conditions">Terms of Service</a>
      </div>
      <div class="app-sidebar__copyright">
        <p>© 2026 Aragon</p>
        <x-import component-from-global-scope="GovUiKit.Tag" label="v1.44.0 (LOC)" variant="primary" class-name="shrink-0"></x-import>
      </div>
    </div>
  </div>
</nav>

<nav class="app-topbar app-topbar--with-sidebar" aria-label="DAO navigation">
  <div class="app-container app-topbar__inner">
    <div class="app-topbar__row">
      <button class="app-topbar__home" type="button" aria-label="Open DAO navigation">
        <x-import component-from-global-scope="GovUiKit.DaoAvatar" name="{{daoName}}" src="{{daoAvatar}}" size="lg"></x-import>
        <p class="app-topbar__home-name">{{daoName}}</p>
      </button>
      <div class="app-topbar__actions">
        <x-import component-from-global-scope="GovUiKit.Wallet" user="{{user}}"></x-import>
        <button class="app-topbar__trigger" type="button" aria-label="Open menu">
          <x-import component-from-global-scope="GovUiKit.AvatarIcon" icon="MENU" size="lg"></x-import>
        </button>
      </div>
    </div>
  </div>
</nav>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","proposals","transactions","assets","members","permissions","settings"],"default":"dashboard"},"wallet":{"editor":"enum","options":["","nadia","jonas"],"default":""},"dao":{"editor":"enum","options":["meridian","atlas","northstar"],"default":"meridian"},"$preview":{"width":1024,"height":900}}'>
// The DAO navigation of the app: the sidebar (from the lg breakpoint) and the top bar that replaces it below lg.
// Prop `wallet` (nadia | jonas | absent = disconnected): footer shows the account row of navigationSidebarAccount.tsx, the top bar's Wallet the user.
// Mirrors navigationDao.tsx, navigationSidebar.tsx, navigationLinksItem.tsx and footerSidebar.tsx in apps/app.
class Component extends DCLogic {
  renderVals() {
    const wallets = {
      nadia: { address: '0x9CB2A4c4d6169507A60086dBDB9616eCFf27D98A', name: 'nadia.eth', short: '0x9CB2…D98A' },
      jonas: { address: '0x6Dd753D9eBC280a364354dBf6603D3f2A279a65C', name: 'jonas-b.eth', short: '0x6Dd7…a65C' }
    };
    const user = wallets[this.props.wallet];
    const active = this.props.active ?? 'dashboard';
    // The two mock DAOs (design/baseline-check/data.cjs): token voting (Meridian) and multisig (Atlas Grants Council).
    const daos = {
      meridian: { name: 'Meridian DAO', address: '0xc8c322384903ee8f11f511b71d0504237886bcde', avatar: 'assets/mock/avatar/meridian.svg' },
      atlas: { name: 'Atlas Grants Council', address: '0x31154ff59ea91264c4fd75aba7d8a2fc5a69d368', avatar: 'assets/mock/avatar/atlas.svg' },
      northstar: { name: 'Northstar Protocol', address: '0xa767846912853e30403f3efb946a5250e8e6a063', avatar: 'assets/mock/avatar/northstar.svg' }
    };
    const dao = daos[this.props.dao ?? 'meridian'] ?? daos.meridian;
    const link = (id, label, icon, href) => ({
      label, icon, href,
      current: id === active ? 'page' : undefined,
      iconClass: id === active ? 'text-neutral-800' : 'text-neutral-300'
    });
    return {
      user, connected: user != null, disconnected: user == null,
      yes: true, no: false,
      daoName: dao.name,
      daoAddress: dao.address,
      daoAvatar: dao.avatar,
      explorerUrl: 'https://etherscan.io/address/' + dao.address,
      links: [
        link('dashboard', 'Dashboard', 'APP_DASHBOARD', 'Dashboard.dc.html'),
        link('proposals', 'Proposals', 'APP_PROPOSALS', 'Proposals.dc.html'),
        link('transactions', 'Transactions', 'APP_TRANSACTIONS', 'Transactions.dc.html'),
        link('assets', 'Assets', 'APP_ASSETS', 'Assets.dc.html'),
        link('members', 'Members', 'APP_MEMBERS', 'Members.dc.html'),
        link('permissions', 'Permissions', 'APP_PERMISSIONS', 'Permissions.dc.html'),
        link('settings', 'Settings', 'SETTINGS', 'Settings.dc.html')
      ]
    };
  }
}
</script>
</body>
</html>
