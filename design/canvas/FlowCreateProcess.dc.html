<script type="text/x-dc" data-dc-script data-props='{"advancedGated":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1351}}'>
// FLOW: Create governance process on Meridian, all four steps (route /dao/ethereum-mainnet/meridian.dao.eth/create/<plugin>/process).
// ONE artboard: frame (WizardNav, WizardProgress, WizardActions, Footer) + the state machine; every step body and dialog is a part with
// its state in props: CreateProcessMetadata (step 1), CreateProcessDesigner (+ CreateProcessBodyCard) (step 2), CreateProcessProposalCreation (3),
// CreateProcessPermissions (4), SetupBodyDialog, SetupStageSettingsDialog, TxFlowDialog (publish).
// Initial render = static CreateProcessStep1 (same parts). Apps/app: modules/createDao/pages/createProcessPage/*, components/createProcessForm/*,
// dialogs/setupBodyDialog, dialogs/setupStageSettingsDialog, dialogs/prepareProcessDialog.
// Validation as the app (react-hook-form mode onTouched): errors under a field after its blur, all of the step's errors after "Next"; the
// footer then shows "Missing data" / "Invalid data" and a critical Next button. Back drops the errors.
// Simulations (no chain): address checks resolve after 1 s. Token import: an address ending 0000 is "Not compatible" (not ERC-20), one ending
// 1111 "Requires wrapping", any other is fully compatible. Any address: 0x515f…02e2 is detected as a Safe, others as a plain address.
// Tweak `advancedGated` draws the gated "On request" Advanced option (feature flag gateAdvancedGovernance).
const WALLET = '0x9CB2A4c4d6169507A60086dBDB9616eCFf27D98A';
const COUNCIL_SAFE = '0x515fec2e8f6553948b1d57c14c1243a1405c02e2';
const ADDR = /^0x[0-9a-fA-F]{40}$/;
const trunc = (a) => (a && a.length > 12 ? a.slice(0, 6) + '…' + a.slice(-4) : a || '');
const PLUGIN = { multisig: { id: 'multisig', v: '1.3', label: 'Multisig' }, tokenVoting: { id: 'tokenVoting', v: '1.5', label: 'TokenVoting' }, lockToVote: { id: 'lockToVote', v: '1.1', label: 'LockToVote' } };
const ZERO = '0x0000000000000000000000000000000000000000';
const MENU = [
  { name: 'DAO', info: '0xc8c3…bcde', address: '0xc8c322384903ee8f11f511b71d0504237886bcde', contract: 'DAO', items: [{ name: 'Set metadata', selector: '0xee57e36f' }] },
  { name: 'Meridian', info: '0xc6cf…9dae', address: '0xc6cf4d8a0d5f1f1c8e6c3d9e3a8e0f6bd5139dae', contract: 'Meridian', items: [{ name: 'Mint', selector: '0x40c10f19' }] },
  { name: 'Meridian Token Voting', info: '0xa147…8fda', address: '0xa1479b0d2d7a8d2e0b64a2d5a1f6c8f3c9b78fda', contract: 'Meridian Token Voting', items: [{ name: 'Update settings', selector: '0x4a2b1c3d' }, { name: 'Set metadata', selector: '0x13e1d06a' }] }
];
const fmtDur = (d) => {
  const p = [['days', 'day'], ['hours', 'hour'], ['minutes', 'minute']].filter(([k]) => d && d[k]).map(([k, s]) => d[k] + ' ' + (d[k] === 1 ? s : k));
  return p.length ? p.join(', ') : '0 minutes';
};
const durSecs = (d) => ((d.days || 0) * 24 + (d.hours || 0)) * 3600 + (d.minutes || 0) * 60;
let uid = 0;
const newId = () => 'id' + (++uid);
const emptyForm = () => ({ plugin: 'multisig', name: '', description: '', resources: [], address: '', isSafe: false, proposalType: 'approve',
  members: [WALLET], threshold: 1,
  token: { type: 'new', name: '', symbol: '', recipients: [{ address: WALLET, amount: '1' }], address: '' },
  lock: { address: '' },
  gov: { support: 50, participation: 1, days: 1, hours: 0, minutes: 0, early: false, voteChange: false },
  canCreate: true, minReq: '1' });
const defaultStage = () => ({ id: newId(), name: '', bodies: [], settings: { days: 7, hours: 0, minutes: 0, early: true, approval: 1, veto: 1, expiration: false, expDays: 7, expHours: 0, expMinutes: 0 } });
const checkOf = (addr) => (/0000$/.test(addr) ? 'notErc20' : /1111$/.test(addr) ? 'wrap' : 'ok');

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 1, sub: {}, touched: {}, name: '', key: '', desc: '', descFocus: false, resources: [],
      gov: 'BASIC', body: null, stages: [], mode: 'LISTED_BODIES', conditions: [], perm: 'ANY', selectors: [], menuOpen: false, search: '',
      dlg: null, sdlg: null, chk: {}, tx1: false, tx2: false };
  }
  componentWillUnmount() { clearTimeout(this.t1); clearTimeout(this.t2); clearTimeout(this.t3); }

  // ---------- generic state helpers
  mut(fn) { const s = JSON.parse(JSON.stringify(this.state)); fn(s); this.setState(s); }
  touch(k) { this.mut((s) => { s.touched[k] = true; }); }

  // ---------- step 1
  step1Errors() {
    const s = this.state; const e = {};
    if (!s.name.trim()) e.name = 'Process name is mandatory.'; else if (s.name.length > 40) e.name = 'Process name must be 40 characters or fewer.';
    if (!s.key.trim()) e.key = 'Key is mandatory.'; else if (!/^[A-Z]+$/.test(s.key)) e.key = 'Invalid Key format.'; else if (s.key.length > 5) e.key = 'Key must be 5 characters or fewer.';
    if (s.desc.length > 480) e.desc = 'Description must be 480 characters or fewer.';
    s.resources.forEach((r, i) => { if (!r.url.trim()) e['res' + i] = 'URL is mandatory.'; else if (!/^(https?:\/\/)?(([\da-zA-Z-]+\.)+[a-zA-Z]{2,})(\/[^\s?#]*)?(\?[^\s#]*)?(#[^\s]*)?$/.test(r.url.trim())) e['res' + i] = 'Invalid URL format.'; });
    return e;
  }
  // ---------- step 2
  basicBodyErrors() { return this.state.body == null ? { body: 'A body must be added to this process.' } : {}; }
  stageErrors(i) { const st = this.state.stages[i]; const e = {}; if (!st.name.trim()) e.name = 'Name is mandatory.'; else if (st.name.length > 40) e.name = 'Name must be 40 characters or fewer.'; return e; }
  step2Errors() {
    const s = this.state; const e = {};
    if (s.gov === 'BASIC') Object.assign(e, this.basicBodyErrors());
    else if (this.props.advancedGated) e.gated = 'gated';
    else s.stages.forEach((_, i) => { const x = this.stageErrors(i); if (x.name) e['stage' + i] = x.name; });
    return e;
  }
  // ---------- step 3
  processBodies() {
    const s = this.state;
    const all = s.gov === 'BASIC' ? (s.body ? [{ ref: { kind: 'basic' }, b: s.body }] : []) : s.stages.flatMap((st, si) => st.bodies.map((b, bi) => ({ ref: { kind: 'stage', si, bi }, b })));
    return all.filter((x) => x.b.plugin !== 'external' || x.b.isSafe);
  }
  step3Errors() {
    const s = this.state; const e = {};
    const bodies = this.processBodies();
    const hasSources = bodies.some((x) => x.b.canCreate) || (s.gov === 'ADVANCED' && s.conditions.length > 0);
    if (s.mode !== 'ANY_WALLET' && !hasSources) e.bodies = 'You must select at least one body or existing condition.';
    if (s.mode !== 'ANY_WALLET') bodies.forEach((x, i) => { if (x.b.canCreate && x.b.plugin === 'tokenVoting' && !(Number(x.b.minReq) > 0)) e['min' + i] = 'Minimum requirement is invalid.'; });
    if (s.gov === 'ADVANCED') s.conditions.forEach((c, i) => { if (!ADDR.test(c.address)) e['cond' + i] = 'Address is required'; });
    return e;
  }
  // ---------- step 4
  step4Errors() {
    const sel = this.state.selectors; const e = {};
    if (sel.some((a, i) => sel.findIndex((b) => b.address === a.address && b.selector === a.selector) !== i)) e.dup = 'Duplicate actions found in list';
    return e;
  }
  errorsFor(step) { return [null, () => this.step1Errors(), () => this.step2Errors(), () => this.step3Errors(), () => this.step4Errors()][step](); }

  // ---------- wizard navigation
  next = (ev) => {
    if (ev && ev.preventDefault) ev.preventDefault();
    const s = this.state; const errs = this.errorsFor(s.step);
    if (Object.keys(errs).length) { this.mut((x) => { x.sub[x.step] = true; }); return; }
    if (s.step < 4) this.mut((x) => { x.step += 1; x.menuOpen = false; });
    else this.setState({ tx1: true });
  };
  back = (ev) => {
    if (ev && ev.preventDefault) ev.preventDefault();
    this.mut((x) => { x.sub = {}; x.touched = {}; x.step = Math.max(1, x.step - 1); x.menuOpen = false; });
  };

  // ---------- body dialog
  openBodyDialog(stageIdx, bodyRef) {
    let form = emptyForm(); let edit = null;
    if (bodyRef) { form = JSON.parse(JSON.stringify(bodyRef.body)); edit = { id: bodyRef.body.id }; }
    this.setState({ dlg: { stageIdx, edit, screen: bodyRef ? this.seq(form, stageIdx != null)[0] : 'select', form, tried: {}, touched: {} }, chk: {} });
  }
  seq(f, isSub) {
    const s = ['select'];
    if (isSub) s.push(f.plugin === 'external' ? 'external' : 'metadata');
    if (isSub) s.push('proposalType');
    if (f.plugin !== 'external') s.push('membership', 'governance');
    return s;
  }
  dlgSeq() { const d = this.state.dlg; const full = this.seq(d.form, d.stageIdx != null); return d.edit ? full.slice(1) : full; }
  bodyDlgErrors(d = this.state.dlg) {
    const f = d.form; const e = {}; const sc = d.screen;
    const addrErr = (a, list, i) => (!a ? 'Address is required' : !ADDR.test(a) ? 'Address is not valid.' : list.findIndex((x, j) => j !== i && x.toLowerCase() === a.toLowerCase()) >= 0 ? 'Address has already been added.' : null);
    if (sc === 'metadata') { if (!f.name.trim()) e.name = 'Body name is mandatory.'; }
    if (sc === 'external') {
      if (!f.address) e.address = 'Any address is mandatory.'; else if (!ADDR.test(f.address)) e.address = 'Any address is invalid.';
      else if (!this.chkDone('ext', f.address)) e.address = 'Please wait for the address type checks to complete';
    }
    if (sc === 'membership') {
      if (f.plugin === 'multisig') f.members.forEach((m, i) => { const x = m ? (!m ? 'Address is required' : !ADDR.test(m) ? 'Address is not valid.' : f.members.findIndex((y, j) => j !== i && y.toLowerCase() === m.toLowerCase()) >= 0 ? 'Address has already been added.' : null) : 'Address is required'; if (x) e['m' + i] = x; });
      if (f.plugin === 'tokenVoting') {
        const t = f.token;
        if (t.type === 'new') {
          if (!t.name.trim()) e.tname = 'Token name is mandatory.';
          if (!t.symbol.trim()) e.tsymbol = 'Token symbol is mandatory.'; else if (!/^[A-Z][A-Z0-9]*$/.test(t.symbol)) e.tsymbol = 'Invalid Token symbol format.';
          t.recipients.forEach((r, i) => { const x = addrErr(r.address, t.recipients.map((q) => q.address), i); if (x) e['ra' + i] = x === 'Address is required' ? 'Address is mandatory.' : x; if (r.amount === '' || r.amount == null) e['rt' + i] = 'Tokens is mandatory.'; else if (!(Number(r.amount) > 0)) e['rt' + i] = 'Tokens must be greater than 0.'; });
        } else {
          if (!t.address) e.taddr = 'Token address is mandatory.'; else if (!ADDR.test(t.address)) e.taddr = 'Token address is invalid.';
          else if (!this.chkDone('tok', t.address) || checkOf(t.address) === 'notErc20') e.tblock = 'blocked';
        }
      }
      if (f.plugin === 'lockToVote') {
        const a = f.lock.address;
        if (!a) e.laddr = 'Token address is mandatory.'; else if (!ADDR.test(a)) e.laddr = 'Token address is invalid.'; else if (!this.chkDone('lock', a)) e.lblock = 'blocked';
      }
    }
    if (sc === 'governance' && f.plugin !== 'multisig' && !(d.stageIdx != null)) {
      if (durSecs({ days: f.gov.days, hours: f.gov.hours, minutes: f.gov.minutes }) < 3600) e.duration = 'Duration must be at least 1 hour.';
    }
    return e;
  }
  chkDone(kind, addr) { const c = this.state.chk[kind]; return !!c && c.addr === addr && c.done; }
  startCheck(kind, addr) {
    if (!ADDR.test(addr)) return;
    this.mut((s) => { s.chk[kind] = { addr, done: false }; });
    setTimeout(() => { const c = this.state.chk[kind]; if (c && c.addr === addr) this.mut((s) => { s.chk[kind].done = true; }); }, 1000);
  }
  setForm(fn) { this.mut((s) => { fn(s.dlg.form); }); }
  dlgNext = (ev) => {
    if (ev && ev.preventDefault) ev.preventDefault();
    const d = this.state.dlg; const errs = this.bodyDlgErrors();
    if (Object.keys(errs).length) { this.mut((s) => { s.dlg.tried[s.dlg.screen] = true; }); return; }
    const seq = this.dlgSeq(); const i = seq.indexOf(d.screen);
    if (i < seq.length - 1) { this.mut((s) => { s.dlg.screen = seq[i + 1]; }); return; }
    this.saveBody();
  };
  dlgBack = () => {
    const seq = this.dlgSeq(); const i = seq.indexOf(this.state.dlg.screen);
    if (i > 0) this.mut((s) => { s.dlg.screen = seq[i - 1]; }); else this.closeDlg();
  };
  closeDlg = () => this.setState({ dlg: null });
  saveBody() {
    const d = this.state.dlg;
    this.mut((s) => {
      const f = JSON.parse(JSON.stringify(s.dlg.form));
      f.id = d.edit ? d.edit.id : newId();
      if (d.stageIdx == null) { f.name = s.name; f.canCreate = true; s.body = f; }
      else {
        const bodies = s.stages[d.stageIdx].bodies;
        if (d.edit) { const i = bodies.findIndex((b) => b.id === d.edit.id); f.canCreate = bodies[i].canCreate; f.minReq = bodies[i].minReq; bodies[i] = f; } else { f.canCreate = true; bodies.push(f); }
      }
      s.dlg = null;
    });
  }

  // ---------- stage settings dialog
  openStageDialog(i) {
    const st = this.state.stages[i]; const eff = this.effective(st);
    const se = st.settings;
    this.setState({ sdlg: { i, f: { days: se.days, hours: se.hours, minutes: se.minutes, early: se.early, approval: eff.approval, veto: eff.veto, expiration: se.expiration, expDays: se.expDays, expHours: se.expHours, expMinutes: se.expMinutes }, touched: false, tried: false } });
  }
  effective(st) {
    const veto = st.bodies.filter((b) => b.proposalType === 'veto').length; const appr = st.bodies.length - veto;
    const cl = (v, n) => (n > 0 ? Math.min(Math.max(v, 1), n) : 0);
    return { appr, vetoN: veto, approval: cl(st.settings.approval, appr), veto: cl(st.settings.veto, veto) };
  }
  stageDlgError() { const f = this.state.sdlg.f; return durSecs({ days: f.days, hours: f.hours, minutes: f.minutes }) < 3600 ? 'Duration must be at least 1 hour.' : null; }
  saveStage = (ev) => {
    if (ev && ev.preventDefault) ev.preventDefault();
    if (this.stageDlgError()) { this.mut((s) => { s.sdlg.tried = true; }); return; }
    this.mut((s) => {
      const f = s.sdlg.f; const se = s.stages[s.sdlg.i].settings;
      Object.assign(se, { days: f.days, hours: f.hours, minutes: f.minutes, early: f.early, approval: f.approval, veto: f.veto, expiration: f.expiration, expDays: f.expDays, expHours: f.expHours, expMinutes: f.expMinutes });
      s.sdlg = null;
    });
  };

  // ---------- view models
  alertOf(msg) { return msg ? { message: msg, variant: 'critical' } : undefined; }
  show(step, key) { return !!(this.state.sub[step] || this.state.touched[key]); }
  numHandler(fn) { return (v) => fn(v === '' || v == null ? 0 : Number(v)); }

  metadataVm() {
    const s = this.state; const e = this.step1Errors(); const R = (k) => this.show(1, k);
    return {
      name: s.name, processKey: s.key, description: s.desc,
      nameAlert: R('name') ? this.alertOf(e.name) : undefined, keyAlert: R('key') ? this.alertOf(e.key) : undefined, descriptionAlert: R('desc') ? this.alertOf(e.desc) : undefined,
      descriptionWrap: s.descFocus ? 'border-primary-400 shadow-primary' : '',
      onName: (ev) => this.setState({ name: ev.target.value }), onNameBlur: () => this.mut((x) => { x.name = x.name.trim(); x.touched.name = true; }),
      onKey: (ev) => this.setState({ key: ev.target.value.replace(/[<>]/g, '').toUpperCase() }), onKeyBlur: () => this.mut((x) => { x.key = x.key.trim(); x.touched.key = true; }),
      onDescription: (ev) => this.setState({ desc: ev.target.value, descFocus: true }), onDescriptionBlur: () => this.mut((x) => { x.touched.desc = true; x.descFocus = false; }),
      resources: s.resources.map((r, i) => ({ url: r.url, name: r.name, namePlaceholder: r.url || undefined, urlAlert: R('res' + i) ? this.alertOf(e['res' + i]) : undefined,
        onUrl: (ev) => this.mut((x) => { x.resources[i].url = ev.target.value; }), onUrlBlur: () => this.mut((x) => { x.resources[i].url = x.resources[i].url.trim(); x.touched['res' + i] = true; }),
        onName: (ev) => this.mut((x) => { x.resources[i].name = ev.target.value; }), onRemove: () => this.mut((x) => { x.resources.splice(i, 1); }) })),
      onAddResource: () => this.mut((x) => { x.resources.push({ url: '', name: '' }); })
    };
  }

  bodyRows(b, advanced) {
    const rows = [];
    if (advanced) rows.push({ term: 'Governance type', kind: 'note', text: b.proposalType === 'veto' ? 'Veto' : 'Approval', note: b.proposalType === 'veto' ? 'This body is able to veto the proposal to prevent it from advancing this stage.' : 'This body is able to approve the proposal to advance this stage.' });
    if (b.plugin === 'external') {
      rows.push({ term: 'Address', kind: 'link', text: b.address, link: { href: 'https://etherscan.io/address/' + b.address, isOnchainEntity: true } });
      if (b.isSafe) rows.push({ term: 'Type', kind: 'text', text: 'Safe{Wallet}' });
      return rows;
    }
    if (b.plugin === 'multisig') {
      rows.push({ term: 'Members', kind: 'text', text: b.members.length + ' members' });
      rows.push({ term: 'Multisig threshold', kind: 'text', text: Math.min(b.threshold, b.members.length) + ' of ' + b.members.length });
      return rows;
    }
    const isTok = b.plugin === 'tokenVoting';
    const imp = isTok ? b.token.type === 'imported' : true;
    const addr = isTok ? (imp ? b.token.address : ZERO) : b.lock.address;
    const compat = checkOf(addr) === 'ok';
    const nm = isTok ? (imp ? (compat ? 'Governance Token' : 'Governance Wrapped Token') : b.token.name) : 'Governance Token';
    const sym = isTok ? (imp ? (compat ? 'GOV' : 'gGOV') : b.token.symbol) : 'GOV';
    const total = isTok && !imp ? b.token.recipients.reduce((a, r) => a + Number(r.amount || 0), 0) : (isTok && !compat ? 0 : 1000000);
    rows.push({ term: 'Token', kind: 'link', text: addr, link: { href: 'https://etherscan.io/token/' + addr, isOnchainEntity: true }, description: nm && sym ? nm + ' (' + sym + ')' : undefined });
