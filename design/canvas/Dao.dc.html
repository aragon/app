<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meridian DAO prototype</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/tokens.css">
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/components/bundle.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="proto.css">
<script src="ds/aragon-gov-ui-kit/components/lib/react-hook-form.js"></script>
<script src="ds/aragon-gov-ui-kit/components/bundle.js"></script>
</head>
<body>
<x-dc>
<x-import component-from-global-scope="GovUiKit.GukModulesProvider">
<div class="app-page app-page--sidebar">
  <div class="app-shell">
    <dc-import name="DaoNav" active="{{active}}" on-nav="{{nav}}" hint-size="256px,900px"></dc-import>

    <div class="app-column">
      <div class="dao-slot">
        <sc-if value="{{is.dashboard}}" hint-placeholder-val="{{true}}">
          <dc-import name="DaoDashboard" on-nav="{{nav}}" hint-size="100%,900px"></dc-import>
        </sc-if>
        <sc-if value="{{is.proposals}}" hint-placeholder-val="{{false}}">
          <dc-import name="DaoProposals" on-nav="{{nav}}" hint-size="100%,900px"></dc-import>
        </sc-if>
        <sc-if value="{{is.proposal}}" hint-placeholder-val="{{false}}">
          <dc-import name="DaoProposal" on-nav="{{nav}}" proposal="{{param}}" hint-size="100%,900px"></dc-import>
        </sc-if>
        <sc-if value="{{is.members}}" hint-placeholder-val="{{false}}">
          <dc-import name="DaoMembers" on-nav="{{nav}}" hint-size="100%,900px"></dc-import>
        </sc-if>
        <sc-if value="{{is.member}}" hint-placeholder-val="{{false}}">
          <dc-import name="DaoMember" on-nav="{{nav}}" member="{{param}}" hint-size="100%,900px"></dc-import>
        </sc-if>
        <sc-if value="{{is.assets}}" hint-placeholder-val="{{false}}">
          <dc-import name="DaoAssets" on-nav="{{nav}}" hint-size="100%,900px"></dc-import>
        </sc-if>
        <sc-if value="{{is.transactions}}" hint-placeholder-val="{{false}}">
          <dc-import name="DaoTransactions" on-nav="{{nav}}" hint-size="100%,900px"></dc-import>
        </sc-if>
        <sc-if value="{{is.settings}}" hint-placeholder-val="{{false}}">
          <dc-import name="DaoSettings" on-nav="{{nav}}" hint-size="100%,900px"></dc-import>
        </sc-if>
      </div>

      <div class="app-launcher">
        <button type="button" aria-label="Ask Aragon">
          <x-import component-from-global-scope="GovUiKit.Icon" icon="FEEDBACK" size="md"></x-import>
          <span>Ask Aragon</span>
        </button>
      </div>
    </div>
  </div>
  <dc-import name="Footer" with-sidebar="{{yes}}" hint-size="100%,65px"></dc-import>
</div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
// Meridian DAO prototype: the whole DAO area of the app as one artboard. state = { page, param }.
// Pages: dashboard | proposals | proposal (param = slug) | members | member (param = address) | assets | transactions | settings.
// Every page part gets onNav(target), target = 'dashboard' | 'proposals' | 'proposal:<slug>' | 'members' | 'member:<address>' | 'assets' | 'transactions' | 'settings'.
class Component extends DCLogic {
  state = { page: 'dashboard', param: '' };
  nav = (target) => {
    const t = String(target || 'dashboard');
    const i = t.indexOf(':');
    const page = i < 0 ? t : t.slice(0, i);
    const param = i < 0 ? '' : t.slice(i + 1);
    this.setState({ page, param }, () => {
      try { window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; } catch (e) {}
      try { document.querySelectorAll('.app-page, .app-column').forEach((el) => { el.scrollTop = 0; }); } catch (e) {}
    });
  };
  renderVals() {
    const page = this.state.page;
    const is = {};
    ['dashboard', 'proposals', 'proposal', 'members', 'member', 'assets', 'transactions', 'settings'].forEach((p) => { is[p] = p === page; });
    const active = page === 'proposal' ? 'proposals' : page === 'member' ? 'members' : page;
    return { yes: true, nav: this.nav, is, active, param: this.state.param };
  }
}
</script>
</body>
</html>
