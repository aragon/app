<script type="text/x-dc" data-dc-script data-props='{"member":{"editor":"text","default":"0x9cb2a4c4d6169507a60086dbdb9616ecff27d98a"},"on-nav":{"editor":null},"$preview":{"width":1440,"height":2400}}'>
// Page part of Dao.dc.html. Props: member (address, lowercase), on-nav (function(target)).
// Header, details aside and the three stats follow the member prop; the activity lists are always nadia.eth's.
// DAO member details (apps/app: modules/governance/pages/daoMemberDetailsPage: delegationSection, voteList, daoProposalList,
// explore/daoList). Mock data: design/baseline-check/data.cjs (Meridian DAO, nadia.eth).
// The list items are written out one by one at the start of the line, not looped or indented: the kit's pagination
// counts the list's direct children, and the canvas runtime counts a loop as one child and indentation as another.
class Component extends DCLogic {
  // Links to other DAO pages carry href="#nav:<target>"; one delegated handler turns them into onNav(target).
  click = (e) => {
    const a = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (!a) return;
    const h = a.getAttribute('href');
    e.preventDefault();
    if (h && h.indexOf('#nav:') === 0 && this.props.onNav) this.props.onNav(h.slice(5));
  };
  renderVals() {
    // Kit components print dates relative to the viewer's clock ("2 days ago"), so dates are offsets from now.
    const hour = 3600000;
    const day = 24 * hour;
    const now = Date.now();
    const table = [["0x9cb2a4c4d6169507a60086dbdb9616ecff27d98a", "0x9CB2A4c4d6169507A60086dBDB9616eCFf27D98A", "nadia.eth", "4.85M", "1.2M", 214], ["0xac6399087027f972e6d2ab830dc9b33cda035642", "0xAC6399087027F972e6D2AB830dC9b33CDa035642", "kofi-mensah.eth", "3.92M", "3.92M", 167], ["0x826e7eb63d237333d9063dc74e7ce8e222b0fc05", "0x826e7eB63D237333d9063DC74E7Ce8e222B0FC05", "lenaweber.eth", "2.74M", "2.74M", 98], ["0x865f1f2c83b0ee4a9116da01bcc1e2661086e089", "0x865F1f2c83b0ee4a9116dA01BCc1e2661086E089", "", "2.12M", "2.12M", 0], ["0xd7ae7a08d86bdd5c6d4d95961f6af3264351ae7a", "0xd7AE7a08d86bDd5C6D4d95961F6AF3264351aE7a", "sofiaruiz.eth", "1.68M", "1.68M", 54], ["0xb8616ba616766bd8fbdc69ded1b02e41b482b98e", "0xb8616bA616766BD8FbDC69deD1B02E41b482b98E", "tomas.eth", "1.25M", "1.25M", 21], ["0x697d04244eda05202c0c06aea0bfeced540eb42d", "0x697D04244eDA05202C0c06AEA0bfEcED540Eb42d", "", "980.2K", "980.2K", 0], ["0x3696e5ef91009a09864eb6c1cdb58eb0091df5d8", "0x3696e5ef91009a09864EB6c1cdb58Eb0091df5D8", "marcusj.eth", "760K", "760K", 12], ["0x8a25faabbd80f71248328cf3a5867d3168210a46", "0x8a25fAaBBD80f71248328cf3A5867D3168210A46", "chenwei.eth", "512.34K", "512.34K", 3], ["0x8ac8d965669201c92279ef49be1a5564b908ee27", "0x8AC8D965669201C92279Ef49bE1a5564b908Ee27", "", "388K", "388K", 0], ["0x6dd753d9ebc280a364354dbf6603d3f2a279a65c", "0x6Dd753D9eBC280a364354dBf6603D3f2A279a65C", "jonas-b.eth", "241.75K", "241.75K", 1], ["0xbf2656ce7e3c0e9f5098060cf873c87430751ef9", "0xbF2656cE7e3c0E9F5098060cf873c87430751EF9", "", "125K", "125K", 0]];
    const row = table.find((r) => r[0] === String(this.props.member || '').toLowerCase()) || table[0];
    const checksum = row[1];
    const m = { address: row[0], checksum, ens: row[2] || '', vpText: row[3], balText: row[4], deleg: row[5] };
    const title = row[2] || checksum.slice(0, 6) + '…' + checksum.slice(-4);
    return {
      m, title,
      yes: true, two: 2, three: 3, five: 5, seven: 7,
      breadcrumbs: [{ href: '#nav:members', label: 'Members' }, { label: title }],
      nadia: { address: '0x9cb2a4c4d6169507a60086dbdb9616ecff27d98a', name: 'nadia.eth', link: '#nav:member:0x9cb2a4c4d6169507a60086dbdb9616ecff27d98a' },
      dates: {
        v8: now - 1.875 * day,
        v6: now - 5.875 * day,
        v5: now - 10.875 * day,
        v4: now - 17.875 * day,
        v3: now - 30.875 * day,
        mgp7: now + 6 * day + hour,
        mgp2: now - 39 * day - hour
      },
      daos: { atlas: '0x31154ff59ea91264c4fd75aba7d8a2fc5a69d368', solace: '0xe2f001c33fca00ad672f2a79abbcd567803178ee', harbor: '0x506b251c4cefd8a679955e7d17c8968b3d994693' },
      addressLink: { href: 'https://etherscan.io/address/' + row[0], isOnchainEntity: true }
    };
  }
}
</script>
