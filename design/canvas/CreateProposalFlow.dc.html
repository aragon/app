<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create proposal flow</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/tokens.css">
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/components/bundle.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="proto.css">
<script src="ds/aragon-gov-ui-kit/components/lib/react-hook-form.js"></script>
<script src="ds/aragon-gov-ui-kit/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="GovUiKit.GukModulesProvider">
<div class="app-page">
  <dc-import name="WizardNav" exit-href="{{exitHref}}" wizard-name="Create proposal" dao-name="Meridian DAO" dao-address="0xC8C322384903eE8f11F511b71d0504237886BCde" dao-avatar="assets/mock/avatar/meridian.svg" hint-size="100%,91px"></dc-import>
  <main class="wizard-main">
    <form class="wizard-form" onSubmit="{{submitForm}}">
      <dc-import name="WizardProgress" step="{{progressStep}}" total="{{total}}" next-step="{{nextStepName}}" hint-size="100%,36px"></dc-import>
      <div class="wizard-step">
        <sc-if value="{{isStep1}}" hint-placeholder-val="{{yes}}">
          <dc-import name="CreateProposalFlowMetadata" title="{{title}}" summary="{{summary}}" body="{{body}}" title-alert="{{titleAlert}}" resources="{{resources}}" add-actions="{{addActions}}" on-title="{{setTitle}}" on-title-blur="{{blurTitle}}" on-summary="{{setSummary}}" on-body="{{setBody}}" on-add-resource="{{addResource}}" on-resource-url="{{setResourceUrl}}" on-resource-url-blur="{{blurResourceUrl}}" on-resource-name="{{setResourceName}}" on-remove-resource="{{removeResource}}" on-add-actions="{{setAddActions}}" hint-size="100%,1400px"></dc-import>
        </sc-if>
        <sc-if value="{{isStep2}}" hint-placeholder-val="{{no}}">
          <dc-import name="CreateProposalFlowActions" actions="{{actionsView}}" menu-open="{{menuOpen}}" menu-query="{{menuQuery}}" callbacks="{{actionCallbacks}}" hint-size="100%,500px"></dc-import>
        </sc-if>
        <sc-if value="{{isStep3}}" hint-placeholder-val="{{no}}">
          <dc-import name="CreateProposalFlowSettings" start-mode="{{startMode}}" end-mode="{{endMode}}" start="{{start}}" end="{{end}}" duration="{{duration}}" errors="{{settingsErrors}}" callbacks="{{settingsCallbacks}}" hint-size="100%,800px"></dc-import>
        </sc-if>
        <div class="wizard-step__footer">
          <sc-if value="{{showAlert}}" hint-placeholder-val="{{no}}">
            <x-import component-from-global-scope="GovUiKit.AlertCard" message="{{alertTitle}}" variant="critical">{{alertText}}</x-import>
          </sc-if>
          <sc-if value="{{footerPlain}}" hint-placeholder-val="{{yes}}">
            <dc-import name="WizardActions" has-back="{{hasBack}}" is-last="{{isLast}}" submit-label="Publish proposal" on-next="{{next}}" on-back="{{back}}" hint-size="100%,48px"></dc-import>
          </sc-if>
          <sc-if value="{{footerCritical}}" hint-placeholder-val="{{no}}">
            <div class="wizard-actions">
              <div class="wizard-actions__buttons">
                <x-import component-from-global-scope="GovUiKit.Button" variant="tertiary" size="lg" icon-left="CHEVRON_LEFT" on-click="{{back}}" class-name="{{backClass}}">Back</x-import>
                <x-import component-from-global-scope="GovUiKit.Button" variant="critical" size="lg" icon-right="CHEVRON_RIGHT" type="submit" on-click="{{next}}">{{nextLabel}}</x-import>
              </div>
            </div>
          </sc-if>
          <sc-if value="{{footerDropdown}}" hint-placeholder-val="{{no}}">
            <dc-import name="CreateProposalFlowNext" variant="{{nextVariant}}" on-back="{{back}}" on-simulate="{{simulate}}" on-skip="{{skipSimulation}}" hint-size="100%,48px"></dc-import>
          </sc-if>
        </div>
      </div>
    </form>
  </main>
  <dc-import name="Footer" hint-size="100%,65px"></dc-import>
  <a id="cpf-dao-link" class="cdf-hidden-link" href="Dao.dc.html" tabindex="-1" aria-hidden="true">View proposal</a>
</div>
</x-import>
<sc-if value="{{dlgAsset}}" hint-placeholder-val="{{no}}">
  <dc-import name="CreateProposalFlowAssetDialog" open="{{yes}}" search="{{assetSearch}}" on-close="{{closeDialog}}" on-search="{{setAssetSearch}}" on-select="{{selectAsset}}" hint-size="1440px,900px"></dc-import>
</sc-if>
<sc-if value="{{dlgSim}}" hint-placeholder-val="{{no}}">
  <dc-import name="CreateProposalFlowSimulateDialog" open="{{yes}}" status="{{simStatus}}" total-actions="{{actionCount}}" timestamp="{{simAt}}" on-close="{{closeDialog}}" on-continue="{{simContinue}}" hint-size="1440px,900px"></dc-import>
</sc-if>
<sc-if value="{{dlgTx}}" hint-placeholder-val="{{no}}">
  <dc-import name="TxFlowDialog" open="{{yes}}" title="Publish proposal" description="To publish your proposal, confirm the onchain transaction in your wallet." steps="{{txSteps}}" submit-label="Publish proposal" summary="{{txSummary}}" success-label="View proposal" on-close="{{closeDialog}}" on-success="{{txDone}}" hint-size="100%,0px"></dc-import>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1630}}'>
// Flow F3: create proposal, token voting (Meridian). apps/app: modules/governance/pages/createProposalPage/createProposalPageClientSteps.tsx
// (steps), createProposalForm/* (fields), shared/components/wizards/wizardPage (footer, step alert), useSimulateActionsDropdown.
// One artboard, state in `this.state`; the step bodies and dialogs are the parts CreateProposalMetadata / CreateProposalActions /
// CreateProposalSettings / AssetSelectionDialog / SimulateActionsDialog (also used by the static screens); publishing mounts the shared TxFlowDialog.
// The form library validates a step on Next ("submitted"), then field by field (blur, then on change): `touched` + `submitted` below.
// Source-only (no screenshot): validation errors, step alert, resources, asset search, simulation, fixed dates, remove / move / remove all.
// Not built: the other actions of the menu (Mint, Update settings, Set metadata, Add contract address: menu closes), Connect, Upload,
// ENS resolution (any 0x address is accepted by the address input; atlas-grants.dao.eth resolves to a sample address).
// Simulation always succeeds (sample data). "View proposal" goes to Dao.dc.html; Exit goes to Dao.dc.html too, unless the wizard was opened from the workspace (WsProposals link ?from=workspace&account=<id>), then it goes to Workspace.dc.html?account=<id>&page=proposals. Parts: CreateProposalFlow<Metadata|Actions|Settings|Next|AssetDialog|SimulateDialog>.
const URL_RE = /^(https?:\/\/)?(([\da-zA-Z-]+\.)+[a-zA-Z]{2,})(\/[^\s?#]*)?(\?[^\s#]*)?(#[^\s]*)?$/;
const KNOWN_ENS = { 'atlas-grants.dao.eth': '0x31154ff59eA91264C4fd75aBA7D8a2Fc5a69d368' };
const SAMPLE_ADDRESS = '0x4b3f5d1a0c8e7d2b9a6f1e3c5d7b9a0c2e4f6a8b';
const MIN_MINUTES = 5 * 24 * 60;
const pad = (n) => String(n).padStart(2, '0');
const fmtDate = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fmtTime = (d) => pad(d.getHours()) + ':' + pad(d.getMinutes());
const parseFixed = (v) => (v && v.date && v.time ? new Date(v.date + 'T' + v.time + ':00') : null);
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      step: 1, submitted: false, touched: {},
      title: '', summary: '', body: '', resources: [], addActions: true,
      actions: [], menuOpen: false, menuQuery: '',
      dlg: null, assetIndex: 0, assetSearch: '', simStatus: 'loading', simAt: null,
      startMode: 'now', endMode: 'duration', start: null, end: null, duration: { minutes: 0, hours: 0, days: 5 },
    };
  }
  componentWillUnmount() { clearTimeout(this.simTimer); }
  set(patch) { this.setState(patch); }
  touch(key) { this.setState((s) => (s.touched[key] ? null : { touched: { ...s.touched, [key]: true } })); }
  nowFixed(plusDays) { const d = new Date(Date.now() + (plusDays || 0) * 86400000); return { date: fmtDate(d), time: fmtTime(d) }; }
  steps(s) { return s.addActions ? [1, 2, 3] : [1, 3]; }

  // ---- validation (rules and messages of the app: en.json app.shared.formField.error.*, advancedDateInput) ----
  errorsFor(s) {
    const e = { required: false, invalid: false, title: null, resources: [], actions: [], start: null, end: null };
    if (s.step === 1) {
      if (s.title.trim() === '') { e.title = 'Proposal title is mandatory.'; e.required = true; }
      s.resources.forEach((r, i) => {
        const u = r.url.trim();
        e.resources[i] = u === '' ? 'URL is mandatory.' : !URL_RE.test(u) ? 'Invalid URL format.' : null;
        if (e.resources[i]) e.invalid = true;
      });
    } else if (s.step === 2) {
      s.actions.forEach((a, i) => {
        const amt = a.amount === '' || a.amount == null ? 'Amount is mandatory.' : !(parseFloat(a.amount) > 0) ? 'Amount is invalid.' : null;
        e.actions[i] = { asset: !a.asset, amount: a.asset ? amt : 'Amount is mandatory.', recipient: a.accepted ? null : 'Recipient is mandatory.' };
        if (e.actions[i].asset || e.actions[i].amount || e.actions[i].recipient) e.invalid = true;
      });
    } else {
      const now = new Date(); now.setSeconds(0, 0);
      const startBase = s.startMode === 'fixed' ? parseFixed(s.start) : new Date();
      if (s.startMode === 'fixed') { const d = parseFixed(s.start); if (!d || d < now) { e.start = 'Voting start time is invalid.'; e.invalid = true; } }
      if (s.endMode === 'duration') {
        const m = (Number(s.duration.days) || 0) * 1440 + (Number(s.duration.hours) || 0) * 60 + (Number(s.duration.minutes) || 0);
        if (m < MIN_MINUTES) { e.end = 'Duration must be at least 5 days.'; e.invalid = true; }
      } else {
        const d = parseFixed(s.end), min = startBase ? new Date(startBase.getTime() + MIN_MINUTES * 60000) : null;
        if (!d || !min || d < new Date(min.getTime() - 60000 + (s.startMode === 'fixed' ? 0 : 0))) { e.end = 'Voting duration / end time is invalid.'; e.invalid = true; }
      }
    }
    e.status = e.required && e.invalid ? 'invalid-required' : e.required ? 'required' : e.invalid ? 'invalid' : 'valid';
    return e;
  }

  // ---- navigation ----
  goto(step) { this.setState({ step, submitted: false, touched: {}, menuOpen: false, dlg: null }); }
  advance() { const s = this.state, st = this.steps(s); this.goto(st[st.indexOf(s.step) + 1]); }
  back = (ev) => {
    if (ev && ev.preventDefault) ev.preventDefault();
    const s = this.state, st = this.steps(s), i = st.indexOf(s.step);
    if (i > 0) this.goto(st[i - 1]);
  };
  submitForm = (ev) => { if (ev && ev.preventDefault) ev.preventDefault(); this.next(); };
  // Next / Publish: validate the step; invalid -> stay and show the errors (isSubmitted), valid -> move on.
  next = (ev) => {
    if (ev && ev.preventDefault) ev.preventDefault();
    const s = this.state, e = this.errorsFor(s);
    if (e.status !== 'valid') { this.setState({ submitted: true }); return; }
    if (s.step === 3) this.setState({ dlg: 'tx' }); else this.advance();
  };
  skipSimulation = () => this.next();
  simulate = () => {
    const e = this.errorsFor(this.state);
    if (e.status !== 'valid') { this.setState({ submitted: true }); return; }
    // A prototype has no backend: the simulation runs ~2 s (skeleton), then succeeds with sample data (the app's success state).
    clearTimeout(this.simTimer);
    this.setState({ dlg: 'simulate', simStatus: 'loading' });
    this.simTimer = setTimeout(() => this.setState({ simStatus: 'success', simAt: Date.now() }), 2000);
  };
  simContinue = () => { clearTimeout(this.simTimer); this.advance(); };
  closeDialog = () => { clearTimeout(this.simTimer); this.setState({ dlg: null }); };
  // Publish success: "View proposal" leaves for the DAO prototype through the hidden link (a real link, so the canvas navigates).
  txDone = () => { this.setState({ dlg: null }); const a = document.getElementById('cpf-dao-link'); if (a) a.click(); };

  // ---- step 1 ----
  setTitle = (v) => this.setState({ title: v });
  blurTitle = () => this.touch('title');
  setSummary = (v) => this.setState({ summary: v });
  setBody = (v) => this.setState({ body: v });
  addResource = () => this.setState((s) => ({ resources: [...s.resources, { url: '', name: '' }] }));
  setResourceUrl = (i, v) => this.setState((s) => ({ resources: s.resources.map((r, j) => (j === i ? { ...r, url: v } : r)) }));
  blurResourceUrl = (i) => this.touch('res' + i);
  setResourceName = (i, v) => this.setState((s) => ({ resources: s.resources.map((r, j) => (j === i ? { ...r, name: v } : r)) }));
  removeResource = (i) => this.setState((s) => ({ resources: s.resources.filter((r, j) => j !== i), touched: {} }));
  setAddActions = (v) => this.setState({ addActions: !!v });

  // ---- step 2 ----
  patchAction(i, patch) { this.setState((s) => ({ actions: s.actions.map((a, j) => (j === i ? { ...a, ...(typeof patch === 'function' ? patch(a) : patch) } : a)) })); }
  actionCallbacks = {
    openMenu: () => this.setState({ menuOpen: true, menuQuery: '' }),
    closeMenu: () => this.setState({ menuOpen: false }),
    query: (v) => this.setState({ menuQuery: v }),
    pick: (kind) => this.setState((s) => ({
      menuOpen: false,
      actions: kind === 'transfer' ? [...s.actions, { asset: null, amount: '', recipient: '', recipientEdit: false, accepted: null }] : s.actions,
    })),
    openAsset: (i) => this.setState({ dlg: 'asset', assetIndex: i, assetSearch: '' }),
    amount: (i, v) => this.patchAction(i, { amount: v, amountClear: false }),
    max: (i) => this.patchAction(i, (a) => ({ amount: a.asset ? String(a.asset.balance) : a.amount, amountClear: false })),
    // No backend: a valid 0x address, or any ENS name (*.eth), is accepted at once with a sample address (the app resolves it online).
    recipient: (i, v) => this.patchAction(i, (a) => {
      const t = v.trim();
      const ok = KNOWN_ENS[t.toLowerCase()] || (/^0x[0-9a-fA-F]{40}$/.test(t) ? t : /^[\w-]+(\.[\w-]+)*\.eth$/i.test(t) ? SAMPLE_ADDRESS : null);
      return { recipient: v, accepted: ok };
    }),
    accept: (i, v) => this.patchAction(i, (a) => {
      const known = KNOWN_ENS[(a.recipient || '').trim().toLowerCase()];
      const next = v && v.address ? v.address : known || null;
      return next === a.accepted ? {} : { accepted: next };
    }),
    blur: (i, field) => { this.touch('a' + i + field); if (field === 'recipient') this.patchAction(i, { recipientEdit: false }); if (field === 'amount') this.patchAction(i, { amountClear: false }); },
    edit: (i) => this.patchAction(i, { recipientEdit: true }),
    remove: (i) => this.setState((s) => ({ actions: s.actions.filter((a, j) => j !== i), touched: {} })),
    move: (i, dir) => this.setState((s) => {
      const j = i + dir; if (j < 0 || j >= s.actions.length) return null;
      const a = s.actions.slice(); [a[i], a[j]] = [a[j], a[i]]; return { actions: a, touched: {} };
    }),
    removeAll: () => this.setState({ actions: [], touched: {}, submitted: false }),
  };
  setAssetSearch = (v) => this.setState({ assetSearch: v });
  selectAsset = (asset) => {
    const i = this.state.assetIndex;
    this.patchAction(i, (a) => (a.asset && a.asset.address === asset.address ? {} : { asset, amount: '', amountClear: true }));
    this.setState({ dlg: null });
  };

  // ---- step 3 ----
  settingsCallbacks = {
    startMode: (v) => this.setState((s) => ({ startMode: v, start: v === 'fixed' && !s.start ? this.nowFixed(0) : s.start })),
    endMode: (v) => this.setState((s) => ({ endMode: v, end: v === 'fixed' && !s.end ? this.nowFixed(5) : s.end })),
    start: (f, v) => this.setState((s) => ({ start: { ...s.start, [f]: v } })),
    end: (f, v) => this.setState((s) => ({ end: { ...s.end, [f]: v } })),
    duration: (f, v) => this.setState((s) => { const n = parseInt(v, 10); return { duration: { ...s.duration, [f]: Number.isNaN(n) ? 0 : n } }; }),
    blur: (k) => this.touch(k),
  };

  exitHref() {
    try { const q = new URLSearchParams(window.location.search), a = q.get('account'); if (q.get('from') === 'workspace' && ['meridian', 'atlas', 'northstar'].indexOf(a) >= 0) return 'Workspace.dc.html?account=' + a + '&page=proposals'; } catch (e) {}
    return 'Dao.dc.html';
  }
  renderVals() {
    const s = this.state, e = this.errorsFor(s), st = this.steps(s), idx = st.indexOf(s.step);
    const shown = (key) => s.submitted || !!s.touched[key];
    const alertOf = (m) => (m ? { message: m, variant: 'critical' } : undefined);
    const isLast = s.step === 3, hasActions = s.actions.length > 0;
    const showAlert = s.submitted && e.status !== 'valid';
    const alertKey = { required: 'Missing data', invalid: 'Invalid data', 'invalid-required': 'Missing and invalid data' };
    const alertDesc = {
      required: 'Some inputs are missing. Fill out all mandatory fields to proceed.',
      invalid: 'Some values are invalid. Review and fix them to proceed.',
      'invalid-required': 'Some inputs are missing or invalid. Fix them to proceed.',
    };
    const dropdown = s.step === 2 && hasActions;
    const plain = !dropdown && !showAlert;
    const nextNames = { 1: s.addActions ? 'Add actions' : 'Proposal settings', 2: 'Proposal settings', 3: 'Publish proposal' };
    const actionsView = s.actions.map((a, i) => {
      const known = !!a.accepted && !!KNOWN_ENS[(a.recipient || '').trim().toLowerCase()];
      const er = e.actions[i] || {};
      return {
        asset: a.asset, amount: a.amount, recipient: a.recipient, recipientAddress: a.accepted || undefined,
        recipientResolved: known && !a.recipientEdit, recipientEdit: a.recipientEdit,
        errors: {
          asset: s.step === 2 && er.asset && shown('a' + i + 'asset'),
          amount: s.step === 2 && shown('a' + i + 'amount') && !a.amountClear ? er.amount : null,
          recipient: s.step === 2 && shown('a' + i + 'recipient') ? er.recipient : null,
        },
      };
    });
    // Actions step error display: the asset field has no touch event of its own (it is picked in a dialog): show it on submit.
    actionsView.forEach((a, i) => { a.errors.asset = s.submitted && !!(e.actions[i] && e.actions[i].asset); });
    const startDef = s.start || this.nowFixed(0), endDef = s.end || this.nowFixed(5);
    return {
      yes: true, no: false,
      isStep1: s.step === 1, isStep2: s.step === 2, isStep3: s.step === 3,
      progressStep: idx + 1, total: st.length, nextStepName: nextNames[s.step],
      // step 1
      title: s.title, summary: s.summary, body: s.body, addActions: s.addActions,
      titleAlert: s.step === 1 && shown('title') ? alertOf(e.title) : undefined,
      resources: s.resources.map((r, i) => ({ ...r, urlAlert: s.step === 1 && shown('res' + i) ? alertOf(e.resources[i]) : undefined })),
      setTitle: this.setTitle, blurTitle: this.blurTitle, setSummary: this.setSummary, setBody: this.setBody,
      addResource: this.addResource, setResourceUrl: this.setResourceUrl, blurResourceUrl: this.blurResourceUrl,
      setResourceName: this.setResourceName, removeResource: this.removeResource, setAddActions: this.setAddActions,
      // step 2
      actionsView, menuOpen: s.menuOpen, menuQuery: s.menuQuery, actionCallbacks: this.actionCallbacks, actionCount: s.actions.length,
      // step 3
      startMode: s.startMode, endMode: s.endMode, start: startDef, end: endDef, duration: s.duration,
      settingsErrors: { start: shown('start') ? e.start : null, end: shown('end') ? e.end : null },
      settingsCallbacks: this.settingsCallbacks,
      // footer
      showAlert, alertTitle: alertKey[e.status], alertText: alertDesc[e.status],
      footerPlain: plain, footerCritical: !dropdown && showAlert, footerDropdown: dropdown,
      nextVariant: showAlert ? 'critical' : 'secondary',
      hasBack: idx > 0, backClass: idx > 0 ? '' : 'invisible', isLast, nextLabel: isLast ? 'Publish proposal' : 'Next',
      exitHref: this.exitHref(), back: this.back, next: this.next, submitForm: this.submitForm, simulate: this.simulate, skipSimulation: this.skipSimulation,
      // dialogs
      dlgAsset: s.dlg === 'asset', dlgSim: s.dlg === 'simulate', dlgTx: s.dlg === 'tx',
      txSteps: ['Pin data on IPFS'], txSummary: { type: 'proposal', title: s.title || 'Untitled proposal', summary: s.summary },
      assetSearch: s.assetSearch, setAssetSearch: this.setAssetSearch, selectAsset: this.selectAsset, closeDialog: this.closeDialog,
      simStatus: s.simStatus, simAt: s.simAt || Date.now(), simContinue: this.simContinue,
      txDone: this.txDone,
    };
  }
}
</script>
</body>
</html>
