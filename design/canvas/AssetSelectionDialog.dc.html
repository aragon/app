<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Asset selection dialog</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/tokens.css">
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="ds/aragon-gov-ui-kit/components/lib/react-hook-form.js"></script>
<script src="ds/aragon-gov-ui-kit/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<x-import component-from-global-scope="GovUiKit.GukModulesProvider">
<x-import component-from-global-scope="GovUiKit.Dialog.Root" open="{{open}}" on-open-change="{{openChange}}" dc-props="{{rootProps}}" hidden-title="Select an asset" hidden-description="Select the asset from the list below">
<x-import component-from-global-scope="GovUiKit.Dialog.Header" title="Select an asset" on-close="{{close}}"></x-import>
<x-import component-from-global-scope="GovUiKit.Dialog.Content">
<div style="display:flex;flex-direction:column;gap:24px;padding:28px 0">
<x-import component-from-global-scope="GovUiKit.DataList.Root" entity-label="Assets" items-count="{{count}}" page-size="{{pageSize}}" state="idle">
<x-import component-from-global-scope="GovUiKit.DataList.Filter" placeholder="Search assets..." search-value="{{search}}" on-search-value-change="{{changeSearch}}"></x-import>
<sc-if value="{{hasAssets}}" hint-placeholder-val="{{yes}}">
<x-import component-from-global-scope="GovUiKit.DataList.ActionItem" icon="PLUS" label="Add address" variant="primary"></x-import>
</sc-if>
<x-import component-from-global-scope="GovUiKit.DataList.Container" empty-state="{{emptyState}}">
<sc-if value="{{show.usdc}}" hint-placeholder-val="{{yes}}"><x-import component-from-global-scope="GovUiKit.AssetDataListItem.Structure" name="USD Coin" symbol="USDC" amount="1852340.55" fiat-price="1.00" hide-value="{{no}}" logo-src="assets/mock/token/usdc.svg" variant="select" on-click="{{pick.usdc}}"></x-import></sc-if>
<sc-if value="{{show.eth}}" hint-placeholder-val="{{yes}}"><x-import component-from-global-scope="GovUiKit.AssetDataListItem.Structure" name="Ether" symbol="ETH" amount="418.274" fiat-price="3148.62" hide-value="{{no}}" logo-src="assets/mock/token/eth.svg" variant="select" on-click="{{pick.eth}}"></x-import></sc-if>
<sc-if value="{{show.mrd}}" hint-placeholder-val="{{yes}}"><x-import component-from-global-scope="GovUiKit.AssetDataListItem.Structure" name="Meridian" symbol="MRD" amount="1100000" fiat-price="0.84" hide-value="{{no}}" logo-src="assets/mock/token/mrd.svg" variant="select" on-click="{{pick.mrd}}"></x-import></sc-if>
<sc-if value="{{show.weth}}" hint-placeholder-val="{{yes}}"><x-import component-from-global-scope="GovUiKit.AssetDataListItem.Structure" name="Wrapped Ether" symbol="WETH" amount="152.5" fiat-price="3148.62" hide-value="{{no}}" logo-src="assets/mock/token/weth.svg" variant="select" on-click="{{pick.weth}}"></x-import></sc-if>
<sc-if value="{{show.dai}}" hint-placeholder-val="{{yes}}"><x-import component-from-global-scope="GovUiKit.AssetDataListItem.Structure" name="Dai Stablecoin" symbol="DAI" amount="231420.18" fiat-price="0.9998" hide-value="{{no}}" logo-src="assets/mock/token/dai.svg" variant="select" on-click="{{pick.dai}}"></x-import></sc-if>
</x-import>
<x-import component-from-global-scope="GovUiKit.DataList.Pagination"></x-import>
</x-import>
</div>
</x-import>
</x-import>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"open":{"editor":"boolean","default":true},"search":{"editor":null},"onClose":{"editor":null},"onSearch":{"editor":null},"onSelect":{"editor":null},"$preview":{"width":1440,"height":900}}'>
// Asset selection dialog of the transfer action (apps/app: modules/finance/dialogs/assetSelectionDialog, components/assetAddressSelect),
// the kit's Dialog.Root over whatever page is behind; needs the z-index tokens at the end of app.css. The DAO's assets are the Meridian
// mock data (design/baseline-check/data.cjs).
//   <dc-import name="AssetSelectionDialog" open="{{yes}}" search="" on-close="{{fn}}" on-search="{{fn}}" on-select="{{fn}}"></dc-import>
// Props: open (boolean, default true), search (the search text; filters by name / symbol), onClose(), onSearch(value), onSelect(asset)
// with asset = { symbol, name, logo, address, balance, price, decimals }. No results shows the app's empty state (copy en.json
// app.finance.assetAddressSelect.emptyState); "Add address" / "Add by address" are drawn but do nothing.
const ASSETS = [
  { key: 'usdc', symbol: 'USDC', name: 'USD Coin', logo: 'assets/mock/token/usdc.svg', address: '0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48', balance: 1852340.55, price: 1.0, decimals: 6 },
  { key: 'eth', symbol: 'ETH', name: 'Ether', logo: 'assets/mock/token/eth.svg', address: '0xeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee', balance: 418.274, price: 3148.62, decimals: 18 },
  { key: 'mrd', symbol: 'MRD', name: 'Meridian', logo: 'assets/mock/token/mrd.svg', address: '0xc6cf3058f8fd5eb7074109b3b531364a4af59dae', balance: 1100000, price: 0.84, decimals: 18 },
  { key: 'weth', symbol: 'WETH', name: 'Wrapped Ether', logo: 'assets/mock/token/weth.svg', address: '0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2', balance: 152.5, price: 3148.62, decimals: 18 },
  { key: 'dai', symbol: 'DAI', name: 'Dai Stablecoin', logo: 'assets/mock/token/dai.svg', address: '0x6b175474e89094c44da98b954eedeac495271d0f', balance: 231420.18, price: 0.9998, decimals: 18 },
];
window.CP_ASSETS = ASSETS;
class Component extends DCLogic {
  renderVals() {
    const p = this.props, call = (fn, ...a) => (fn ? fn(...a) : undefined);
    const q = (p.search || '').trim().toLowerCase();
    const shown = ASSETS.filter((a) => q === '' || a.name.toLowerCase().includes(q) || a.symbol.toLowerCase().includes(q));
    const show = {}, pick = {};
    ASSETS.forEach((a) => { show[a.key] = shown.includes(a); pick[a.key] = () => call(p.onSelect, a); });
    return {
      yes: true, no: false, noop: () => undefined,
      open: p.open !== false, search: p.search ?? '', show, pick,
      count: shown.length, pageSize: 12, hasAssets: shown.length > 0,
      emptyState: { heading: 'No results for "' + (p.search ?? '') + '"', description: 'Search for another token or add by address', primaryButton: { label: 'Add by address', iconLeft: 'PLUS' } },
      changeSearch: (v) => call(p.onSearch, v),
      close: () => call(p.onClose),
      openChange: (o) => { if (!o) call(p.onClose); },
      rootProps: { onOpenAutoFocus: (e) => e.preventDefault() },
    };
  }
}
</script>
</body>
</html>
