<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create workspace: accounts</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/tokens.css">
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="ds/aragon-gov-ui-kit/components/lib/react-hook-form.js"></script>
<script src="ds/aragon-gov-ui-kit/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="GovUiKit.GukModulesProvider">
<div class="app-page">
  <dc-import name="WizardNav" wizard-name="Create workspace" hint-size="100%,91px"></dc-import>
  <main class="wizard-main">
    <form class="wizard-form">
      <dc-import name="WizardProgress" step="{{step}}" total="{{total}}" next-step="Create workspace" hint-size="100%,36px"></dc-import>
      <div class="wizard-step">
        <dc-import name="WorkspaceFormAccounts" title="Add accounts" intro="Add the accounts belonging to this workspace. Each one is identified by its network and address. This step is optional and accounts can be added later." model="{{model}}" hint-size="100%,900px"></dc-import>
        <dc-import name="WorkspaceWizardFooter" has-back="{{yes}}" is-last="{{yes}}" submit-label="Create workspace" hover="{{yes}}" back-href="CreateWorkspaceStep2.dc.html" hint-size="100%,48px"></dc-import>
      </div>
    </form>
  </main>
  <dc-import name="Footer" hint-size="100%,65px"></dc-import>
</div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
// Create workspace, step 3 "Add accounts" with its default empty account row (Ethereum Sepolia) (apps/app: createWorkspaceFormAccounts
// (+ AccountsItem), createWorkspaceFormNetworkAddressFields, shared/components/forms/networkInput). The pointer rests on the submit
// button, drawn hovered. Parts: WorkspaceFormAccounts, WorkspaceWizardFooter; interactive version FlowCreateWorkspace.
class Component extends DCLogic {
  renderVals() {
    return { yes: true, no: false, step: 3, total: 3, model: { accounts: [{ network: 'ethereum-sepolia', address: '' }] } };
  }
}
</script>
</body>
</html>
