<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create proposal: next menu</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/tokens.css">
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="ds/aragon-gov-ui-kit/components/lib/react-hook-form.js"></script>
<script src="ds/aragon-gov-ui-kit/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="GovUiKit.GukModulesProvider">
<div class="app-page" style="height:900px;overflow:hidden">
  <dc-import name="WizardNav" wizard-name="Create proposal" dao-name="Meridian DAO" dao-address="0xC8C322384903eE8f11F511b71d0504237886BCde" dao-avatar="assets/mock/avatar/meridian.svg" hint-size="100%,91px"></dc-import>
  <div style="display:flex;flex-direction:column;flex-grow:1;margin-top:-238px">
  <main class="wizard-main">
    <form class="wizard-form">
      <dc-import name="WizardProgress" step="{{step}}" total="{{total}}" next-step="Proposal settings" hint-size="100%,36px"></dc-import>
      <div class="wizard-step">
        <div class="wizard-step__content">
          <div class="wizard-step__header">
            <x-import component-from-global-scope="GovUiKit.Heading" size="h1">Add actions</x-import>
            <p class="wizard-step__description">Add actions to govern the DAO, interact with smart contracts, or connect to other applications. They will execute in the order listed on this page.</p>
          </div>
          <div class="actions-editor">
            <x-import component-from-global-scope="PwFormScope"><x-import component-from-global-scope="GovUiKit.ProposalActions.Root" actions-count="{{one}}" edit-mode="{{yes}}" expanded-actions="{{expanded}}" on-expanded-actions-change="{{noop}}">
              <x-import component-from-global-scope="GovUiKit.ProposalActions.Container" empty-state-description="">
<x-import component-from-global-scope="GovUiKit.ProposalActions.Item" action="{{action}}" action-count="{{one}}" action-function-selector="{{selector}}" array-controls="{{arrayControls}}" chain-id="{{one}}" dc-props="{{itemProps}}" edit-mode="{{yes}}" form-prefix="actions.0" index="{{zero}}" value="action-0"></x-import>
</x-import>
            </x-import></x-import>
            <div class="action-composer">
              <div class="action-composer__row">
                <div class="action-composer__buttons">
                  <x-import component-from-global-scope="GovUiKit.Button" variant="primary" size="md" icon-left="PLUS">Action</x-import>
                  <x-import component-from-global-scope="GovUiKit.Button" variant="secondary" size="md" icon-right="BLOCKCHAIN_WALLETCONNECT">Connect</x-import>
                  <x-import component-from-global-scope="GovUiKit.Button" variant="tertiary" size="md" icon-left="WITHDRAW">Upload</x-import>
                </div>
                <div class="action-composer__trailing">
                  <x-import component-from-global-scope="GovUiKit.Switch" checked="{{no}}" inline-label="Only show allowed actions" on-checked-changed="{{noop}}"></x-import>
                  <x-import component-from-global-scope="GovUiKit.Button" variant="tertiary" size="md" icon-left="DOTS_VERTICAL" class-name="aspect-square w-fit shrink-0" aria-label="More"></x-import>
                </div>
              </div>
            </div>
            <div class="action-composer__input" aria-hidden="true"></div>
          </div>
        </div>
        <dc-import name="CreateProposalNext" open="{{yes}}" hint-size="100%,48px"></dc-import>
      </div>
    </form>
  </main>
  <dc-import name="Footer" hint-size="100%,65px"></dc-import>
  </div>
</div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>

class Component extends DCLogic {

      itemProps: { CustomComponent: TransferForm },

  }
}
</script>
</body>
</html>
