<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create process: proposal creation rules</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/tokens.css">
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="ds/aragon-gov-ui-kit/components/lib/react-hook-form.js"></script>
<script src="ds/aragon-gov-ui-kit/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="GovUiKit.GukModulesProvider">
<div class="process-fragment">
  <x-import component-from-global-scope="GovUiKit.RadioGroup" label="Proposal creation eligibility" value="{{mode}}" on-value-change="{{onMode}}" alert="{{modeAlert}}" class-name="process-modes">
    <x-import component-from-global-scope="GovUiKit.RadioCard" class-name="min-w-0" label="Members" description="Members of the selected bodies" value="LISTED_BODIES"></x-import>
    <x-import component-from-global-scope="GovUiKit.RadioCard" class-name="min-w-0" label="Anyone" description="Any address can create proposals" value="ANY_WALLET"></x-import>
  </x-import>
  <sc-if value="{{showBodies}}" hint-placeholder-val="{{yes}}">
    <x-import component-from-global-scope="GovUiKit.InputContainer" id="proposalCreationBodies" label="Bodies" use-custom-wrapper="{{yes}}" alert="{{bodiesAlert}}">
      <sc-for list="{{bodies}}" as="b" hint-placeholder-count="1">
        <x-import component-from-global-scope="GovUiKit.CheckboxCard" class-name="w-full" label="{{b.label}}" description="{{b.description}}" checked="{{b.checked}}" on-checked-change="{{b.onChecked}}" avatar="{{b.avatar}}">
          <sc-if value="{{b.hasMinReq}}" hint-placeholder-val="{{no}}">
            <div style="text-align:left"><x-import component-from-global-scope="GovUiKit.InputNumber" help-text="The voting power or token balance required to create proposals." placeholder="≥ 1" prefix="≥" min="{{zero}}" value="{{b.minReq}}" on-change="{{b.onMinReq}}" alert="{{b.minReqAlert}}"></x-import></div>
          </sc-if>
        </x-import>
      </sc-for>
      <sc-for list="{{conditions}}" as="c" hint-placeholder-count="1">
        <x-import component-from-global-scope="GovUiKit.Card" class-name="border-primary-400 shadow-primary addr-item">
          <div class="addr-item__inner">
            <div class="addr-item__input"><x-import component-from-global-scope="GovUiKit.AddressInput" chain-id="{{one}}" value="{{c.address}}" on-change="{{c.onAddress}}" on-accept="{{c.onAccept}}" on-blur="{{c.onBlur}}" alert="{{c.alert}}"></x-import></div>
            <div class="addr-item__remove"><x-import component-from-global-scope="GovUiKit.Button" aria-label="Remove condition" icon-left="CLOSE" size="sm" variant="secondary" on-click="{{c.onRemove}}"></x-import></div>
          </div>
        </x-import>
      </sc-for>
      <sc-if value="{{showExisting}}" hint-placeholder-val="{{no}}">
        <div class="process-fragment__start"><x-import component-from-global-scope="GovUiKit.Button" icon-left="PLUS" size="md" variant="tertiary" on-click="{{onAddCondition}}">Existing condition</x-import></div>
      </sc-if>
      <sc-if value="{{showBasicNotSupported}}" hint-placeholder-val="{{no}}">
        <p class="process-fragment__note">Adding existing conditions is only available in Advanced governance.</p>
      </sc-if>
    </x-import>
  </sc-if>
</div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"vm":{"editor":null}}'>
// Step 3 body "Set proposal creation rules" (apps/app: modules/createDao/components/createProcessForm/createProcessFormProposalCreation/
// createProcessFormProposalCreation.tsx, proposalCreationSettingsDefault.tsx, existingConditionCard.tsx; plugins/{token,multisig}Plugin/components/
// *ProposalCreationSettings). Two siblings in the step content: the mode RadioGroup and the "Bodies" InputContainer (hidden for "Anyone").
// Props: vm = { mode 'LISTED_BODIES'|'ANY_WALLET', onMode(value), modeAlert / bodiesAlert ({message, variant:'critical'}),
//   bodies: [{ label, description, checked, onChecked(checked), avatar, hasMinReq, minReq, onMinReq(value), minReqAlert }],
//   conditions: [{ address, alert, onAddress, onAccept, onBlur, onRemove }], showExisting, onAddCondition, showBasicNotSupported }.
class Component extends DCLogic {
  renderVals() {
    const vm = this.props.vm || {};
    const noop = () => undefined;
    return { yes: true, no: false, zero: 0, one: 1, mode: vm.mode || 'LISTED_BODIES', onMode: vm.onMode || noop, modeAlert: vm.modeAlert, bodiesAlert: vm.bodiesAlert,
      showBodies: (vm.mode || 'LISTED_BODIES') !== 'ANY_WALLET', bodies: (vm.bodies || []).map((b) => ({ onChecked: noop, onMinReq: noop, ...b })),
      conditions: (vm.conditions || []).map((c) => ({ onAddress: noop, onAccept: noop, onBlur: noop, onRemove: noop, ...c })),
      showExisting: !!vm.showExisting, onAddCondition: vm.onAddCondition || noop, showBasicNotSupported: !!vm.showBasicNotSupported };
  }
}
</script>
</body>
</html>
