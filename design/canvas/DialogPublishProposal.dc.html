<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dialog publish proposal</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/tokens.css">
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="ds/aragon-gov-ui-kit/components/lib/react-hook-form.js"></script>
<script src="ds/aragon-gov-ui-kit/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="GovUiKit.GukModulesProvider">
<div class="dlg-stage">
<dc-import name="CreateProposalStep3" hint-size="1440px,900px"></dc-import>
<x-import component-from-global-scope="GovUiKit.Dialog.Root" open="{{yes}}" on-open-auto-focus="{{noFocus}}" container-class-name="dlg-container--static" >
  <x-import component-from-global-scope="GovUiKit.Dialog.Header" title="Publish proposal" description="To publish your proposal, confirm the onchain transaction in your wallet."></x-import>
  <x-import component-from-global-scope="GovUiKit.Dialog.Content">
    <div class="tx-dialog__body">
      <x-import component-from-global-scope="GovUiKit.ProposalDataListItem.Structure" status="DRAFT" title="Fund the Q2 2027 Ecosystem Grants Program" summary="Allocate 300,000 USDC to the Ecosystem Grants Program to fund integrations, tooling and research during Q2 2027." publisher="{{publisher}}"></x-import>
      <dc-import name="TxDialogSteps" with-ipfs="{{yes}}" hint-size="100%,218px"></dc-import>
    </div>
  </x-import>
  <x-import component-from-global-scope="GovUiKit.Dialog.Footer" primary-action="{{primary}}" secondary-action="{{secondary}}" ></x-import>
</x-import>
</div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, no: false, noFocus: (e) => e.preventDefault(), primary: { label: 'Sign transaction' }, secondary: { label: 'Close' }, publisher: { address: '0xa4e7a4d9a6a8dd1b7d7e0f6a6b6e0c3d6a7e8f90', name: 'You' } };
  }
}
</script>
</body>
</html>
