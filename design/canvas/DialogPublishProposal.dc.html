<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dialog publish proposal</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/tokens.css">
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="ds/aragon-gov-ui-kit/components/lib/react-hook-form.js"></script>
<script src="ds/aragon-gov-ui-kit/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="GovUiKit.GukModulesProvider">
<div class="dlg-stage">
<dc-import name="CreateProposalStep3" hint-size="1440px,900px"></dc-import>
<dc-import name="TxFlowDialog" open="{{yes}}" title="Publish proposal" description="To publish your proposal, confirm the onchain transaction in your wallet." steps="{{txSteps}}" submit-label="Publish proposal" summary="{{txSummary}}" hint-size="100%,0px"></dc-import>
</div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, txSteps: ['Pin data on IPFS'], txSummary: { type: 'proposal', title: 'Fund the Q2 2027 Ecosystem Grants Program', summary: 'Allocate 300,000 USDC to the Ecosystem Grants Program to fund integrations, tooling and research during Q2 2027.' } };
  }
}
</script>
</body>
</html>
