<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2519}}'>
// Workspace proposals, every account (apps/app: modules/workspace/pages/workspaceProposalsPage, components
// workspaceProposalList (PluginFilterComponent tabs) + workspaceProposalListDefault.tsx (rows tagged with the DAO name,
// page size 10), aside workspaceProposalsAsideCard/workspaceAllProposalsAsideCard.tsx). Proposals: both mock DAOs of
// design/baseline-check/data.cjs, newest first; 14 in all, the first page of 10 shown.
// "Most recent" reads "in / 23 ago" in the app: the card splits the relative date ("in 23 hours") at its first space
// and puts the second word into "{unit} ago". Drawn as the screenshot shows it.
// The list items are written out one by one at the start of the line (see Proposals.dc.html).
class Component extends DCLogic {
  renderVals() {
    const hour = 3600000;
    const day = 24 * hour;
    const now = Date.now();
    const person = (address, name) => ({ address, name, link: 'WorkspaceAccountMember.dc.html' });
    return {
      yes: true, no: false, count: 14, pageSize: 10,
      dates: {
        agc6: now + 8 * day + hour,
        mgp7: now + 6 * day + hour,
        agc5: now + 6 * day + hour,
        mgp8: now + 3 * day + hour,
        agc4: now + 4 * day + hour,
        mgp6: now - 1 * day - hour,
        mgp5: now - 6 * day - hour,
        mgp4: now - 13 * day - hour,
        agc3: now - 13 * day - hour,
        agc2: now - 23 * day - hour
      },
      people: {
        lena: person('0x826e7eb63d237333d9063dc74e7ce8e222b0fc05', 'lenaweber.eth'),
        nadia: person('0x9cb2a4c4d6169507a60086dbdb9616ecff27d98a', 'nadia.eth'),
        kofi: person('0xac6399087027f972e6d2ab830dc9b33cda035642', 'kofi-mensah.eth'),
        sofia: person('0xd7ae7a08d86bdd5c6d4d95961f6af3264351ae7a', 'sofiaruiz.eth'),
        tomas: person('0xb8616ba616766bd8fbdc69ded1b02e41b482b98e', 'tomas.eth'),
        chen: person('0x8a25faabbd80f71248328cf3a5867d3168210a46', 'chenwei.eth'),
        anon: person('0x865f1f2c83b0ee4a9116da01bcc1e2661086e089', undefined)
      }
    };
  }
}
</script>
