<x-dc>

<div class="app-page">
  <dc-import name="WizardNav" wizard-name="Create process" exit-href="Settings.dc.html" dao-name="Meridian DAO" dao-address="0xc8c322384903ee8f11f511b71d0504237886bcde" dao-avatar="assets/mock/avatar/meridian.svg" hint-size="100%,91px"></dc-import>
  <main class="wizard-main">
    <form class="wizard-form">
      <dc-import name="WizardProgress" step="{{step}}" total="{{total}}" next-step="Proposal creation rules" hint-size="100%,36px"></dc-import>
      <div class="wizard-step">
        <div class="wizard-step__content">
          <div class="wizard-step__header">
            <x-import component-from-global-scope="GovUiKit.Heading" size="h1">Design the governance process</x-import>
            <p class="wizard-step__description">Design how decisions are made in this type of proposal. A proposal can go through multiple sequential stages and have any number of governing bodies.</p>

          <div class="process-governance">
            <x-import component-from-global-scope="GovUiKit.RadioGroup" label="Governance designer" help-text="This determines the amount of control and flexibility you need to design your governance process." value="BASIC" on-value-change="{{noop}}" class-name="process-governance__types">

              <x-import component-from-global-scope="GovUiKit.RadioCard" label="Advanced" value="ADVANCED"></x-import>
            </x-import>
            <x-import component-from-global-scope="GovUiKit.InputContainer" id="basicBody" use-custom-wrapper="{{yes}}">
              <x-import component-from-global-scope="GovUiKit.CardEmptyState" class-name="border border-neutral-100" heading="Set up your voting body" description="Basic governance supports a single voting body — either a multisig or token voting. Add one to define how proposals are decided." object-illustration="{{illustration}}" primary-button="{{addBody}}"></x-import>
            </x-import>
          </div>
        </div>
        <dc-import name="WizardActions" has-back="{{yes}}" hint-size="100%,48px"></dc-import>
      </div>
    </form>
  </main>
  <dc-import name="Footer" hint-size="100%,65px"></dc-import>
</div>
</x-import>

class Component extends DCLogic {

    const noop = () => undefined;
    return { yes: true, no: false, step: 2, total: 4, d40: 40, d5: 5, d480: 480, noop,
      illustration: { object: 'USERS' },
      addBody: { label: 'Add voting body', iconLeft: 'PLUS', onClick: noop } };
