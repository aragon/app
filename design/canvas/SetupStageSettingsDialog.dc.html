<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setup stage settings dialog</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/tokens.css">
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="ds/aragon-gov-ui-kit/components/lib/react-hook-form.js"></script>
<script src="ds/aragon-gov-ui-kit/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="GovUiKit.GukModulesProvider">
<x-import component-from-global-scope="GovUiKit.Dialog.Root" open="{{open}}" on-open-change="{{onOpenChange}}" on-open-auto-focus="{{noFocus}}" container-class-name="dlg-container--static" size="lg" hidden-title="Settings" hidden-description="Configure the settings for the stage">
  <x-import component-from-global-scope="GovUiKit.Dialog.Header" title="Settings"></x-import>
  <x-import component-from-global-scope="GovUiKit.Dialog.Content">
    <div class="stage-settings-form">
      <sc-if value="{{hasApprove}}" hint-placeholder-val="{{yes}}"><dc-import name="NumberProgressInput" vm="{{approve}}" hint-size="100%,200px"></dc-import></sc-if>
      <sc-if value="{{hasVeto}}" hint-placeholder-val="{{no}}"><dc-import name="NumberProgressInput" vm="{{veto}}" hint-size="100%,200px"></dc-import></sc-if>
      <x-import component-from-global-scope="GovUiKit.InputContainer" class-name="flex flex-col" id="minDuration" label="Stage duration" help-text="The period of time a proposal is active. Proposals can be created with a longer duration, but not shorter." use-custom-wrapper="{{yes}}">
        <x-import component-from-global-scope="GovUiKit.Card">
          <dc-import name="AdvancedDateInputDuration" vm="{{duration}}" hint-size="100%,160px"></dc-import>
        </x-import>
      </x-import>
      <sc-if value="{{hasEarly}}" hint-placeholder-val="{{yes}}">
        <x-import component-from-global-scope="GovUiKit.Switch" label="Early stage advance" help-text="This allows a proposal to be advanced early to subsequent stages if it's approved before the voting period ends." inline-label="{{earlyLabel}}" checked="{{early}}" on-checked-changed="{{onEarly}}"></x-import>
      </sc-if>
      <x-import component-from-global-scope="GovUiKit.Switch" label="Stage expiration" help-text="This limits the amount of time after the voting period ends for advancing the proposal to the next stage." inline-label="{{expirationLabel}}" checked="{{expiration}}" on-checked-changed="{{onExpiration}}"></x-import>
      <sc-if value="{{expiration}}" hint-placeholder-val="{{no}}">
        <x-import component-from-global-scope="GovUiKit.Card">
          <dc-import name="AdvancedDateInputDuration" vm="{{expirationDuration}}" hint-size="100%,160px"></dc-import>
        </x-import>
      </sc-if>
    </div>
  </x-import>
  <x-import component-from-global-scope="GovUiKit.Dialog.Footer" primary-action="{{primary}}" secondary-action="{{secondary}}"></x-import>
</x-import>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"vm":{"editor":null}}'>
// SETUP_STAGE_SETTINGS dialog (apps/app: modules/createDao/dialogs/setupStageSettingsDialog/setupStageSettingsDialog.tsx and fields/
// setupStageApprovalsField, setupStageDurationField, setupStageEarlyAdvanceField, setupStageExpirationField).
// Props: vm = { open, approve / veto (NumberProgressInput vm | null: shown when the stage has approving / vetoing bodies),
//   duration (AdvancedDateInputDuration vm), hasEarly (no vetoing bodies and at least one body), early, onEarly(checked),
//   expiration (bool), onExpiration(checked), expirationDuration (vm), onSave, onCancel, onClose }.
class Component extends DCLogic {
  renderVals() {
    const vm = this.props.vm || {};
    const noop = () => undefined;
    return { yes: true, no: false, open: vm.open !== false, onOpenChange: (o) => { if (!o && vm.onClose) vm.onClose(); }, noFocus: (e) => e.preventDefault(),
      hasApprove: !!vm.approve, approve: vm.approve || {}, hasVeto: !!vm.veto, veto: vm.veto || {}, duration: vm.duration || {},
      hasEarly: !!vm.hasEarly, early: !!vm.early, earlyLabel: vm.early ? 'Enabled' : 'Disabled', onEarly: vm.onEarly || noop,
      expiration: !!vm.expiration, expirationLabel: vm.expiration ? 'Enabled' : 'Disabled', onExpiration: vm.onExpiration || noop, expirationDuration: vm.expirationDuration || {},
      primary: { label: 'Save', onClick: vm.onSave || noop, type: 'button' }, secondary: { label: 'Cancel', onClick: vm.onCancel || noop } };
  }
}
</script>
</body>
</html>
