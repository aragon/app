<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workspace flow: publish dialog</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/tokens.css">
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/components/bundle.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="proto.css">
<script src="ds/aragon-gov-ui-kit/components/lib/react-hook-form.js"></script>
<script src="ds/aragon-gov-ui-kit/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="GovUiKit.GukModulesProvider">
<x-import component-from-global-scope="GovUiKit.Dialog.Root" open="{{isOpen}}" on-open-change="{{openChange}}" on-open-auto-focus="{{noFocus}}" container-class-name="dlg-container--static" hidden-title="Create workspace" hidden-description="Create workspace dialog">
  <x-import component-from-global-scope="GovUiKit.Dialog.Header" title="Create workspace" on-close="{{close}}"></x-import>
  <x-import component-from-global-scope="GovUiKit.Dialog.Content">
    <div class="workspace-publish">
      <sc-if value="{{is.summary}}" hint-placeholder-val="{{yes}}">
        <div class="workspace-publish__head">
          <x-import component-from-global-scope="GovUiKit.Avatar" alt="{{name}}" size="lg" src="{{avatarUrl}}"></x-import>
          <div class="workspace-publish__title">
            <x-import component-from-global-scope="GovUiKit.Heading" as="h3" size="h4">{{name}}</x-import>
            <p class="workspace-publish__summary">{{summary}}</p>
          </div>
        </div>
        <sc-if value="{{hasDescription}}" hint-placeholder-val="{{no}}">
          <p class="workspace-publish__description">{{description}}</p>
        </sc-if>
      </sc-if>
      <sc-if value="{{is.centered}}" hint-placeholder-val="{{no}}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 8px 0; text-align: center;">
          <x-import component-from-global-scope="GovUiKit.DaoAvatar" name="{{name}}" src="{{avatarUrl}}" size="2xl"></x-import>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
            <x-import component-from-global-scope="GovUiKit.Heading" as="h3" size="h3">{{name}}</x-import>
            <p class="workspace-publish__summary">{{summary}}</p>
          </div>
          <sc-if value="{{hasDescription}}" hint-placeholder-val="{{no}}">
            <p class="workspace-publish__description">{{description}}</p>
          </sc-if>
        </div>
      </sc-if>
      <sc-if value="{{is.details}}" hint-placeholder-val="{{no}}">
        <x-import component-from-global-scope="GovUiKit.DefinitionList.Container">
          <x-import component-from-global-scope="GovUiKit.DefinitionList.Item" term="Name" children="{{name}}"></x-import>
          <sc-if value="{{hasDescription}}" hint-placeholder-val="{{no}}">
            <x-import component-from-global-scope="GovUiKit.DefinitionList.Item" term="Description" children="{{description}}"></x-import>
          </sc-if>
          <x-import component-from-global-scope="GovUiKit.DefinitionList.Item" term="Accounts" children="{{accountNames}}"></x-import>
        </x-import>
      </sc-if>
      <sc-if value="{{is.accounts}}" hint-placeholder-val="{{no}}">
        <div class="workspace-publish__head">
          <x-import component-from-global-scope="GovUiKit.DaoAvatar" name="{{name}}" src="{{avatarUrl}}" size="lg"></x-import>
          <div class="workspace-publish__title">
            <x-import component-from-global-scope="GovUiKit.Heading" as="h3" size="h4">{{name}}</x-import>
            <sc-if value="{{hasDescription}}" hint-placeholder-val="{{no}}">
              <p class="workspace-publish__summary">{{description}}</p>
            </sc-if>
          </div>
        </div>
        <p class="workspace-publish__summary">{{summary}}</p>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <sc-for list="{{accountList}}" as="a" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 1px solid var(--color-neutral-100); border-radius: 12px; background: var(--color-neutral-0);">
              <sc-if value="{{a.isDao}}" hint-placeholder-val="{{yes}}"><x-import component-from-global-scope="GovUiKit.DaoAvatar" name="{{a.name}}" src="{{a.avatar}}" size="md" class-name="shrink-0"></x-import></sc-if>
              <sc-if value="{{a.isSafe}}" hint-placeholder-val="{{no}}"><x-import component-from-global-scope="GovUiKit.Avatar" alt="Safe" src="assets/safeWallet.png" size="md" class-name="shrink-0"></x-import></sc-if>
              <div class="ws-account-item__text">
                <span class="ws-account-item__name">{{a.name}}</span>
                <span class="ws-account-item__meta">{{a.meta}}</span>
              </div>
              <x-import component-from-global-scope="GovUiKit.Tag" label="{{a.tag}}" variant="{{a.tagVariant}}" class-name="shrink-0"></x-import>
            </div>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{isError}}" hint-placeholder-val="{{no}}">
        <x-import component-from-global-scope="GovUiKit.AlertCard" message="Unable to create the workspace" variant="critical">The workspace could not be created. Check your connection and try again.</x-import>
      </sc-if>
      <sc-if value="{{isSuccess}}" hint-placeholder-val="{{no}}">
        <x-import component-from-global-scope="GovUiKit.AlertCard" message="Workspace created" variant="success"></x-import>
      </sc-if>
    </div>
  </x-import>
  <x-import component-from-global-scope="GovUiKit.Dialog.Footer" primary-action="{{primary}}" has-error="{{isError}}"></x-import>
</x-import>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;summary&quot;,&quot;centered&quot;,&quot;details&quot;,&quot;accounts&quot;],&quot;default&quot;:&quot;accounts&quot;},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true},&quot;simulateError&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;workspaceName&quot;:{&quot;editor&quot;:null},&quot;avatarUrl&quot;:{&quot;editor&quot;:null},&quot;description&quot;:{&quot;editor&quot;:null},&quot;accounts&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:0,&quot;max&quot;:4},&quot;accountList&quot;:{&quot;editor&quot;:null},&quot;onClose&quot;:{&quot;editor&quot;:null},&quot;successHref&quot;:{&quot;editor&quot;:null},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
// PUBLISH_WORKSPACE dialog, create mode (apps/app: modules/workspace/dialogs/publishWorkspaceDialog/publishWorkspaceDialog.tsx).
// Not a blockchain transaction: the workspace is stored in the browser registry. Mount it inside the flow, drive `open` from its state:
//   <dc-import name="CreateWorkspaceFlowPublishDialog" open="{{dialogOpen}}" workspace-name="…" accounts="{{n}}" on-close="{{closeDialog}}"
//     success-href="Explore.dc.html" hint-size="100%,1px"></dc-import>
// Props: open; workspaceName, avatarUrl, description (form values); accounts (tweak: how many sample accounts when no accountList is passed);
// onClose (close button, Escape, overlay); successHref (the "View workspace" link, default Explore.dc.html);
// layout (tweak): four ways to lay out what is about to be created.
//   summary  (the app's): avatar, name and the account count on one row, the description under it.
//   centered: a large avatar over the name, count and description, all centred, as an identity card.
//   details:  a definition list (Name, Description, Accounts by name), as a review of what was entered.
//   accounts: a compact header, then one row per account being added (avatar, name, network and address, DAO / Safe).
// accountList: [{ isDao, isSafe, name, avatar, meta, tag, tagVariant }] from the flow. When not given, the `accounts` tweak (0 to 4) says how
//   many sample accounts to show; every layout's count and names come from that one list.
// simulateError (tweak): the save fails -> "Unable to create the workspace", primary "Try again"; switch off and retry to succeed.
// States: idle (primary "Create workspace") -> pending (button loading ~1 s) -> success (AlertCard "Workspace created", primary link "View workspace").
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { status: 'idle' }; this.timer = null; }
  componentDidUpdate(prev) { if (prev.open !== this.props.open) this.reset(); }
  componentWillUnmount() { clearTimeout(this.timer); }
  reset() { clearTimeout(this.timer); this.setState({ status: 'idle' }); }
  publish() {
    this.setState({ status: 'pending' });
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.setState({ status: this.props.simulateError ? 'error' : 'success' }), 1000);
  }
  close() { if (typeof this.props.onClose === 'function') this.props.onClose(); else this.reset(); }
  renderVals() {
    const p = this.props, status = this.state.status;
    const sample = [
      { isDao: true, isSafe: false, name: 'Meridian DAO', avatar: 'assets/mock/avatar/meridian.svg', meta: 'Ethereum · 0xC8C3…BCde', tag: 'DAO', tagVariant: 'primary' },
      { isDao: true, isSafe: false, name: 'Atlas Grants Council', avatar: 'assets/mock/avatar/atlas.svg', meta: 'Ethereum · 0x3115…d368', tag: 'DAO', tagVariant: 'primary' },
      { isDao: false, isSafe: true, name: 'Safe', avatar: '', meta: 'Ethereum · 0x515f…02e2', tag: 'Safe', tagVariant: 'neutral' },
      { isDao: true, isSafe: false, name: 'Northstar Protocol', avatar: 'assets/mock/avatar/northstar.svg', meta: 'Ethereum · 0xA767…A063', tag: 'DAO', tagVariant: 'primary' }
    ];
    // Without a list from the flow, the `accounts` tweak picks how many of the sample accounts are shown, so the count and the names agree.
    const wanted = Math.max(0, Math.min(sample.length, Math.round(Number(p.accounts ?? 3)) || 0));
    const accountList = Array.isArray(p.accountList) ? p.accountList : sample.slice(0, wanted);
    const n = accountList.length;
    const layouts = ['summary', 'centered', 'details', 'accounts'];
    const layout = layouts.includes(p.layout) ? p.layout : 'accounts';
    const is = {}; layouts.forEach((l) => { is[l] = l === layout; });
    let primary;
    if (status === 'success') primary = { label: 'View workspace', href: p.successHref || 'Explore.dc.html' };
    else primary = { label: status === 'error' ? 'Try again' : 'Create workspace', isLoading: status === 'pending', onClick: () => this.publish() };
    return {
      yes: true, no: false, is, accountList,
      accountNames: accountList.map((a) => a.name).join(', ') || 'None',
      isOpen: p.open === undefined ? true : !!p.open,
      name: p.workspaceName || 'Meridian Ecosystem', avatarUrl: p.avatarUrl,
      summary: n + (n === 1 ? ' account' : ' accounts'),
      hasDescription: !!p.description, description: p.description,
      isError: status === 'error', isSuccess: status === 'success', primary,
      noFocus: (e) => e.preventDefault(),
      openChange: (o) => { if (!o) this.close(); },
      close: () => this.close()
    };
  }
}
</script>
</body>
</html>
