// DAO member details (apps/app: modules/governance/pages/daoMemberDetailsPage: delegationSection, voteList, daoProposalList,
// explore/daoList). Mock data: design/baseline-check/data.cjs (Northstar, nadia.eth), data-spp.cjs.
// The list items are written out one by one at the start of the line, not looped or indented: the kit's pagination
// counts the list's direct children, and the canvas runtime counts a loop as one child and indentation as another.
class Component extends DCLogic {
  renderVals() {
    // Kit components print dates relative to the viewer's clock ("2 days ago"), so dates are offsets from now.
    const hour = 3600000;
    const day = 24 * hour;
    const now = Date.now();
    return {
      yes: true, no: false, one: 1, four: 4, two: 2, three: 3, five: 5, seven: 7,
      breadcrumbs: [{ href: 'SppMembers.dc.html', label: 'Members' }, { label: 'nadia.eth' }],
      nadia: { address: '0x9cb2a4c4d6169507a60086dbdb9616ecff27d98a', name: 'nadia.eth', link: 'SppMember.dc.html' },
      dates: {
        v5: now - 8 * day - hour,
        nsp4: now - 4 * day - hour
      },
      daos: { meridian: '0xc8c322384903ee8f11f511b71d0504237886bcde', atlas: '0x31154ff59ea91264c4fd75aba7d8a2fc5a69d368', solace: '0xe2f001c33fca00ad672f2a79abbcd567803178ee', harbor: '0x506b251c4cefd8a679955e7d17c8968b3d994693' },
      addressLink: { href: 'https://etherscan.io/address/0x9cb2a4c4d6169507a60086dbdb9616ecff27d98a', isOnchainEntity: true }
    };
  }
}
