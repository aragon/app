  <main class="wizard-main">
    <form class="wizard-form">
      <dc-import name="WizardProgress" step="{{step}}" total="{{total}}" next-step="Publish DAO" hint-size="100%,36px"></dc-import>

          <div class="wizard-fields">
            <x-import component-from-global-scope="GovUiKit.InputText" label="DAO name" max-length="{{d128}}" value="Meridian Labs" on-change="{{noop}}"></x-import>
            <x-import component-from-global-scope="GovUiKit.InputText" label="ENS subname" max-length="{{d18}}" value="meridian-labs" on-change="{{noop}}" addon=".dao.eth" addon-position="right" is-optional="{{yes}}" help-text="This is a custom onchain identifier for your DAO. It can be used in URLs to access your DAO as well as send assets." wrapper-class-name="w-full md:w-1/2"></x-import>

            <x-import component-from-global-scope="GovUiKit.TextArea" label="Description" help-text="This is shown on the DAO's dashboard and the Explore page so visitors can easily find you." is-optional="{{yes}}" max-length="{{d480}}" value="Meridian is a community-owned protocol for cross-chain liquidity routing. MRD holders steer the treasury and fund public goods." on-change="{{noop}}"></x-import>
          <div class="resources-input">
            <x-import component-from-global-scope="GovUiKit.InputContainer" id="resourcesInput" label="Resources" is-optional="{{yes}}" help-text="These are shown as links on the DAO dashboard. They are best suited for your website, social media, or other communication channels." use-custom-wrapper="{{yes}}"></x-import>
            <div class="resources-input__list">
              <x-import component-from-global-scope="GovUiKit.Card" class-name="shadow-neutral-sm resources-input__item">
                <x-import component-from-global-scope="GovUiKit.InputText" label="URL" placeholder="https://" value="https://meridian.xyz" on-change="{{noop}}"></x-import>
                <x-import component-from-global-scope="GovUiKit.InputText" label="Link text" is-optional="{{yes}}" max-length="{{fourty}}" placeholder="https://meridian.xyz" value="Website" on-change="{{noop}}" wrapper-class-name="border-primary-400 shadow-primary"></x-import>
                <div class="resources-input__menu">
                  <x-import component-from-global-scope="GovUiKit.Button" variant="tertiary" size="lg" icon-left="DOTS_VERTICAL" aria-label="Options"></x-import>
                </div>
              </x-import>
            </div>
            <x-import component-from-global-scope="GovUiKit.Button" variant="tertiary" size="md" icon-left="PLUS" class-name="w-fit">Add</x-import>
          </div>
          </div>
        </div>
        <dc-import name="WizardActions" has-back="{{yes}}" is-last="{{yes}}" submit-label="Publish DAO" back-href="CreateDaoStep1.dc.html" next-href="DialogPublishDao.dc.html" hint-size="100%,48px"></dc-import>
      </div>
    </form>
  </main>
  <dc-import name="Footer" hint-size="100%,65px"></dc-import>
