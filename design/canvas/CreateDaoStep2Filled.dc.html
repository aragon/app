<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create DAO: describe</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/tokens.css">
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="ds/aragon-gov-ui-kit/components/lib/react-hook-form.js"></script>
<script src="ds/aragon-gov-ui-kit/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="GovUiKit.GukModulesProvider">
<div class="app-page">
  <dc-import name="WizardNav" wizard-name="Create DAO" hint-size="100%,91px"></dc-import>
  <main class="wizard-main">
    <form class="wizard-form">
      <dc-import name="WizardProgress" step="{{step}}" total="{{total}}" next-step="Publish DAO" hint-size="100%,36px"></dc-import>
      <div class="wizard-step">
        <dc-import name="CreateDaoFormMetadata" values="{{values}}" is-mainnet="{{yes}}" focus-resource="{{one}}" hint-size="100%,1000px"></dc-import>
        <div class="wizard-step__footer">
          <dc-import name="WizardActions" has-back="{{yes}}" is-last="{{yes}}" submit-label="Publish DAO" back-href="CreateDaoStep1.dc.html" next-href="DialogPublishDao.dc.html" hint-size="100%,48px"></dc-import>
        </div>
      </div>
    </form>
  </main>
  <dc-import name="Footer" hint-size="100%,65px"></dc-import>
</div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1720}}'>
// Create DAO, step 2 filled: "Meridian Labs", ENS "meridian-labs", a description and one resource (Website, https://meridian.xyz) whose
// link text has focus; CreateDaoFormMetadata part with fixed values (values as typed by design/baseline-check/capture-wizards.cjs).
class Component extends DCLogic {
  renderVals() {
    return { yes: true, one: 1, step: 2, total: 2, values: { name: 'Meridian Labs', ens: 'meridian-labs', description: 'Meridian is a community-owned protocol for cross-chain liquidity routing. MRD holders steer the treasury and fund public goods.', resources: [{ id: 1, url: 'https://meridian.xyz', name: 'Website' }] } };
  }
}
</script>
</body>
</html>
