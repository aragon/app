<script type="text/x-dc" data-dc-script data-props='{"on-nav":{"editor":null},"wallet":{"editor":"enum","options":["","connected"],"default":""},"on-connect":{"editor":null},"$preview":{"width":1100,"height":900}}'>
// PART of the Atlas Grants Council prototype. Props: onNav(target), wallet, onConnect. Lifted from MsMembers; connected, nadia.eth carries the You tag.
// DAO members of the multisig DAO (apps/app: modules/governance/pages/daoMembersPage; the multisig plugin registers no
// member list or member panel slot, so the default list and the plugin-info aside card render).
// The list items are written out one by one at the start of the line (the kit's pagination counts direct children).
class Component extends DCLogic {
  // Links to other DAO pages carry href="#nav:<target>"; one delegated handler turns them into onNav(target).
  click = (e) => {
    const a = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (!a) return;
    const h = a.getAttribute('href');
    e.preventDefault();
    if (h && h.indexOf('#nav:') === 0 && this.props.onNav) this.props.onNav(h.slice(5));
  };
  baseVals() {
    return {
      yes: true,
      count: 5,
      pageSize: 5,
      pluginLink: { href: 'https://etherscan.io/address/0x2c50cdfaebb0d839f5efdfd5cb0addc1ab8ca5ae', isOnchainEntity: true },
      launchLink: { href: 'https://etherscan.io/tx/0x145a7ae04cba403de6e76cd3eb13de56deb884cdfb97af3e9de4f224aa7952c3' }
    };
  }
  renderVals() {
    const connected = this.props.wallet === 'connected';
    return Object.assign(this.baseVals(), { click: this.click, connected, disconnected: !connected, mdSize: { md: 'md' } });
  }
}
</script>
