<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workspace account permissions</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/tokens.css">
<link rel="stylesheet" href="ds/aragon-gov-ui-kit/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="ds/aragon-gov-ui-kit/components/lib/react-hook-form.js"></script>
<script src="ds/aragon-gov-ui-kit/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="GovUiKit.GukModulesProvider">
<div class="app-page app-page--sidebar">
  <div class="app-shell">
    <dc-import name="WorkspaceSidebar" active="permissions" scope="account" hint-size="256px,900px"></dc-import>

    <div class="app-column">
      <div class="page-container">
        <header class="page-header">
          <div class="app-container page-header__inner">
            <div class="page-header__row">
              <div class="page-header__text">
                <div class="page-header__title">
                  <x-import component-from-global-scope="GovUiKit.Heading" size="h1">Permissions</x-import>
                  <x-import component-from-global-scope="GovUiKit.Collapsible" button-label-closed="Read more" button-label-opened="Read less" collapsed-lines="{{two}}" class-name="text-base text-neutral-500 md:text-lg">All permissions configured in this DAO — who has access, to which contract, and under what conditions.</x-import>
                </div>
              </div>
            </div>
          </div>
        </header>

        <div class="app-container page-content">
          <main class="page-main">
            <div class="perm-body">
              <dc-import name="PermissionsToolbar" view="list" hide-dao="{{yes}}" hint-size="100%,40px"></dc-import>
              <div class="perm-list">
                <div class="perm-list__header">
                  <div class="perm-list__header-inner">
                    <div class="perm-grid">
                      <span class="perm-label"><span class="perm-label__text">Who</span><span class="perm-info" role="img" aria-label="About Who: The actor that receives the permission and can call the target contract." title="The actor that receives the permission and can call the target contract."><x-import component-from-global-scope="GovUiKit.Icon" icon="INFO" size="sm"></x-import></span></span>
                      <span class="perm-label"><span class="perm-label__text">Where</span><span class="perm-info" role="img" aria-label="About Where: The contract where the permission applies." title="The contract where the permission applies."><x-import component-from-global-scope="GovUiKit.Icon" icon="INFO" size="sm"></x-import></span></span>
                      <span>Permission</span>
                      <span>Condition</span>
                    </div>
                    <span aria-hidden="true" class="perm-list__header-spacer"><x-import component-from-global-scope="GovUiKit.Icon" icon="CHEVRON_DOWN" size="sm"></x-import></span>
                  </div>
                </div>
                <x-import component-from-global-scope="GovUiKit.Accordion.Container" is-multi="{{yes}}">
                <x-import component-from-global-scope="GovUiKit.Accordion.Item" value="row-0">
                  <x-import component-from-global-scope="GovUiKit.Accordion.ItemHeader">
                    <div class="perm-row">
                      <div class="perm-cell"><span class="perm-entity"><x-import component-from-global-scope="GovUiKit.AddressOutput" address="0xa147f2ed0bb4a9739ae43eaf09e5ce318c9c8fda" label="Meridian Token Voting" has-interactive-ancestor="{{yes}}"></x-import><x-import component-from-global-scope="GovUiKit.Tag" label="TOKENVOTING" variant="primary" class-name="perm-tag"></x-import></span></div>
                      <div class="perm-cell"><span class="perm-entity"><x-import component-from-global-scope="GovUiKit.AddressOutput" address="0xc8c322384903ee8f11f511b71d0504237886bcde" label="DAO" has-interactive-ancestor="{{yes}}"></x-import><x-import component-from-global-scope="GovUiKit.DaoAvatar" name="DAO" size="sm"></x-import></span></div>
                      <span class="perm-name">EXECUTE_PERMISSION</span>
                      <span class="perm-condition">-</span>
                    </div>
                  </x-import>
                </x-import>
                </x-import>
              </div>
              <div class="perm-expand">
                <x-import component-from-global-scope="GovUiKit.Button" variant="tertiary" size="md">Expand all</x-import>
              </div>
            </div>
          </main>
        </div>
      </div>

      <div class="app-launcher">
        <button type="button" aria-label="Ask Aragon">
          <x-import component-from-global-scope="GovUiKit.Icon" icon="FEEDBACK" size="md"></x-import>
          <span>Ask Aragon</span>
        </button>
      </div>
    </div>
  </div>
  <dc-import name="Footer" with-sidebar="{{yes}}" hint-size="100%,65px"></dc-import>
</div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
// DAO permissions, list view (apps/app: modules/permissions/pages/daoPermissionsPage/daoPermissionsPageClient.tsx; list:
// modules/settings/components/permissionsList — permissionsListHeader, permissionsListRow, permissionEntityCell).
// Default state: "Hide permissions granted to DAO" is on, which leaves the one grant to the Token Voting plugin.
// Rows are sorted by the Where label like the app; the toolbar (view toggle + filter switches) is the shared part
// PermissionsToolbar.dc.html. Mock data: design/baseline-check/data.cjs (Meridian DAO permissions).
class Component extends DCLogic {
  renderVals() {
    return { yes: true, no: false, two: 2 };
  }
}
</script>
</body>
</html>
