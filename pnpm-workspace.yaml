packages:
  - apps/*
  - packages/*

# Central version pins for dependencies shared across workspaces (https://pnpm.io/catalogs).
# Workspaces reference them as "catalog:"; bumping the version HERE updates every consumer at once
# (run `pnpm up` from the root afterwards). Remember: a catalog bump changes all workspaces, so run
# the full test fan-out and expect releases of every affected workspace.
catalog:
  "@ai-sdk/react": ^4.0.27
  "@aragon/gov-ui-kit": ^2.9.0
  # assistant-ui: pinned EXACT — @assistant-ui/react-ai-sdk bumps the `ai` major in patch
  # releases, so these move only by hand together with a re-check of the ai/@ai-sdk versions.
  "@assistant-ui/react": 0.14.27
  "@assistant-ui/react-ai-sdk": 1.3.41
  "@assistant-ui/react-markdown": 0.14.6
  "@biomejs/biome": ^2.5.3
  "@changesets/changelog-github": ^0.7.0
  "@changesets/cli": ^2.31.0
  "@hono/node-server": ^1.19.14
  "@linear/sdk": ^88.1.0
  "@radix-ui/react-dialog": ^1.1.19
  "@sentry/cli": ^3.6.0
  "@sentry/hono": ^10.65.0
  "@sentry/node": ^10.65.0
  "@sentry/profiling-node": ^10.65.0
  "@tailwindcss/cli": 4.3.2
  "@tailwindcss/typography": ^0.5.20
  "@tanstack/react-query": ^5.101.2
  "@testing-library/dom": ^10.4.1
  "@testing-library/jest-dom": ^6.9.1
  "@testing-library/react": ^16.3.2
  "@testing-library/user-event": ^14.6.1
  "@types/jest": ^30.0.0
  "@types/node": ^24.13.3
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  "@upstash/ratelimit": ^2.0.8
  "@upstash/redis": ^1.38.0
  "@vercel/blob": ^2.6.1
  ai: ^7.0.26
  classnames: ^2.5.1
  cross-env: ^10.1.0
  file-type: ^22.0.1
  hono: ^4.12.30
  husky: ^9.1.7
  jest: ^30.4.2
  jest-environment-jsdom: ^30.4.1
  lint-staged: ^17.0.8
  react: ^19.2.7
  react-dom: ^19.2.7
  react-dropzone: ^15.0.0
  react-hook-form: ^7.81.0
  tailwindcss: ^4.3.2
  ts-jest: ^29.4.11
  tsup: ^8.5.1
  tsx: ^4.23.1
  turbo: ^2.10.5
  typescript: ^5.9.3
  ultracite: 7.8.3
  vercel: ^56.1.0
  viem: ^2.55.2
  wagmi: ^3.7.1
  yaml: ^2.9.0
  zod: ^4.4.3

minimumReleaseAge: 10080 # cooldown period for new packages in minutes (7 days)
minimumReleaseAgeExclude:
  # https://pnpm.io/settings#minimumreleaseageexclude
  - "@aragon/aragon-domain"
  - "@aragon/gov-ui-kit"
  # Deliberately pinned assistant-ui release train (see the exact pins in the catalog above); the
  # widget needs the just-published versions that carry the ai@7 support, so these exact versions
  # are exempt from the new-package cooldown.
  - "@assistant-ui/core@0.2.21"
  - "@assistant-ui/react@0.14.27"
  - "@assistant-ui/react-ai-sdk@1.3.41"
  - "@assistant-ui/react-markdown@0.14.6"
  - "@assistant-ui/store@0.2.20"
  - "@assistant-ui/tap@0.9.4"
  - "assistant-cloud@0.1.35"
  - "assistant-stream@0.3.26"
  - "safe-content-frame@0.0.23"
strictDepBuilds: true
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # False positive: @assistant-ui/react@0.14.27 pins @assistant-ui/store@^0.2.20, and 0.2.20 is a
  # provenance-backed compat release published by the maintainer under the `store-0.2-compat`
  # dist-tag. Because `latest` (0.2.19) is newer by publish date, the no-downgrade heuristic flags
  # it. Scoped to the exact version so every other package stays under the policy.
  - "@assistant-ui/store@0.2.20"
trustPolicyIgnoreAfter: 131400 # skip trust checks for packages published >3 months ago

#npm settings
savePrefix: ^
strictPeerDependencies: true
autoInstallPeers: false
sideEffectsCache: true
preferFrozenLockfile: true
dedupePeerDependents: true
ignoreScripts: true
autoInstallTypes: true
nodeVersion: 24.16.0
engineStrict: true

# pnpm package extensions
packageExtensions:
  '@solana/codecs-strings@*':
    dependencies:
      fastestsmallesttextencoderdecoder: ^1.0.22

# pnpm peer dependency rules
peerDependencyRules:
  allowedVersions:
    '@playwright/test': '>=1.48.2'
    playwright-core: '>=1.48.2'
    ws: '>=7.5.0'

# pnpm overrides
overrides:
  # Hold sanitize-html at 2.17.5: 2.17.6 moved to htmlparser2@^12 (ESM-only, "type":"module"),
  # which Jest can't parse without transformIgnorePatterns work. Drop this once that migration lands.
  sanitize-html@>=2.17.6: 2.17.5
  isomorphic-dompurify>jsdom: 26.1.0
  axios@<1.18.0: '>=1.18.0'
  undici@<6.27.0: ^6.27.0
  next>postcss: ^8.5.12
  '@hookform/devtools>uuid': ^14.0.0
  esbuild@<0.28.1: '>=0.28.1'
  tsup@<8.3.5: ^8.5.1
  '@vercel/fun>@tootallnate/once': ^3.0.1
  tar@<7.5.11: ^7.5.11
  ajv@<8.18.0: ^8.18.0
  minimatch@>=10.0.0 <10.2.4: ^10.2.4
  ws@>=8.0.0 <8.21.0: '>=8.21.0'
  glob@>=10.2.0 <10.5.0: '>=10.5.0'
  smol-toml@<1.6.1: '>=1.6.1'
  srvx@<0.11.13: '>=0.11.13'
  path-to-regexp@>=4.0.0 <6.3.0: '>=6.3.0'
  path-to-regexp@>=8.0.0 <8.4.0: '>=8.4.0'
  lodash@<=4.17.23: '>=4.18.0'
  dompurify@<=3.4.10: '>=3.4.11'
  js-yaml@>=4.0.0 <4.1.2: '>=4.2.0'
  brace-expansion@<1.1.16: ^1.1.16
