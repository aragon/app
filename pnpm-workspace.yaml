packages:
  - apps/*
  - packages/*

# Central version pins for dependencies shared across workspaces (https://pnpm.io/catalogs).
# Workspaces reference them as "catalog:"; bumping the version HERE updates every consumer at once
# (run `pnpm up` from the root afterwards). Remember: a catalog bump changes all workspaces, so run
# the full test fan-out and expect releases of every affected workspace.
catalog:
  "@ai-sdk/react": ^4.0.150
  # assistant-ui: pinned EXACT — @assistant-ui/react-ai-sdk bumps the `ai` major in patch
  # releases, so these move only by hand together with a re-check of the ai/@ai-sdk versions.
  "@assistant-ui/react": 0.15.30
  "@assistant-ui/react-ai-sdk": 1.4.19
  "@assistant-ui/react-markdown": 0.14.23
  "@biomejs/biome": ^2.5.15
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@hono/node-server": ^2.1.5
  "@linear/sdk": ^98.0.0
  # orama: tilde-pinned to the 3.1 line — the assistant persists its documentation index in a
  # shape the runtime re-inserts into Orama, and a major/minor bump can change search behavior.
  "@orama/orama": ~3.1.18
  "@radix-ui/react-dialog": ^1.3.1
  "@sentry/cli": ^3.8.0
  "@sentry/hono": ^10.76.2
  "@sentry/node": ^10.76.2
  "@sentry/profiling-node": ^10.76.2
  "@tailwindcss/cli": 4.3.3
  "@tailwindcss/postcss": ^4.3.3
  "@tailwindcss/typography": ^0.5.20
  "@tanstack/react-query": ^5.104.5
  "@testing-library/dom": ^10.4.2
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.8
  "@types/jest": ^30.0.0
  "@types/mdast": ^4.0.4
  "@types/node": ^24.19.2
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@upstash/ratelimit": ^2.2.0
  "@upstash/redis": ^1.39.0
  "@vercel/blob": ^2.8.2
  # @vitest/coverage-v8: pinned EXACT — it peers on the exact vitest version, so the two move
  # together, by hand.
  "@vitest/coverage-v8": 5.0.5
  ai: ^7.0.146
  ajv: ^8.20.0
  classnames: ^2.5.1
  cross-env: ^10.1.0
  file-type: ^22.2.0
  hono: ^4.13.13
  husky: ^9.1.7
  # jest: held on 30.4 — 30.5 replaces module.register/registerHooks with a throwing stub, and
  # @tailwindcss/node calls one on import, so breakpoints.test.ts cannot load Tailwind.
  jest: ~30.4.2
  jest-environment-jsdom: ~30.4.1
  lint-staged: ^17.6.0
  mdast-util-from-markdown: ^2.1.0
  next: ^16.4.2
  pdf-lib: ^1.17.1
  react: ^19.3.1
  react-dom: ^19.3.1
  react-dropzone: ^20.1.4
  react-hook-form: ^7.90.0
  remark-gfm: ^4.0.1
  sharp: ^0.35.5
  tailwindcss: ^4.3.3
  ts-jest: ^29.4.15
  tsup: ^9.0.0
  tsx: ^4.23.15
  turbo: ^2.11.9
  typescript: ^5.9.3
  # ultracite: pinned EXACT — minor releases add lint rules, which breaks CI for every workspace
  # at once (7.8.3 -> 7.10.6 surfaced ~1400 findings in gov-ui-kit alone). Bump by hand together
  # with the resulting fixes, and keep it in step with @biomejs/biome.
  ultracite: 7.12.2
  # vercel: pinned EXACT — releases after 58.4.4 ship without SLSA provenance and trip the
  # trustPolicy; move by hand once provenance returns (a range would resolve to an untrusted one).
  vercel: 58.4.4
  viem: ^2.57.7
  # vitest: pinned EXACT together with @vitest/coverage-v8 (see there).
  vitest: 5.0.5
  wagmi: ^3.7.7
  yaml: ^2.9.1
  # zod: packages/gov-ui-kit deliberately does NOT take this range — it pins 3.25.76 outright.
  # The kit never imports zod; the pin only fixes the optional-peer key that viem/wagmi resolve
  # under, so the kit and apps/app share one instance (dedupePeerDependents). Drop it and the kit
  # flips to the zod@4 flavour of viem/wagmi — the app's WagmiProvider goes invisible to the kit's
  # hooks (WagmiProviderNotFoundError). Bumping this range must keep the kit's pin in step.
  # packages/aragon-domain pins the same 3.25.76: it does import zod 3, and the shared pin keeps
  # its viem on the app's instance too.
  zod: ^4.6.7

minimumReleaseAge: 10080 # cooldown period for new packages in minutes (7 days)
strictDepBuilds: true
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 131400 # skip trust checks for packages published >3 months ago

#npm settings
savePrefix: ^
strictPeerDependencies: true
autoInstallPeers: false
sideEffectsCache: true
preferFrozenLockfile: true
dedupePeerDependents: true
ignoreScripts: true
nodeVersion: 24.22.1
engineStrict: true

# pnpm package extensions
packageExtensions:
  '@solana/codecs-strings@*':
    dependencies:
      fastestsmallesttextencoderdecoder: ^1.0.22

# pnpm peer dependency rules
peerDependencyRules:
  allowedVersions:
    '@playwright/test': '>=1.48.2'
    playwright-core: '>=1.48.2'
    ws: '>=7.5.0'

# pnpm overrides
overrides:
  # Hold nwsapi (jsdom's selector engine) at 2.2.24: 2.2.25+ rewrote pseudo-class matching and
  # hangs user-event on portal-rendered elements (dperini/nwsapi#214), timing out every dropdown and
  # combobox test; 2.2.28 fixes that but regresses media pseudo-classes (#218). Re-check on the
  # next release.
  nwsapi@>2.2.24: 2.2.24
  # Hold @vercel/oidc at 3.8.1: later releases ship without SLSA provenance and trip the
  # trustPolicy (no-downgrade). Drop this once provenance returns.
  '@vercel/oidc@>3.8.1': 3.8.1
  # Hold @coinbase/cdp-sdk (transitive of @base-org/account) at 1.52.0: 1.55.0 and later lazy-import
  # the optional @x402/* peers, which are not installed (autoInstallPeers: false) and break next
  # build with "Module not found: @x402/core/client". Wallet-adjacent, so don't let it linger:
  # re-test at every deps refresh (drop the override, pnpm install, next build) and remove once it
  # passes.
  '@coinbase/cdp-sdk@>1.52.0': 1.52.0
  # Hold isomorphic-dompurify's jsdom (it declares ^30) at 26: jsdom 27+ depends on ESM-only
  # packages (html-encoding-sniffer 6+) that Jest cannot parse, breaking every suite that imports
  # the sanitizer. Lift together with transformIgnorePatterns work for jsdom's ESM dependencies.
  isomorphic-dompurify>jsdom: 26.1.0
  # Advisory floors for transitive deps: each range mirrors the `pnpm audit` patched version.
  # Re-verify at every refresh by dropping them, `pnpm up -r`, `pnpm audit`, and re-adding only
  # what comes back.
  axios@<1.20.0: '>=1.20.0'
  undici@<6.29.1: ^6.29.1
  '@hookform/devtools>uuid': ^14.0.0
  esbuild@<0.28.1: '>=0.28.1'
  tsup@<8.3.5: ^8.5.1
  '@vercel/fun>@tootallnate/once': ^3.0.1
  tar@<7.5.21: ^7.5.21
  ajv@<8.18.0: ^8.18.0
  minimatch@>=10.0.0 <10.2.4: ^10.2.4
  ws@>=8.0.0 <8.21.0: '>=8.21.0'
  glob@>=10.2.0 <10.5.0: '>=10.5.0'
  smol-toml@<1.9.0: '>=1.9.0'
  path-to-regexp@>=4.0.0 <6.3.0: '>=6.3.0'
  path-to-regexp@>=8.0.0 <8.4.0: '>=8.4.0'
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  postcss-selector-parser@<7.1.6: '>=7.1.6'
  # zod: parent-scoped on purpose — a `zod@<4.6.6` range would also rewrite abitype's peer range
  # and break the 3.25.76 pin of the kit and aragon-domain (see the catalog comment); the 3.x line
  # has no patched release anyway.
  'vercel>zod': ^4.6.6
  '@vercel/cli-auth>zod': ^4.6.6
  '@vercel/cli-config>zod': ^4.6.6
