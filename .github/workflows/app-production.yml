# The "App Production" workflow deploys the app to production when a GitHub Release on an
# @aragon/app@* tag is published (app-release.yml finalize), and by hand for a hotfix tag or a
# re-deploy. The `production` environment requires an approval from @aragon/app-team: the deploy
# pauses there, and the release thread gets the "waiting for approval" ping, the result, the smoke
# tests and finally the head message flipped to Completed with the Linear release closed. The same
# tag then goes to OCC (new.app.aragon.org), the soft-launch environment, with its own smoke run.

name: App Production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (e.g. @aragon/app@1.17.0)"
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag exists
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git ls-remote --tags --exit-code "${{ github.server_url }}/${{ github.repository }}.git" "refs/tags/$TAG" || \
            (echo "::error::Tag '$TAG' does not exist" && exit 1)

  # The repo publishes releases for several workspaces; only app tags deploy the app. The
  # production group sits on this job, not the workflow: a run skipped by the tag guard must not
  # cancel a deploy (or a rollback) waiting for its approval.
  deploy:
    needs: validate
    if: ${{ !cancelled() && (needs.validate.result == 'success' || needs.validate.result == 'skipped') && (github.event_name != 'release' || startsWith(github.event.release.tag_name, '@aragon/app@')) }}
    concurrency:
      group: production-deployment
      cancel-in-progress: true
    uses: aragon/github-templates/.github/workflows/deploy-vercel.yml@v1
    with:
      env: production
      ref: ${{ github.event.release.tag_name || inputs.tag }}
      domain: app.aragon.org
      vercel-scope: aragon-app
      workspace: apps/app
      op-infra-vault: kv_app_infra
      op-env-vault: kv_app_production
      setup-command: pnpm run setup production
      patch-root-directory: true
      version: ${{ github.event.release.tag_name || inputs.tag }}
      gated: true
      slack-thread-release-tag: ${{ github.event.release.tag_name || inputs.tag }}
      next-steps: "If there are issues with the release, use hotfix or rollback."
      op-slack-bot-token-path: op://kv_app_infra/SLACK_BOT_TOKEN/credential
      op-slack-channel-id-path: op://kv_app_infra/SLACK_CHANNEL_ID/credential
      op-slack-codeowners-group-path: op://kv_app_infra/SLACK_CODEOWNERS_GROUP_ID/credential
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  # `validate` is skipped on release events, and a job with a skipped job anywhere in its `needs`
  # chain is skipped too unless its `if` replaces the default success() check.
  e2e:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    uses: aragon/github-templates/.github/workflows/e2e.yml@v1
    with:
      deployment-url: https://app.aragon.org
      environment: production
      working-directory: apps/app
      env-secret-refs: |
        E2E_BYPASS_TOKEN=op://kv_app_infra/E2E_BYPASS_TOKEN/credential
      artifact-viewer-host: gh-artifact-viewer.aragonservices.in
      slack-thread-release-tag: ${{ github.event.release.tag_name || inputs.tag }}
      op-slack-bot-token-path: op://kv_app_infra/SLACK_BOT_TOKEN/credential
      op-slack-channel-id-path: op://kv_app_infra/SLACK_CHANNEL_ID/credential
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  # OCC (new.app.aragon.org) is the production build with its own feature flags and analytics. It
  # ships the same tag right after production, under the approval production already got, with the
  # production secrets, as a production deployment on Vercel (`prod`). A tag older than the OCC
  # environment has no env file to build from, so OCC is skipped for it.
  occ-ready:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check the tag has the OCC env file
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if output=$(gh api -X GET "repos/${{ github.repository }}/contents/apps/app/config/.env.occ" -f ref="$REF" 2>&1); then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP 404" <<< "$output"; then
            echo "::notice::$REF predates the OCC environment; OCC is left as it is"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "$output" >&2
            exit 1
          fi

  deploy-occ:
    needs: [deploy, occ-ready]
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.occ-ready.outputs.ready == 'true' }}
    concurrency:
      group: occ-deployment
      cancel-in-progress: true
    uses: aragon/github-templates/.github/workflows/deploy-vercel.yml@v1
    with:
      env: occ
      prod: true
      ref: ${{ github.event.release.tag_name || inputs.tag }}
      domain: new.app.aragon.org
      vercel-scope: aragon-app
      workspace: apps/app
      op-infra-vault: kv_app_infra
      op-env-vault: kv_app_production
      setup-command: pnpm run setup occ
      patch-root-directory: true
      version: ${{ github.event.release.tag_name || inputs.tag }}
      slack-thread-release-tag: ${{ github.event.release.tag_name || inputs.tag }}
      op-slack-bot-token-path: op://kv_app_infra/SLACK_BOT_TOKEN/credential
      op-slack-channel-id-path: op://kv_app_infra/SLACK_CHANNEL_ID/credential
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  e2e-occ:
    needs: deploy-occ
    if: ${{ !cancelled() && needs.deploy-occ.result == 'success' }}
    uses: aragon/github-templates/.github/workflows/e2e.yml@v1
    with:
      deployment-url: https://new.app.aragon.org
      environment: occ
      working-directory: apps/app
      env-secret-refs: |
        E2E_BYPASS_TOKEN=op://kv_app_infra/E2E_BYPASS_TOKEN/credential
      artifact-viewer-host: gh-artifact-viewer.aragonservices.in
      slack-thread-release-tag: ${{ github.event.release.tag_name || inputs.tag }}
      op-slack-bot-token-path: op://kv_app_infra/SLACK_BOT_TOKEN/credential
      op-slack-channel-id-path: op://kv_app_infra/SLACK_CHANNEL_ID/credential
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  # A manual deploy of an older tag is not a release completing.
  complete:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' && github.event_name == 'release' }}
    uses: aragon/github-templates/.github/workflows/release-complete.yml@v1
    with:
      tag: ${{ github.event.release.tag_name }}
      env: production
      url: https://app.aragon.org
      op-slack-bot-token-path: op://kv_app_infra/SLACK_BOT_TOKEN/credential
      op-slack-channel-id-path: op://kv_app_infra/SLACK_CHANNEL_ID/credential
      op-slack-codeowners-group-path: op://kv_app_infra/SLACK_CODEOWNERS_GROUP_ID/credential
      op-linear-pipeline-key-path: op://kv_app_infra/LINEAR_PIPELINE_ACCESS_KEY/credential
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
