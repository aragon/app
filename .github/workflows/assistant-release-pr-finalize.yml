# The "Assistant Release PR Finalize" workflow runs when a release/assistant/* PR merges: it tags
# the merge commit with the changesets-native per-package tag (@aragon/assistant@x.y.z) and creates
# the GitHub Release with the changelog as notes. Publishing the release triggers the production
# deploy (assistant-production.yml). Unlike the app flow (which tags the staging-tested head SHA),
# the merge commit is tagged here: the assistant release PR has no staging ceremony, and production
# builds from the tag, which must include the merge.

name: Assistant Release PR Finalize

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/assistant/')
    runs-on: ubuntu-latest
    steps:
      - name: Load secrets
        id: secrets
        uses: 1password/load-secrets-action@3a12b0ab99d9cd590a3e9b5a90ea017210ed9556 # v4.0.0 (https://github.com/1Password/load-secrets-action/releases/tag/v4.0.0)
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: '${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}'
          ARABOT_PAT: op://kv_app_infra/ARABOT_PAT/credential

      - name: Checkout actions
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/setup

      # Full checkout + pnpm install at the merge commit (post-merge main), so the scope
      # resolution below reads the current release-scopes policy.
      - name: Setup merge commit
        uses: ./.github/actions/setup
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          token: ${{ steps.secrets.outputs.ARABOT_PAT }}

      # Resolved before the release-branch checkout: releaseScopes.js needs node_modules, which
      # the next checkout's clean removes. The guard itself only needs the pattern.
      - name: Resolve assistant release scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          packages=$(node -e "console.log(require('./.github/workflows/scripts/releaseScopes.js').resolveReleaseScope('assistant').join('|'))")
          echo "pattern=${packages}" >> "$GITHUB_OUTPUT"

      # The guard checks the release-branch head, not the merge commit: the merge commit also
      # carries other PRs' changesets merged to main while the release PR was open, which must
      # not trip it.
      - name: Checkout release branch head
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          token: ${{ steps.secrets.outputs.ARABOT_PAT }}

      - name: "Guard: no new assistant-scope changesets at finalize"
        shell: bash
        env:
          PATTERN: ${{ steps.scope.outputs.pattern }}
        run: |
          set -euo pipefail
          # Scope-aware, mirroring the --ignore scoping in the changeset-version action: this
          # flow versions the whole "assistant" release scope (.github/release-scopes.yml), so
          # any scope changeset still present at finalize was added after `changeset version`
          # ran. Other scopes' changesets (e.g. "@aragon/app") live in .changeset/ continuously
          # and are released by their own flows — they must not trip this guard.
          # A changeset's frontmatter names the bumped package, e.g. `"@aragon/assistant": patch`.
          scope_changesets=$(grep -lE "^\"(${PATTERN})\":" .changeset/*.md 2>/dev/null || true)
          if [ -n "$scope_changesets" ]; then
            echo "Found new assistant-scope changesets at finalize. Policy: do not add new changesets to an existing release. Cancel and start a new one." >&2
            echo "$scope_changesets" >&2
            exit 1
          fi

      - name: Checkout merge commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 1
          token: ${{ steps.secrets.outputs.ARABOT_PAT }}

      - name: Get version
        id: version
        uses: martinbeentjes/npm-get-version-action@3cf273023a0dda27efcd3164bdfb51908dd46a5b # v1.3.1 (https://github.com/martinbeentjes/npm-get-version-action/releases/tag/v1.3.1)
        with:
          path: apps/assistant

      # Per-package tag in the changesets-native format (@aragon/assistant@0.2.0).
      - name: Compute release tag
        id: release-tag
        env:
          VERSION: ${{ steps.version.outputs.current-version }}
        run: echo "name=@aragon/assistant@${VERSION}" >> $GITHUB_OUTPUT

      - name: Read changelog
        id: changelog
        uses: ./.github/actions/read-changelog
        with:
          version: ${{ steps.version.outputs.current-version }}
          path: ./apps/assistant/CHANGELOG.md

      - name: Build release notes
        id: notes
        uses: ./.github/actions/build-release-notes
        with:
          changes: ${{ steps.changelog.outputs.changes }}
          path: release-notes.md

      - name: Create tag on merge commit
        id: tag
        uses: ./.github/actions/gh-ensure-tag
        with:
          tag: ${{ steps.release-tag.outputs.name }}
          sha: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Create GitHub Release
        id: release
        uses: ./.github/actions/gh-ensure-release
        with:
          tag: ${{ steps.release-tag.outputs.name }}
          title: Release ${{ steps.release-tag.outputs.name }}
          notes_path: ${{ steps.notes.outputs.path }}
          token: ${{ steps.secrets.outputs.ARABOT_PAT }}
