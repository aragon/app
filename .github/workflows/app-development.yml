# The "App Development" workflow runs the repo-wide checks (type checking, linting, tests, the
# published CSS bundle, changesets) on pull requests and pushes to main, and deploys main to
# dev.app.aragon.org. Release PRs run the same checks in app-release.yml instead.

name: App Development

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        uses: aragon/github-templates/steps/setup@main
        with:
          fetch-depth: "0"
      - name: Check workflow job guards
        uses: aragon/github-templates/steps/workflow-guards@main
      - name: Check types
        run: pnpm type-check
      - name: Check linter with formatter
        run: pnpm lint:check
      - name: Run tests with coverage
        run: |
          set -eo pipefail
          pnpm test:coverage
      # Repo-wide Turbo task; today only @aragon/gov-ui-kit defines it, verifying that the
      # committed build.css still matches a source compile before it can be published.
      - name: Check published CSS bundles
        run: pnpm css:check
      # The design system syncs from these files; an unrefreshed registry blocks the sync. Every PR,
      # not just kit ones: build.css is a Tailwind compile whose version is pinned in the root
      # catalog, so a dependency-only PR can stale the registry too. PR-only: every change reaches
      # main through a PR, and a docs artifact never blocks the dev deploy.
      - name: Check GovKit component registry
        if: github.event_name == 'pull_request'
        run: |
          pnpm --filter @aragon/gov-ui-kit build
          node packages/gov-ui-kit/design-system/component-registry/registry.mjs check
          node packages/gov-ui-kit/design-system/component-registry/selection-guide.mjs check
      # Release and hotfix branches are already versioned; fixes merged into them need no changeset.
      - name: Check changeset
        if: github.event_name == 'pull_request' && !startsWith(github.base_ref, 'release/') && !startsWith(github.base_ref, 'hotfix/')
        run: pnpm changeset status --since origin/main
      # `changeset status` passes on any changeset, so an app changeset could cover kit source changes
      # that then never ship to npm. Kit source changes carry their own kit changeset, also inside an
      # app feature PR. The scope mirrors `changedFilePatterns` (src/**) minus stories and tests,
      # which never reach npm.
      - name: Check GovKit changeset
        if: github.event_name == 'pull_request' && !startsWith(github.base_ref, 'release/') && !startsWith(github.base_ref, 'hotfix/')
        run: |
          if git diff --quiet origin/main...HEAD -- packages/gov-ui-kit/src ':!*.stories.tsx' ':!*.test.ts' ':!*.test.tsx'; then exit 0; fi
          # Added, not modified: touching an existing kit changeset would pass without describing this
          # change. A second change in the same release window gets its own changeset file.
          added=$(git diff --name-only --diff-filter=A origin/main...HEAD -- '.changeset/*.md')
          if [ -z "$added" ] || ! printf '%s\n' "$added" | xargs grep -qE "^[\"']?@aragon/gov-ui-kit[\"']?:"; then
            echo "::error::GovKit source changed: add a changeset for '@aragon/gov-ui-kit' (pnpm changeset), separate from any app changeset."
            exit 1
          fi

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: aragon/github-templates/.github/workflows/deploy-vercel.yml@main
    with:
      env: development
      domain: dev.app.aragon.org
      vercel-scope: aragon-app
      workspace: apps/app
      op-infra-vault: kv_app_infra
      op-env-vault: kv_app_development
      setup-command: pnpm run setup development
      patch-root-directory: true
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  e2e:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: aragon/github-templates/.github/workflows/e2e.yml@main
    with:
      deployment-url: https://dev.app.aragon.org
      environment: development
      working-directory: apps/app
      env-secret-refs: |
        E2E_BYPASS_TOKEN=op://kv_app_infra/E2E_BYPASS_TOKEN/credential
      artifact-viewer-host: gh-artifact-viewer.aragonservices.in
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
