# The "Assistant Release" workflow is the assistant's release PR lifecycle, on the shared
# aragon/github-templates modules: a start every Wednesday (or by hand) cuts release/assistant/<timestamp>
# with the changesets bump of the "assistant" release scope (the service plus its version-only
# packages) and opens the "Release @aragon/assistant@x.y.z" PR with its Slack thread; every push to
# that PR refreshes the summary, runs the checks and the LLM smoke; merging tags the PR head and
# publishes the GitHub Release, which starts the production deploy (assistant-production.yml);
# closing it without a merge cancels the release. Linear mirrors the release in the "Assistant"
# pipeline.
#
# The PR head is tagged, as in every release flow: it is the commit the checks ran on, and the
# merge commit would also carry whatever landed on main while the PR was open (an in-scope
# changeset merged in the meantime tripped the finalize guard of 0.3.1). Release PRs are merged
# with a merge commit so the head stays in main's history. The release content is smoked where it
# already runs: dev.assistant.aragon.org serves main, which the release branch only bumps. A
# scheduled start green-skips when a release PR is open or there is nothing to release.

name: Assistant Release

on:
  schedule:
    - cron: "17 15 * * 3"
  workflow_dispatch:
    inputs:
      base_commit:
        description: "Commit SHA to start the release from (default: main HEAD)"
        required: false
        type: string
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# One run per PR: a push supersedes the previous run; the close runs (finalize, cancel) get a
# group of their own, so they are never cancelled.
concurrency:
  group: assistant-release-${{ github.event.pull_request.number || github.run_id }}${{ github.event.action == 'closed' && '-closed' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  start:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: aragon/github-templates/.github/workflows/release-start.yml@main
    with:
      engine: changesets
      base-ref: ${{ inputs.base_commit || 'main' }}
      package-dir: apps/assistant
      tag-prefix: "@aragon/assistant@"
      scope: assistant
      release-branch-prefix: release/assistant/
      branch-suffix: timestamp
      commit-message: "Release {tag}"
      summary-path-filter: assistant
      on-active-release: ${{ github.event_name == 'schedule' && 'skip' || 'fail' }}
      op-release-token-path: op://kv_app_infra/ARABOT_PAT/credential
      op-gpg-key-path: op://kv_app_infra/arabot-1_SIGN_CERTS/private_key
      op-gpg-passphrase-path: op://kv_app_infra/arabot-1_SIGN_CERTS/credential
      op-slack-bot-token-path: op://kv_app_infra/SLACK_BOT_TOKEN/credential
      op-slack-channel-id-path: op://kv_app_infra/SLACK_CHANNEL_ID/credential
      op-slack-codeowners-group-path: op://kv_app_infra/SLACK_CODEOWNERS_GROUP_ID/credential
      op-linear-token-path: op://kv_app_infra/LINEAR_API_TOKEN/credential
      op-linear-pipeline-key-path: op://kv_app_infra/LINEAR_PIPELINE_ACCESS_KEY_ASSISTANT/credential
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  refresh:
    if: >
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && startsWith(github.event.pull_request.head.ref, 'release/assistant/')
    uses: aragon/github-templates/.github/workflows/release-pr-refresh.yml@main
    with:
      release-branch-prefix: release/assistant/
      tag-prefix: "@aragon/assistant@"
      summary-path-filter: assistant
      op-release-token-path: op://kv_app_infra/ARABOT_PAT/credential
      op-linear-token-path: op://kv_app_infra/LINEAR_API_TOKEN/credential
      op-slack-bot-token-path: op://kv_app_infra/SLACK_BOT_TOKEN/credential
      op-slack-channel-id-path: op://kv_app_infra/SLACK_CHANNEL_ID/credential
      op-slack-codeowners-group-path: op://kv_app_infra/SLACK_CODEOWNERS_GROUP_ID/credential
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  test:
    if: >
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && startsWith(github.event.pull_request.head.ref, 'release/assistant/')
    runs-on: ubuntu-latest
    # Runs the PR head's scripts on a read-only token; pushes and tags go through ARABOT_PAT.
    permissions:
      contents: read
    steps:
      - name: Setup
        uses: aragon/github-templates/steps/setup@main
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: "0"
      - name: Check types
        run: pnpm type-check
      - name: Check linter with formatter
        run: pnpm lint:check
      - name: Run tests with coverage
        run: pnpm test:coverage

  # Not a required check: a red smoke is a signal to read the conversations, not a merge gate.
  # The result lands in the release thread and as a PR comment, a failure also in the alerts
  # channel.
  smoke:
    if: >
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && startsWith(github.event.pull_request.head.ref, 'release/assistant/')
    # What the called workflow asks for: `actions: read` for the deploy-run lookup,
    # `pull-requests: write` for the result comment.
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/assistant-llm-smoke.yml
    with:
      url: https://dev.assistant.aragon.org
      thread-pr-number: ${{ github.event.pull_request.number }}
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  finalize:
    if: >
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/assistant/')
    uses: aragon/github-templates/.github/workflows/release-finalize.yml@main
    with:
      sha: ${{ github.event.pull_request.head.sha }}
      pr-body: ${{ github.event.pull_request.body }}
      package-dir: apps/assistant
      tag-prefix: "@aragon/assistant@"
      changesets-guard: assistant
      after-release-note: "Production deploy to assistant.aragon.org will start automatically."
      op-release-token-path: op://kv_app_infra/ARABOT_PAT/credential
      op-slack-bot-token-path: op://kv_app_infra/SLACK_BOT_TOKEN/credential
      op-slack-channel-id-path: op://kv_app_infra/SLACK_CHANNEL_ID/credential
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  cancel:
    if: >
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.merged == false
      && startsWith(github.event.pull_request.head.ref, 'release/assistant/')
    uses: aragon/github-templates/.github/workflows/release-pr-cancel.yml@main
    with:
      op-release-token-path: op://kv_app_infra/ARABOT_PAT/credential
      op-slack-bot-token-path: op://kv_app_infra/SLACK_BOT_TOKEN/credential
      op-slack-channel-id-path: op://kv_app_infra/SLACK_CHANNEL_ID/credential
      op-slack-codeowners-group-path: op://kv_app_infra/SLACK_CODEOWNERS_GROUP_ID/credential
      op-linear-pipeline-key-path: op://kv_app_infra/LINEAR_PIPELINE_ACCESS_KEY_ASSISTANT/credential
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
