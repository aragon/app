# The "Assistant LLM Smoke" workflow runs a few real conversations (real models, real Linear
# team of the target environment) against a deployed assistant instance. It is deliberately
# NON-BLOCKING: it is not a required check anywhere — a red run is a signal to look at prompt or
# pipeline drift, not a merge gate. Tickets land in the Linear team configured for the target
# environment (a test team everywhere except production).
#
# Triggers: nightly, after every development deploy, and manually against any URL.

name: Assistant LLM Smoke

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_run:
    workflows: ["Assistant Development"]
    types: [completed]
  workflow_dispatch:
    inputs:
      url:
        description: "Assistant base URL to smoke"
        required: false
        default: "https://dev.assistant.aragon.org"

permissions:
  contents: read

jobs:
  smoke:
    # For post-deploy runs only fire when the deploy actually succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc

      # The assistant domains sit behind Vercel's bot challenge; the smoke's plain fetches pass it
      # with the "Protection Bypass for Automation" secret of the assistant Vercel project.
      # continue-on-error: a missing vault item degrades to today's behavior (403 on every
      # scenario) instead of failing the job earlier with a different error.
      - name: Load secrets
        id: secrets
        continue-on-error: true
        uses: 1password/load-secrets-action@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.0.0 (https://github.com/1Password/load-secrets-action/releases/tag/v4.0.0)
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: '${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}'
          VERCEL_AUTOMATION_BYPASS_SECRET: op://kv_assistant_infra/VERCEL_AUTOMATION_BYPASS_SECRET/credential

      - name: Run LLM smoke scenarios
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ steps.secrets.outputs.VERCEL_AUTOMATION_BYPASS_SECRET || '' }}
        run: node apps/assistant/scripts/llmSmoke.mjs "${{ inputs.url || 'https://dev.assistant.aragon.org' }}"
