# The "Assistant LLM Smoke" workflow runs a few real conversations (real models, real Linear
# team of the target environment) against a deployed assistant. It runs on the release PR
# (called from assistant-release.yml against dev.assistant.aragon.org, which serves main — the
# release content — since the assistant has no staging), after a development deploy, after a
# production deploy, and by hand against any URL. It is deliberately NON-BLOCKING: it is not a
# required check anywhere — a red run is a signal to look at prompt or pipeline drift, not a
# merge gate. The result is posted to the release thread when there is one (the release PR, a
# production deploy), as a comment on the release PR, and a failure to the Slack alerts channel
# always. Tickets land in the
# Linear team of the target environment (a test team everywhere except production), so against
# production the ticket scenario stops at the draft and creates nothing.

name: Assistant LLM Smoke

on:
  workflow_call:
    inputs:
      url:
        description: "Assistant base URL to smoke"
        required: true
        type: string
      thread-pr-number:
        description: "Release PR whose body carries the Slack thread marker (0 = none)"
        required: false
        type: number
        default: 0
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true
  workflow_run:
    workflows: ["Assistant Development", "Assistant Production"]
    types: [completed]
  workflow_dispatch:
    inputs:
      url:
        description: "Assistant base URL to smoke"
        required: false
        default: "https://dev.assistant.aragon.org"

permissions:
  contents: read
  # The jobs of the deploy run, to tell a deploy from a green skip.
  actions: read

jobs:
  smoke:
    # For post-deploy runs only fire when the deploy workflow succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.target.outputs.url }}
      host: ${{ steps.target.outputs.host }}
      deployed: ${{ steps.target.outputs.deployed }}
      release-tag: ${{ steps.target.outputs.release_tag }}
      scenarios: ${{ steps.scenarios.outputs.lines }}
    steps:
      # A deploy workflow that green-skipped its deploy (a push to main that left the assistant
      # untouched, a release of another workspace) changed nothing to smoke. A production deploy
      # run is triggered by the GitHub Release, so its head branch is the release tag — the key to
      # the release thread. Against production the ticket scenario must not file in the real
      # support team.
      - name: Resolve the target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ github.event.workflow_run.name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          deployed=true
          release_tag=""
          url="${INPUT_URL:-https://dev.assistant.aragon.org}"
          if [ "$EVENT" = "workflow_run" ]; then
            deployed=$(gh api "repos/${{ github.repository }}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100" \
              --jq 'any(.jobs[]; .name == "deploy / deploy" and .conclusion == "success")')
            if [ "$SOURCE" = "Assistant Production" ]; then
              url=https://assistant.aragon.org
              case "$SOURCE_HEAD_BRANCH" in @aragon/assistant@*) release_tag="$SOURCE_HEAD_BRANCH" ;; esac
            fi
          fi
          host="${url#https://}"
          host="${host%%/*}"
          create_tickets=true
          [ "$host" = "assistant.aragon.org" ] && create_tickets=false
          echo "${SOURCE:-$EVENT}: deployed=${deployed} url=${url} create_tickets=${create_tickets} release_tag=${release_tag:-none}"
          {
            echo "deployed=${deployed}"
            echo "url=${url}"
            echo "host=${host}"
            echo "create_tickets=${create_tickets}"
            echo "release_tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.target.outputs.deployed == 'true'
        uses: actions/checkout@v7.0.1

      - name: Setup node
        if: steps.target.outputs.deployed == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      # The assistant domains sit behind Vercel's bot challenge; the smoke's plain fetches pass it
      # with the "Protection Bypass for Automation" secret of the assistant Vercel project.
      # continue-on-error: a missing vault item degrades to today's behavior (403 on every
      # scenario) instead of failing the job earlier with a different error.
      - name: Resolve 1Password secrets
        if: steps.target.outputs.deployed == 'true'
        id: op
        continue-on-error: true
        uses: aragon/github-templates/steps/credential-retrieval@main
        with:
          mode: byref
          op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          secret-refs: |
            VERCEL_AUTOMATION_BYPASS_SECRET=op://kv_assistant_infra/VERCEL_AUTOMATION_BYPASS_SECRET/credential

      - name: Run LLM smoke scenarios
        if: steps.target.outputs.deployed == 'true'
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ fromJSON(steps.op.outputs.secrets || '{}').VERCEL_AUTOMATION_BYPASS_SECRET || '' }}
          ASSISTANT_SMOKE_CREATE_TICKETS: ${{ steps.target.outputs.create_tickets }}
          URL: ${{ steps.target.outputs.url }}
        run: |
          set -o pipefail
          node apps/assistant/scripts/llmSmoke.mjs "$URL" | tee smoke.log

      # One line per scenario for the PR comment, whatever the outcome.
      - name: Collect the scenario results
        if: ${{ !cancelled() && steps.target.outputs.deployed == 'true' }}
        id: scenarios
        run: |
          {
            echo 'lines<<SCENARIOS'
            [ -f smoke.log ] && grep -E '^(OK|FAIL) ' smoke.log | cut -c1-300 | sed -E 's/^OK /- ✅ /; s/^FAIL /- ❌ /' || true
            echo 'SCENARIOS'
          } >> "$GITHUB_OUTPUT"

  # The result goes to the release thread it belongs to: the release PR's (called from the
  # release workflow) or the deployed release's (a production deploy). The PAT reads the PR body
  # for the marker; the job token of the calling workflow cannot.
  notify-result:
    needs: smoke
    if: ${{ !cancelled() && needs.smoke.outputs.deployed == 'true' && ((inputs.thread-pr-number || 0) != 0 || needs.smoke.outputs.release-tag != '') }}
    uses: aragon/github-templates/.github/workflows/notify.yml@main
    with:
      kind: tests
      suite: LLM smoke
      env: ${{ needs.smoke.outputs.host }}
      result: ${{ needs.smoke.result == 'success' && 'passed' || 'failed' }}
      report-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      thread-pr-number: ${{ inputs.thread-pr-number || 0 }}
      thread-release-tag: ${{ needs.smoke.outputs.release-tag }}
      op-release-token-path: op://kv_app_infra/ARABOT_PAT/credential
      op-slack-bot-token-path: op://kv_app_infra/SLACK_BOT_TOKEN/credential
      op-slack-channel-id-path: op://kv_app_infra/SLACK_CHANNEL_ID/credential
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  # On the release PR the result is also a comment, where the checks list buries it among the
  # skipped jobs of the other workspaces' release workflows. One comment per PR, edited on rerun.
  comment:
    needs: smoke
    if: ${{ !cancelled() && needs.smoke.outputs.deployed == 'true' && (inputs.thread-pr-number || 0) != 0 }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment the result
        uses: aragon/github-templates/steps/gh-ensure-pr-comment@main
        with:
          tag: llm-smoke
          pr-number: ${{ inputs.thread-pr-number }}
          token: ${{ github.token }}
          message: |
            **LLM smoke on ${{ needs.smoke.outputs.host }}: ${{ needs.smoke.result == 'success' && '✅ passed' || '❌ failed' }}**

            ${{ needs.smoke.outputs.scenarios }}

            [View run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  # The smoke gates nothing, so a red run is also told where someone reads it: the alerts channel.
  notify-failure:
    needs: smoke
    if: ${{ failure() }}
    uses: aragon/github-templates/.github/workflows/notify.yml@main
    with:
      kind: failure
      subject: "Assistant LLM smoke on ${{ needs.smoke.outputs.url }}"
      op-slack-bot-token-path: op://kv_app_infra/SLACK_BOT_TOKEN/credential
      op-slack-channel-id-path: op://kv_app_infra/SLACK_ALERTS_CHANNEL_ID/credential
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
