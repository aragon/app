name: Gov UI Kit Publish

# Registered as the npm Trusted Publisher for @aragon/gov-ui-kit. THE FILENAME IS PART OF THAT
# REGISTRATION — renaming this file breaks publishing, and it fails as what looks like an auth
# error. The publish steps run INLINE here (no reusable workflow) so the workflow identity in the
# OIDC token always matches the registered publisher; npm rejects the token exchange with a 404 if
# a reusable/called workflow runs the publish instead.
#
#   - release event           -> stable publish (`latest`), gated by the npm-publish approval
#   - manual workflow_dispatch -> snapshot publish (snapshot-<run-id> tag)
#
# `--provenance` verifies that `repository.url` in packages/gov-ui-kit/package.json matches THIS
# repository, so it must point at aragon/app with `"directory": "packages/gov-ui-kit"`.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC trusted publishing
  contents: read

jobs:
  release:
    # The repo publishes releases for several packages (@aragon/app@*, @aragon/assistant@*), and
    # they all raise `release: published`. Without this prefix guard every app release would try
    # to publish the kit.
    if: >
      github.event_name == 'release' &&
      startsWith(github.event.release.tag_name, '@aragon/gov-ui-kit@')
    runs-on: ubuntu-latest
    # Human approval gate: the `npm-publish` environment is configured in repo Settings →
    # Environments with @aragon/app-team as required reviewers, so every stable release publish
    # must be approved before this job runs.
    environment: npm-publish
    steps:
      - name: Checkout actions
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/setup

      - name: Setup
        uses: ./.github/actions/setup
        with:
          # Build from the tag, never from a branch. This job waits on the npm-publish approval,
          # so the gap between tagging and building is unbounded — anything merged to main in the
          # meantime would otherwise be published under the tagged version, with --provenance
          # attesting the wrong commit. The tag carries the version bump by construction: finalize
          # tags the release PR's merge commit, which is where `changeset version` landed.
          # Same pattern as app-production.yml and assistant-production.yml.
          ref: ${{ github.event.release.tag_name }}
          # MUST stay empty. The setup action defaults registry-url to the npm registry, which
          # makes actions/setup-node write a user-level .npmrc containing a placeholder
          # NODE_AUTH_TOKEN — that shadows OIDC trusted publishing and the publish fails.
          registry-url: ""

      - name: Build library
        run: pnpm --filter @aragon/gov-ui-kit build

      # Last gate before the bundle reaches npm: `build.css` shipped corrupted in 2.8.1 and 2.9.0
      # and nothing in the repo renders or parses it, so this comparison against a fresh compile
      # is the only thing that catches it.
      - name: Check published CSS bundle
        run: pnpm --filter @aragon/gov-ui-kit css:check

      - name: Publish library
        # Authenticated via OIDC trusted publishing (id-token). No auth token.
        # --provenance emits a signed build-provenance attestation.
        run: pnpm --filter @aragon/gov-ui-kit publish --access public --no-git-checks --provenance

  snapshot:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Load secrets
        id: load-secrets
        uses: 1password/load-secrets-action@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.0.0 (https://github.com/1Password/load-secrets-action/releases/tag/v4.0.0)
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: '${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}'
          ARABOT_PAT: op://kv_app_infra/ARABOT_PAT/credential

      - name: Checkout actions
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/setup

      - name: Setup
        uses: ./.github/actions/setup
        with:
          # Full history so `changeset status --since origin/main` can diff.
          fetch-depth: 0
          token: ${{ steps.load-secrets.outputs.ARABOT_PAT }}
          # See the note in the release job — required for OIDC publishing.
          registry-url: ""

      - name: Check changeset
        run: pnpm changeset status --since origin/main

      - name: Build library
        run: pnpm --filter @aragon/gov-ui-kit build

      # Same gate as the stable publish — a snapshot is a real publish to npm.
      - name: Check published CSS bundle
        run: pnpm --filter @aragon/gov-ui-kit css:check

      # Deliberately NOT scoped to the gov-ui-kit release scope. `--snapshot` versions every
      # package with a pending changeset, but nothing here is committed — the bumps live only in
      # the runner's working tree, and the publish step below only publishes the kit. Scoping it
      # would add `--ignore` handling for no benefit.
      - name: Update version
        run: pnpm changeset version --snapshot
        env:
          GITHUB_TOKEN: ${{ steps.load-secrets.outputs.ARABOT_PAT }}

      - name: Get package version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@3cf273023a0dda27efcd3164bdfb51908dd46a5b # v1.3.1 (https://github.com/martinbeentjes/npm-get-version-action/releases/tag/v1.3.1)
        with:
          path: packages/gov-ui-kit

      - name: Publish snapshot
        # Authenticated via OIDC trusted publishing (id-token). No auth token.
        # --provenance emits a signed build-provenance attestation.
        run: pnpm --filter @aragon/gov-ui-kit publish --access public --tag snapshot-${{ github.run_id }} --no-git-checks --provenance

      - name: Print snapshot version
        run: echo "Snapshot release - ${{ steps.package-version.outputs.current-version }} published with tag 'snapshot-${{ github.run_id }}'"