# Assistant Production — deploys the assistant service to assistant.aragon.org when an
# @aragon/assistant@* GitHub Release is published (assistant-release.yml finalize), and by hand for
# a re-deploy of an existing tag (rollback = dispatch an older tag, or use Vercel instant rollback).
# It builds the tag with the knowledge-base commit its dev deploy recorded (the `assistant/corpus`
# status of the tagged commit, see assistant-release.yml), so production answers from the pages
# the release tested; a tag without the status never reached dev and is refused. The `production`
# environment requires an approval from @aragon/app-team; the release thread gets the "waiting for
# approval" ping, the result and the head message flipped to Completed.

name: Assistant Production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (e.g. @aragon/assistant@0.2.0)"
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # The repo publishes releases for several workspaces; only assistant tags deploy the service.
  corpus:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, '@aragon/assistant@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
    steps:
      - name: Read the knowledge-base commit the release tested
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          # The tagged commit: the tag's own entry for a lightweight tag, its peeled one (^{}, listed
          # last) for an annotated tag.
          sha="$(git ls-remote "$SERVER/$REPO.git" "refs/tags/$TAG" "refs/tags/$TAG^{}" | awk 'END { print $1 }')"
          [ -n "$sha" ] || { echo "::error::Tag '$TAG' does not exist" >&2; exit 1; }
          commit="$(gh api "repos/$REPO/commits/$sha/status" --jq '.statuses[] | select(.context == "assistant/corpus") | .description')"
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::$TAG carries no assistant/corpus status: it never reached dev" >&2
            exit 1
          fi
          echo "Knowledge base: aragon/platform-doc@$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  # The production group sits on this job, not the workflow: a run skipped by the tag guard must
  # not cancel a deploy waiting for its approval.
  deploy:
    needs: corpus
    concurrency:
      group: assistant-production-deployment
      cancel-in-progress: true
    uses: aragon/github-templates/.github/workflows/deploy-vercel.yml@v1
    with:
      env: production
      ref: ${{ github.event.release.tag_name || inputs.tag }}
      domain: assistant.aragon.org
      vercel-scope: aragon-app
      workspace: apps/assistant
      op-infra-vault: kv_assistant_infra
      op-env-vault: kv_assistant_production
      setup-command: pnpm run setup production
      # The build reads the private aragon/platform-doc knowledge base; build-time only.
      op-build-secret-refs: DOCS_REPO_TOKEN=op://kv_app_infra/ARABOT_PAT/credential
      env-overrides: DOCS_CORPUS_REF=${{ needs.corpus.outputs.commit }}
      # VERCEL_ENV=production maps correctly at runtime; only the secrets need lifting.
      runtime-env-keys: "AI_GATEWAY_API_KEY LINEAR_API_KEY LINEAR_TEAM_ID UPSTASH_REDIS_REST_URL UPSTASH_REDIS_REST_TOKEN BLOB_READ_WRITE_TOKEN CRON_SECRET SENTRY_DSN"
      upload-sentry-source-maps: true
      version: ${{ github.event.release.tag_name || inputs.tag }}
      gated: true
      slack-thread-release-tag: ${{ github.event.release.tag_name || inputs.tag }}
      op-slack-bot-token-path: op://kv_app_infra/SLACK_BOT_TOKEN/credential
      op-slack-channel-id-path: op://kv_app_infra/SLACK_CHANNEL_ID/credential
      op-slack-codeowners-group-path: op://kv_app_infra/SLACK_CODEOWNERS_GROUP_ID/credential
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  # A manual deploy of an older tag is not a release completing.
  complete:
    needs: deploy
    if: github.event_name == 'release'
    uses: aragon/github-templates/.github/workflows/release-complete.yml@v1
    with:
      tag: ${{ github.event.release.tag_name }}
      env: production
      url: https://assistant.aragon.org
      op-slack-bot-token-path: op://kv_app_infra/SLACK_BOT_TOKEN/credential
      op-slack-channel-id-path: op://kv_app_infra/SLACK_CHANNEL_ID/credential
      op-slack-codeowners-group-path: op://kv_app_infra/SLACK_CODEOWNERS_GROUP_ID/credential
      op-linear-pipeline-key-path: op://kv_app_infra/LINEAR_PIPELINE_ACCESS_KEY_ASSISTANT/credential
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
