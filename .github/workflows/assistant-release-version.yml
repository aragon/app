# The "Assistant Release Version" workflow prepares the "Version Packages: assistant" pull request
# ON DEMAND (trunk-based: merging to main never starts a release by itself). Dispatching it
# recreates the changeset-release/assistant branch from main, applies `changeset version` scoped to
# the assistant domain packages, and opens/updates the PR with the accumulated version bump and
# CHANGELOG. Merging that PR is the release act — the finalize workflow tags it
# (@aragon/assistant@x.y.z) and the tag triggers the production deploy.

name: Assistant Release Version

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Load secrets
        id: load-secrets
        uses: 1password/load-secrets-action@3a12b0ab99d9cd590a3e9b5a90ea017210ed9556 # v4.0.0 (https://github.com/1Password/load-secrets-action/releases/tag/v4.0.0)
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: '${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}'
          GPG_PASSPHRASE: op://kv_app_infra/arabot-1_SIGN_CERTS/credential
          GPG_PRIVATE_KEY: op://kv_app_infra/arabot-1_SIGN_CERTS/private_key
          ARABOT_PAT: op://kv_app_infra/ARABOT_PAT/credential

      - name: Checkout actions
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/setup

      - name: Setup
        uses: ./.github/actions/setup
        with:
          token: ${{ steps.load-secrets.outputs.ARABOT_PAT }}
          fetch-depth: 0
          ref: main

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0 (https://github.com/crazy-max/ghaction-import-gpg/releases/tag/v7.0.0)
        with:
          gpg_private_key: ${{ steps.load-secrets.outputs.GPG_PRIVATE_KEY }}
          passphrase: ${{ steps.load-secrets.outputs.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Recreate version branch from main
        run: git checkout -B changeset-release/assistant main

      # This flow owns the assistant domain: @aragon/assistant plus its version-only contracts
      # package. App-scoped packages are versioned by the app release flow (app-release-start.yml),
      # which symmetrically scopes to @aragon/app.
      # NOTE: @aragon/assistant-chat ownership will be decided when the widget package lands
      # (Feature/Wire-up PR).
      - name: Update version and changelog
        uses: ./.github/actions/changeset-version
        with:
          scope: "@aragon/assistant @aragon/assistant-contracts"
          prettier_changelog: "true"
          github_token: ${{ steps.load-secrets.outputs.ARABOT_PAT }}

      - name: Detect version changes
        id: changes
        run: echo "dirty=$([ -n "$(git status --porcelain)" ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Get package version
        if: steps.changes.outputs.dirty == 'true'
        id: package-version
        uses: martinbeentjes/npm-get-version-action@3cf273023a0dda27efcd3164bdfb51908dd46a5b # v1.3.1 (https://github.com/martinbeentjes/npm-get-version-action/releases/tag/v1.3.1)
        with:
          path: apps/assistant

      - name: Commit and push version branch
        if: steps.changes.outputs.dirty == 'true'
        run: |
          git add --all
          git commit -m "Version @aragon/assistant@${{ steps.package-version.outputs.current-version }}"
          git push --force origin changeset-release/assistant

      - name: Ensure Pull Request
        if: steps.changes.outputs.dirty == 'true'
        uses: ./.github/actions/gh-ensure-pr
        with:
          base: main
          head: changeset-release/assistant
          title: "Version Packages: assistant (@aragon/assistant@${{ steps.package-version.outputs.current-version }})"
          body: |
            Accumulated version bump and changelog for the assistant service, maintained automatically
            from pending changesets on `main`.

            **Merging this PR releases `@aragon/assistant@${{ steps.package-version.outputs.current-version }}`**:
            the merge is tagged and the tag triggers the production deploy to assistant.aragon.org.
          token: ${{ steps.load-secrets.outputs.ARABOT_PAT }}
