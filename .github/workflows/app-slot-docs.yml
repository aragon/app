# Validates that generated slot documentation is up to date with source code.
# Triggers on PRs that touch slot enums, plugin registrations, or the docs themselves.

name: App Slot Docs

on:
  pull_request:
    paths:
      - 'apps/app/src/modules/*/constants/moduleSlots.ts'
      - 'apps/app/src/modules/*/constants/moduleDaoSlots.ts'
      - 'apps/app/src/plugins/*/index.ts'
      - 'apps/app/docs/slots/**'
      - 'apps/app/scripts/generateSlotDocs.mjs'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Validate slot docs are up to date
        run: node scripts/generateSlotDocs.mjs --check
        working-directory: apps/app
