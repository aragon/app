# The "Aragon Domain Contract Test" workflow runs the contract suite of packages/aragon-domain against
# a deployed aragon-indexer. The unit suite runs on canned indexer responses, so a shape change in the
# deployed indexer would otherwise surface only in production. Deliberately NON-BLOCKING: not a
# required check anywhere — a red run means the indexer and the mappers' zod schemas disagree.

name: Aragon Domain Contract Test

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      env:
        description: "Environment whose indexer to test (selects the kv_app_<env> vault)"
        type: choice
        options: [development]
        default: development

permissions:
  contents: read

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The indexer coordinates are the ones the deployed app reads: the same two items of the
      # app's per-environment vault that the deploys write into apps/app/.env.
      - name: Resolve 1Password secrets
        id: op
        uses: aragon/github-templates/steps/credential-retrieval@main
        with:
          mode: byref
          op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          secret-refs: |
            ENVIO_GRAPHQL_ENDPOINT=op://kv_app_${{ inputs.env || 'development' }}/NEXT_SECRET_ENVIO_GRAPHQL_ENDPOINT/credential
            ENVIO_API_TOKEN=op://kv_app_${{ inputs.env || 'development' }}/NEXT_SECRET_ENVIO_API_TOKEN/credential

      - name: Setup
        uses: aragon/github-templates/steps/setup@main

      # The suite skips itself when the endpoint is unset (describe.skipIf in test/contract); an empty
      # vault item must fail the run, not green-skip it.
      - name: Run contract suite
        env:
          ENVIO_GRAPHQL_ENDPOINT: ${{ fromJSON(steps.op.outputs.secrets).ENVIO_GRAPHQL_ENDPOINT }}
          ENVIO_API_TOKEN: ${{ fromJSON(steps.op.outputs.secrets).ENVIO_API_TOKEN }}
        run: |
          : "${ENVIO_GRAPHQL_ENDPOINT:?empty — check the 1Password item}"
          pnpm --filter @aragon/aragon-domain test:contract
