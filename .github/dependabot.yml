version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "patch"
          - "minor"
        # Version-locked / high-blast-radius families: exclude from the auto-bundle
        # so they update via dedicated PRs. @tiptap/* must move as one family
        # (a split dedupes to two @tiptap/core copies and fails type-check);
        # react-hook-form 7.84 changed runtime behavior and broke a test.
        # The tiptap deps live in packages/gov-ui-kit; react-hook-form is a root
        # catalog entry shared by the app, assistant-chat and the kit.
        exclude-patterns:
          - "@tiptap/*"
          - "tiptap-markdown"
          - "react-hook-form"
      storybook:
        patterns:
          - "@storybook*"
          - "storybook"

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*/action.yaml"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "patch"
          - "minor"
