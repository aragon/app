version: 2
updates:
  # Security updates only: npm versions move in the manual deps-update PRs, which respect the
  # holds in pnpm-workspace.yaml. A limit of 0 turns version updates off; security update PRs
  # don't count against it.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  # The release and deploy flows call aragon/github-templates through its moving major tag (`@v1`):
  # a fix there reaches every repo at once, and this is what proposes the next major (`@v2`).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Same 7-day quarantine as pnpm's minimumReleaseAge.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - "patch"
          - "minor"
