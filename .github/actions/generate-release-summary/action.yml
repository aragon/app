name: Generate Release Summary
description: |
  Generates the detailed, team-facing PR/Slack summary from the package's release commit range
  (previous release tag → HEAD). The outward-facing release notes are built separately from the
  changesets-generated CHANGELOG (see the finalize flow).

inputs:
  package_name:
    description: Package name used to discover <package>@* release tags
    required: true
  path_filter:
    description: Named workspace filter from .github/filters.yml
    required: true
  linear_api_token:
    description: Linear API token for fetching issue titles (optional)
    required: false
    default: ""
  base_ref:
    description: |
      Override the release boundary ref (optional, not recommended).
      Auto-detection uses the latest <package>@* tag: everything the tag already contains is
      excluded, so PRs merged to main while that release was staging still get summarized here.
      Only use this for debugging or edge cases.
    required: false
    default: ""
  filters_path:
    description: Path to the central workspace path mapper
    required: false
    default: ".github/filters.yml"

outputs:
  summary:
    description: Generated summary markdown
    value: ${{ steps.summary.outputs.summary }}

runs:
  using: composite
  steps:
    - id: summary
      shell: bash
      env:
        PACKAGE_NAME: ${{ inputs.package_name }}
        PATH_FILTER: ${{ inputs.path_filter }}
        LINEAR_API_TOKEN: ${{ inputs.linear_api_token }}
        BASE_REF: ${{ inputs.base_ref }}
        FILTERS_PATH: ${{ inputs.filters_path }}
      run: |
        set -euo pipefail
        node .github/workflows/scripts/generateReleaseSummary.js

