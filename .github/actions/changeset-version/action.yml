name: Changeset Version
description: Runs `pnpm changeset version` scoped to a release scope from .github/release-scopes.yml and formats the changed CHANGELOG files (idempotent when no changesets).

inputs:
  scope:
    description: Name of a release scope in .github/release-scopes.yml; all workspace packages outside that scope are passed to changesets as --ignore. Empty = version everything.
    required: false
    default: ""
  prettier_changelog:
    description: Whether to format the changed CHANGELOG files with prettier
    required: false
    default: "true"
  github_token:
    description: GitHub token for changesets (optional but recommended)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        SCOPE: ${{ inputs.scope }}
        PRETTIER_CHANGELOG: ${{ inputs.prettier_changelog }}
      run: |
        set -euo pipefail
        # Workflows name the release scope they own; the central mapper resolves it to packages
        # and the inversion into changesets --ignore flags happens here, in one place, so flows
        # stay declarative.
        IGNORE_FLAGS=()
        if [ -n "$SCOPE" ]; then
          SCOPE_PACKAGES=$(node -e "console.log(require('./.github/workflows/scripts/releaseScopes.js').resolveReleaseScope(process.argv[1]).join(' '))" "$SCOPE")
          while IFS= read -r PACKAGE; do
            case " $SCOPE_PACKAGES " in
              *" $PACKAGE "*) ;;
              *) IGNORE_FLAGS+=(--ignore "$PACKAGE") ;;
            esac
          done < <(pnpm m ls --json --depth -1 | node -p "JSON.parse(require('node:fs').readFileSync(0, 'utf8')).filter((pkg) => pkg.name && pkg.path !== process.cwd()).map((pkg) => pkg.name).join('\n')")
        fi
        pnpm changeset version "${IGNORE_FLAGS[@]}"
        if [ "$PRETTIER_CHANGELOG" = "true" ]; then
          CHANGED_CHANGELOGS=$(git status --porcelain | awk '{ print $2 }' | grep 'CHANGELOG\.md$' || true)
          if [ -n "$CHANGED_CHANGELOGS" ]; then
            # shellcheck disable=SC2086
            pnpm dlx prettier --write --prose-wrap never $CHANGED_CHANGELOGS
          fi
        fi
