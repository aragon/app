<script type="text/babel" data-presets="react">
const {AddressesInput,Button,Card,Heading,Tag,ToggleGroup,Toggle,AlertInline,GukModulesProvider,DebugContextProvider,TranslationsProvider,BlockNavigationContextProvider,WizardPage,enTranslations,useFormContext}=window.GovUiKit;
const {useEffect,useState}=React;

const A={a:'0x17C6808fA04DC9de98eaCfeb4c66B352067c1cDD',b:'0x9d0920D3D7c9F28baF0abed7f2E26A5126cc0786',c:'0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045'};
const PRESETS={
  empty:{label:'Empty row',members:[{address:''}],validate:false},
  populated:{label:'3 members',members:[{address:A.a},{address:A.b},{address:A.c}],validate:false},
  invalid:{label:'Invalid address',members:[{address:A.a},{address:'0x4b2f9c1a-not-an-address'}],validate:true},
  duplicate:{label:'Duplicate member',members:[{address:A.a},{address:A.b},{address:A.a}],validate:true}
};

/* Forces the react-hook-form validators to run on mount so the error states are the
   component's real output, not a hand-drawn mock. */
const ValidationPrimer=({name,count})=>{
  const {trigger,getValues,setValue}=useFormContext();
  useEffect(()=>{
    let cancelled=false;
    /* AddressInput fires onAccept asynchronously per row and rewrites the field value,
       which clears a programmatically-set error. Mark each row touched+dirty so the
       Item's own re-trigger effect keeps validating, and re-run after that settles. */
    const run=async()=>{
      for(let i=0;i<count;i++){
        if(cancelled){return;}
        const field=`${name}.[${i}]`;
        setValue(field,getValues(field),{shouldTouch:true,shouldDirty:true});
        await trigger(field);
      }
    };
    const ids=[300,1200,2200].map((d)=>setTimeout(()=>{void run();},d));
    return()=>{cancelled=true;ids.forEach(clearTimeout);};
  },[trigger,getValues,setValue,name,count]);
  return null;
};

/* App-owned composition: the Container owns the field array, so the number of
   Item children has to track it. We read the array off the form context. */
const MemberRows=({name})=>{
  const {watch}=useFormContext();
  const members=watch(name)??[];
  return members.map((_,index)=><AddressesInput.Item index={index} key={index} />);
};

const MembersStep=({preset})=>(
  <WizardPage.Container
    defaultValues={{members:preset.members}}
    finalStep="Deploy your DAO"
    initialSteps={[{id:'members',order:0,meta:{name:'Members'}}]}
    onSubmit={()=>undefined}
    submitHelpText="Nothing is deployed in this prototype — the step is for member entry only."
    submitLabel="Continue"
  >
    <WizardPage.Step
      description="Add the wallets that can create and approve proposals. You can paste an address or an ENS name, and change members later through a proposal."
      id="members"
      meta={{name:'Members'}}
      order={0}
      title="Add multisig members"
    >
      <div className="flex w-full flex-col gap-4">
        <AddressesInput.Container
          helpText="The multisig executes an action once enough members approve."
          label="Members"
          name="members"
        >
          <MemberRows name="members" />
        </AddressesInput.Container>
        {preset.validate&&<ValidationPrimer count={preset.members.length} name="members" />}
      </div>
    </WizardPage.Step>
  </WizardPage.Container>
);

const Prototype=({presetKey})=>{
  const preset=PRESETS[presetKey]??PRESETS.empty;
  return (
    <DebugContextProvider>
      <TranslationsProvider translations={enTranslations}>
        <GukModulesProvider>
          <BlockNavigationContextProvider>
            <div className="mx-auto flex w-full max-w-3xl flex-col px-4 py-6 md:px-8 md:py-10">
              <MembersStep key={presetKey} preset={preset} />
            </div>
          </BlockNavigationContextProvider>
        </GukModulesProvider>
      </TranslationsProvider>
    </DebugContextProvider>
  );
};

const NOTES={
  empty:'Initial state. One row, no value. The remove control is disabled because the list must keep at least one row.',
  populated:'Three example addresses loaded as form defaults. Remove is enabled on every row; “More” exposes reset fields / clear all.',
  invalid:'Second row fails addressesListUtils.validateAddress → “Address is not valid.” Validation runs live in this prototype.',
  duplicate:'Third row repeats row 1, caught by checkIsAlreadyInList → “Address has already been added.” The earlier occurrence stays clean.'
};

const HANDOFF=[
  {title:'Composition',body:[
    'Kit (reusable, @aragon/gov-ui-kit): AddressInput — the row control, with ENS/address toggle, explorer link, copy, clear, paste. Card, Button, Dropdown, AlertInline, InputContainer all come from the kit too.',
    'App-owned: AddressesInput.Container + .Item (apps/app/src/shared/components/forms/addressesInput/…) own the list semantics — field array, add, remove, the min-one-row rule, the More menu (Reset fields / Clear all) and the member-specific error copy.',
    'Step chrome: WizardPage.Container + WizardPage.Step render the progress bar, title/description and the back/next footer. Nothing was rebuilt; the only new code is a wrapper that renders one .Item per field-array entry.'
  ]},
  {title:'Providers and form state',body:[
    'DebugContextProvider → TranslationsProvider (translations={enTranslations}) → GukModulesProvider (AddressInput reads wagmi/react-query context) → BlockNavigationContextProvider → WizardPage.Container.',
    'WizardPage.Container owns the react-hook-form instance (Wizard.Root calls useForm({mode:"onTouched", defaultValues})), so no FormWrapper is needed here. Field shape: members: Array<{ address: string; name?: string }>, passed as defaultValues.',
    'Outside a wizard (e.g. a dialog), wrap in the exported FormWrapper instead — array-backed lists hydrate only from defaultValues.',
    'AddressesInput.Container owns the useFieldArray; child .Item count must track it. This prototype reads the array with useFormContext().watch(name) and maps one .Item per entry — in the app, source that count from the same form state.'
  ]},
  {title:'Validation responsibilities',body:[
    'Component: .Item registers rules {required: true, validate: addressesListUtils.validateAddress} → returns app.shared.addressesInput.item.input.error.invalid for a non-address and .alreadyInList when an earlier row holds the same address (isAddressEqual, so case-insensitive). AddressInput itself handles EIP-55 checksum feedback and ENS resolution.',
    'Caller: pass customValidator (member) => …, chainId, and disabled per row for anything product-specific (e.g. excluded addresses). Threshold and body-level rules are out of scope for this step.',
    'Field values only update on AddressInput onAccept, i.e. once a value resolves — a half-typed address leaves the previous form value in place.'
  ]},
  {title:'State transitions',body:[
    'Empty → typed: one row on entry; remove is disabled while length === 1 (allowEmptyList is not set).',
    'Add: appends { address: "" } unless onAddClick is supplied. Remove: drops the row and keeps at least one.',
    'Errors surface per row under the input and clear when the value becomes valid — .Item re-triggers validation whenever a row holds a valid address and is dirty or touched, so fixing row 3 also clears a stale duplicate error.',
    'More menu appears only with 2+ rows; Reset fields shows only when rows are dirty and non-empty or an error exists.'
  ]},
  {title:'Source references',body:[
    'AddressesInput: components/forms/AddressesInput/AddressesInput.prompt.md (Default / Filled / ChecksumError examples). The .d.ts there is a generic stub — the real prop contract was read from the bundle: _ds_bundle.js (addressesInputContainer.tsx: children, name, fieldPrefix, label, helpText, allowEmptyList, onAddClick, showResetAllAction; addressesInputItem.tsx: index, disabled, customValidator, chainId).',
    'AddressInput props and states: components/general/AddressInput/AddressInput.prompt.md. Error copy: enTranslations → app.shared.addressesInput.*. WizardPage: components/wizards/WizardPage/WizardPage.prompt.md.'
  ]},
  {title:'Limits and departures',body:[
    'Demonstrated live in this prototype: add/remove with the min-one-row rule, invalid-address and duplicate-member messages (produced by the real validators, primed on load so the states are visible without typing), and the responsive row layout.',
    'Not exercised: ENS resolution and the on-accept path. The prototype has no wallet and no RPC, so the row avatar sits in its loading state and typed values do not resolve — treat ENS and checksum feedback as illustrative until run against a provider.',
    'Deliberate departures: the wizard is a single step with a stubbed onSubmit, and the state/viewport bar above the frame is prototype scaffolding, not part of the design.',
    'Missing from the bundle: no member-entry step component exists above AddressesInput, and AddressesInput has no variant-grid states for invalid/duplicate — only Default, Filled and ChecksumError.'
  ]}
];

const Handoff=()=>(
  <div className="flex w-full flex-col gap-4 border-t border-neutral-100 bg-neutral-0 px-4 py-8 md:px-8">
    <Heading size="h4">Implementation handoff</Heading>
    <div className="grid gap-4 md:grid-cols-2">
      {HANDOFF.map((s)=>(
        <Card className="flex flex-col gap-2 border border-neutral-100 p-5" key={s.title}>
          <span className="font-semibold text-neutral-800 text-sm">{s.title}</span>
          <ul className="flex flex-col gap-2">
            {s.body.map((line,i)=><li className="text-neutral-500 text-sm leading-normal" key={i}>{line}</li>)}
          </ul>
        </Card>
      ))}
    </div>
  </div>
);

const Shell=()=>{
  const [presetKey,setPresetKey]=useState('empty');
  const [viewport,setViewport]=useState('desktop');
  const src=`Multisig Members Step.html?frame=1&state=${presetKey}`;
  const mobile=viewport==='mobile';
  return (
    <DebugContextProvider>
      <TranslationsProvider translations={enTranslations}>
        <div className="flex min-h-screen w-full flex-col">
          <div className="flex w-full flex-col gap-4 border-b border-neutral-100 bg-neutral-0 px-4 py-4 md:px-8">
            <div className="flex flex-col gap-1">
              <div className="flex flex-wrap items-center gap-2">
                <Heading size="h4">Multisig setup · member entry</Heading>
                <Tag label="Prototype" variant="primary" />
              </div>
              <p className="text-neutral-500 text-sm">Built on <span className="text-neutral-800">AddressesInput</span> (App-owned) over the kit’s <span className="text-neutral-800">AddressInput</span>, inside <span className="text-neutral-800">WizardPage</span>.</p>
            </div>
            <div className="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
              <div className="flex flex-col gap-1">
                <span className="text-neutral-500 text-xs">State</span>
                <ToggleGroup isMultiSelect={false} onChange={(v)=>v&&setPresetKey(v)} value={presetKey}>
                  {Object.entries(PRESETS).map(([key,p])=><Toggle key={key} label={p.label} value={key} />)}
                </ToggleGroup>
              </div>
              <div className="flex flex-col gap-1">
                <span className="text-neutral-500 text-xs">Viewport</span>
                <ToggleGroup isMultiSelect={false} onChange={(v)=>v&&setViewport(v)} value={viewport}>
                  <Toggle label="Desktop" value="desktop" />
                  <Toggle label="Mobile 390" value="mobile" />
                </ToggleGroup>
              </div>
            </div>
            <AlertInline message={NOTES[presetKey]} variant="info" />
          </div>
          <div className="flex w-full grow justify-center bg-neutral-50 p-4 md:p-8">
            <div className="w-full overflow-hidden rounded-xl border border-neutral-100 bg-neutral-0 shadow-neutral-sm" style={{maxWidth:mobile?390:'100%'}}>
              <iframe id="shell-frame" key={src+viewport} src={src} style={{height:mobile?820:760}} title="Member entry step" />
            </div>
          </div>
          <Handoff />
        </div>
      </TranslationsProvider>
    </DebugContextProvider>
  );
};

const params=new URLSearchParams(location.search);
const root=ReactDOM.createRoot(document.getElementById('ds-root'));
root.render(params.get('frame')==='1'?<Prototype presetKey={params.get('state')||'empty'} />:<Shell />);
</script>
